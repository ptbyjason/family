<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Adventure Creator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Patrick+Hand&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #e91e90;
    --purple: #7c3aed;
    --blue: #2563eb;
    --teal: #0d9488;
    --gold: #f59e0b;
    --green: #16a34a;
    --red: #dc2626;
    --bg: #0f0a1a;
    --card: #1a1230;
    --text: #f0e6ff;
    --muted: #a89cc8;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield background */
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 800px; margin: 0 auto; padding: 20px;
  }

  /* Header */
  .header {
    text-align: center; padding: 30px 0 20px;
  }
  .header h1 {
    font-size: 2.4em;
    background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header p { color: var(--muted); font-size: 1.1em; }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    margin: 16px 0 24px;
  }
  .stat {
    background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3);
    border-radius: 20px; padding: 8px 18px; font-size: 0.95em;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .icon { font-size: 1.2em; }
  .stat .val { font-weight: 700; color: var(--gold); }

  /* Main card */
  .card {
    background: var(--card);
    border: 1px solid rgba(124,58,237,0.2);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Story text */
  .story-text {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.35em;
    line-height: 1.7;
    color: #e8dff5;
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .story-text .highlight {
    color: var(--gold);
    font-weight: 700;
    cursor: help;
    border-bottom: 2px dotted var(--gold);
    position: relative;
  }

  /* Scene image area */
  .scene-image {
    width: 100%;
    height: 200px;
    border-radius: 16px;
    margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 5em;
    position: relative;
    overflow: hidden;
  }
  .scene-image .scene-bg {
    position: absolute; inset: 0;
    opacity: 0.3;
  }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(37,99,235,0.2));
    border: 2px solid rgba(124,58,237,0.4);
    border-radius: 14px;
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
    font-size: 1.1em;
    cursor: pointer;
    transition: all 0.3s;
    text-align: left;
    display: flex; align-items: center; gap: 12px;
  }
  .choice-btn:hover {
    border-color: var(--purple);
    background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(37,99,235,0.35));
    transform: translateX(6px);
    box-shadow: 0 0 20px rgba(124,58,237,0.3);
  }
  .choice-btn .choice-icon { font-size: 1.4em; }

  /* Quiz section */
  .quiz-section {
    background: rgba(245,158,11,0.08);
    border: 2px solid rgba(245,158,11,0.3);
    border-radius: 16px;
    padding: 24px;
    margin-top: 20px;
  }
  .quiz-section h3 {
    color: var(--gold);
    font-size: 1.2em;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt {
    background: rgba(245,158,11,0.1);
    border: 2px solid rgba(245,158,11,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
    font-size: 1.05em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .quiz-opt:hover {
    border-color: var(--gold);
    background: rgba(245,158,11,0.2);
  }
  .quiz-opt.correct {
    border-color: var(--green);
    background: rgba(22,163,74,0.2);
    animation: popCorrect 0.4s ease;
  }
  .quiz-opt.wrong {
    border-color: var(--red);
    background: rgba(220,38,38,0.15);
    animation: shake 0.4s ease;
  }
  @keyframes popCorrect {
    0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Vocab popup */
  .vocab-popup {
    display: none;
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #231845; border: 2px solid var(--gold);
    border-radius: 20px; padding: 30px; z-index: 100;
    max-width: 400px; width: 90%; text-align: center;
    box-shadow: 0 0 40px rgba(245,158,11,0.3);
  }
  .vocab-popup.show { display: block; animation: fadeUp 0.3s ease; }
  .vocab-word { font-size: 1.6em; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .vocab-def { color: var(--muted); font-size: 1.1em; margin-bottom: 16px; line-height: 1.5; }
  .vocab-close {
    background: var(--gold); color: #000; border: none; border-radius: 10px;
    padding: 10px 24px; font-family: 'Quicksand', sans-serif; font-size: 1em;
    font-weight: 700; cursor: pointer;
  }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 99;
  }
  .overlay.show { display: block; }

  /* Feedback banner */
  .feedback {
    text-align: center; padding: 16px; border-radius: 14px;
    margin-top: 16px; font-size: 1.15em; font-weight: 600;
    animation: fadeUp 0.4s ease;
  }
  .feedback.good {
    background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.4);
    color: #4ade80;
  }
  .feedback.try-again {
    background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3);
    color: #f87171;
  }

  /* Progress trail */
  .trail {
    display: flex; align-items: center; gap: 4px;
    justify-content: center; margin: 12px 0 20px; flex-wrap: wrap;
  }
  .trail-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(124,58,237,0.3); border: 1px solid rgba(124,58,237,0.5);
    transition: all 0.3s;
  }
  .trail-dot.visited { background: var(--purple); box-shadow: 0 0 8px rgba(124,58,237,0.5); }
  .trail-dot.current { background: var(--gold); box-shadow: 0 0 10px rgba(245,158,11,0.5); border-color: var(--gold); }
  .trail-arrow { color: var(--muted); font-size: 0.7em; }

  /* Inventory */
  .inventory {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    margin: 8px 0;
  }
  .inv-item {
    background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px; padding: 6px 14px; font-size: 0.9em;
    display: flex; align-items: center; gap: 6px;
    animation: fadeUp 0.3s ease;
  }

  /* Start screen */
  .start-screen { text-align: center; padding: 40px 20px; }
  .start-screen h2 {
    font-size: 2em;
    background: linear-gradient(135deg, var(--gold), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .start-screen p { color: var(--muted); font-size: 1.15em; margin-bottom: 24px; line-height: 1.6; }

  .story-select {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-top: 20px;
  }
  @media (max-width: 600px) { .story-select { grid-template-columns: 1fr; } }

  .story-card {
    background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(37,99,235,0.1));
    border: 2px solid rgba(124,58,237,0.3);
    border-radius: 18px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .story-card:hover {
    border-color: var(--purple);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(124,58,237,0.25);
  }
  .story-card .sc-icon { font-size: 3em; margin-bottom: 12px; }
  .story-card .sc-title { font-size: 1.2em; font-weight: 700; margin-bottom: 6px; }
  .story-card .sc-desc { color: var(--muted); font-size: 0.95em; }

  /* End screen */
  .end-screen { text-align: center; }
  .end-screen h2 {
    font-size: 2em; margin-bottom: 12px;
    background: linear-gradient(135deg, var(--gold), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .end-stats {
    display: flex; gap: 16px; justify-content: center; margin: 20px 0; flex-wrap: wrap;
  }
  .end-stat {
    background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3);
    border-radius: 14px; padding: 16px 24px; text-align: center;
  }
  .end-stat .es-val { font-size: 2em; font-weight: 700; color: var(--gold); }
  .end-stat .es-label { color: var(--muted); font-size: 0.9em; }

  .play-again-btn {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none; border-radius: 14px;
    padding: 14px 36px; color: white;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.15em; font-weight: 700;
    cursor: pointer; margin-top: 16px;
    transition: all 0.3s;
  }
  .play-again-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(124,58,237,0.4); }

  .continue-btn {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    border: none; border-radius: 12px;
    padding: 12px 28px; color: white;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.05em; font-weight: 600;
    cursor: pointer; margin-top: 12px;
    transition: all 0.3s;
    display: none;
  }
  .continue-btn:hover { transform: scale(1.03); }
  .continue-btn.show { display: inline-block; animation: fadeUp 0.3s ease; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="overlay" id="overlay" onclick="closeVocab()"></div>
<div class="vocab-popup" id="vocabPopup">
  <div class="vocab-word" id="vocabWord"></div>
  <div class="vocab-def" id="vocabDef"></div>
  <button class="vocab-close" onclick="closeVocab()">Got it! ✨</button>
</div>

<div class="container">
  <div class="header">
    <h1>✨ Story Adventure ✨</h1>
    <p>Read, choose, and learn your way through magical tales!</p>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat"><span class="icon">⭐</span> Stars: <span class="val" id="starsCount">0</span></div>
    <div class="stat"><span class="icon">📖</span> Words Learned: <span class="val" id="wordsCount">0</span></div>
    <div class="stat"><span class="icon">✅</span> Questions: <span class="val" id="questionsCount">0/0</span></div>
    <div class="stat"><span class="icon">📍</span> Chapter: <span class="val" id="chapterNum">1</span></div>
  </div>

  <div class="trail" id="trail" style="display:none;"></div>
  <div class="inventory" id="inventory"></div>

  <div class="card" id="mainCard">
    <!-- Content injected by JS -->
  </div>
</div>

<script>
// ─── Game State ───
let state = {
  stars: 0,
  wordsLearned: [],
  questionsRight: 0,
  questionsTotal: 0,
  chapter: 0,
  inventory: [],
  currentStory: null,
  visitedNodes: [],
  currentNode: null,
  quizAnswered: false
};

// ─── Starfield ───
(function createStars() {
  const el = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s;`;
    el.appendChild(s);
  }
})();

// ─── STORIES DATA ───
const STORIES = {
  enchanted_forest: {
    title: "The Enchanted Forest",
    icon: "🌲",
    desc: "Explore a magical forest full of mysteries",
    nodes: {
      start: {
        emoji: "🌲🌙",
        bg: "linear-gradient(135deg, #0a3d0a, #1a0a3d)",
        text: `You stand at the edge of a vast, enchanted forest. The trees are so tall they seem to touch the stars. Tiny fireflies dance between the branches, making the whole forest glow with a soft, golden light.

A wooden sign reads: "Welcome, brave adventurer! The Forest of Whispers awaits."

You notice two paths ahead. One is covered in soft, green moss. The other is lined with sparkling blue mushrooms that seem to hum a quiet tune.`,
        vocab: [
          { word: "vast", definition: "Very large or wide — covering a huge area. The ocean is vast!" },
          { word: "enchanted", definition: "Under a magical spell — made magical and wonderful." }
        ],
        quiz: {
          question: "What makes the forest glow with golden light?",
          options: ["The moon", "Fireflies", "The mushrooms", "Magic lanterns"],
          correct: 1
        },
        choices: [
          { text: "Take the mossy green path", icon: "🌿", next: "mossy_path" },
          { text: "Follow the glowing blue mushrooms", icon: "🍄", next: "mushroom_path" }
        ]
      },

      mossy_path: {
        emoji: "🌿🦊",
        bg: "linear-gradient(135deg, #0d4a0d, #0a2a1a)",
        text: `The mossy path feels soft under your feet, like walking on a cloud. As you go deeper, you hear a small cry for help.

Behind a fallen log, you find a tiny fox cub. Its paw is caught under a heavy branch. The fox looks up at you with big, frightened eyes.

"Please help me," the fox whispers. "I've been stuck here since morning. If you help me, I'll show you a secret shortcut through the forest."

The branch looks heavy, but you think you might be able to lift it if you're careful.`,
        vocab: [
          { word: "frightened", definition: "Very scared or afraid. The fox was frightened because it was stuck." }
        ],
        quiz: {
          question: "What is wrong with the fox cub?",
          options: ["It's lost", "Its paw is stuck under a branch", "It's hungry", "It's sleeping"],
          correct: 1
        },
        choices: [
          { text: "Help the fox by lifting the branch carefully", icon: "💪", next: "help_fox" },
          { text: "Look for a stick to use as a lever", icon: "🪵", next: "lever_fox" }
        ]
      },

      help_fox: {
        emoji: "🦊✨",
        bg: "linear-gradient(135deg, #2d1a0a, #0a2a1a)",
        text: `You bend down and grip the branch with both hands. It's heavier than it looks! You take a deep breath and pull with all your strength.

The branch lifts just enough for the fox to wiggle free. The little cub jumps up and shakes its fur, sending tiny sparkles into the air.

"Thank you so much!" the fox says, wagging its tail. "My name is Ember. You showed great courage and kindness. Here — take this."

Ember drops a small, glowing acorn into your hand. It feels warm and tingly.

"That's a Wishing Acorn," Ember explains. "It will help you later on your journey. Now, follow me — I know a shortcut!"`,

          { word: "courage", definition: "Being brave even when you feel scared. It takes courage to try hard things!" },
          { word: "grip", definition: "To hold onto something very tightly." }
        ],
        quiz: {
          question: "What does Ember give you as a thank-you gift?",
          options: ["A golden key", "A magic map", "A Wishing Acorn", "A silver coin"],
          correct: 2
        },
        item: { name: "Wishing Acorn", icon: "🌰" },
        choices: [
          { text: "Follow Ember through the shortcut", icon: "🦊", next: "ember_shortcut" }
        ]
      },

      lever_fox: {
        emoji: "🪵🦊",
        bg: "linear-gradient(135deg, #1a1a0a, #0a2a1a)",
        text: `Smart thinking! You look around and find a strong, sturdy stick nearby. You slide it under the heavy branch and push down hard, using the stick as a lever.

The branch pops up easily! The fox cub scrambles free and does a happy little dance.

"Oh, you're so clever!" the fox says, amazed. "My name is Ember. Most people just try to use their muscles, but you used your brain! Here, take this."

Ember gives you a glowing feather that floats above your palm.

"That's a Feather of Wisdom," Ember explains. "It will help you solve puzzles on your journey. You've earned it!"`,
        vocab: [
          { word: "sturdy", definition: "Strong and well-built — not easy to break." },
          { word: "clever", definition: "Smart and good at figuring things out." }
        ],
        quiz: {
          question: "Why was Ember extra impressed with you?",
          options: ["You were very strong", "You used your brain to solve the problem", "You brought friends to help", "You used magic"],
          correct: 1
        },
        item: { name: "Feather of Wisdom", icon: "🪶" },
        choices: [
          { text: "Follow Ember through the shortcut", icon: "🦊", next: "ember_shortcut" }
        ]
      },

      ember_shortcut: {
        emoji: "🌳🏰",
        bg: "linear-gradient(135deg, #1a0a3d, #0a3d3d)",
        text: `Ember leads you through a hidden tunnel behind a waterfall. The tunnel walls are covered in crystals that glow in every color of the rainbow.

When you come out the other side, you gasp. In front of you stands a magnificent tree house village! Dozens of little houses are built into the branches of the biggest tree you've ever seen.

          { text: "Talk to the wise old owl", icon: "🦉", next: "wise_owl" }
        ]
      },

      mushroom_path: {
        emoji: "🍄💜",
        bg: "linear-gradient(135deg, #1a0a3d, #3d0a3d)",
        text: `The blue mushrooms hum louder as you walk closer. Each one glows brighter when you step near it, like they're greeting you!

        vocab: [
          { word: "peculiar", definition: "Strange or unusual in an interesting way — not like anything you've seen before!" },
          { word: "enormous", definition: "Really, really big — even bigger than large!" }
        ],
        quiz: {
          question: "What is the answer to Lumi's riddle?",
          options: ["A painting", "A dream", "A map", "A photograph"],
          correct: 2
        },
        choices: [
          { text: "\"A map!\" you answer confidently", icon: "🗺️", next: "riddle_correct" },
          { text: "Ask Lumi for a hint", icon: "💡", next: "riddle_hint" }
        ]
      },

      riddle_hint: {
        emoji: "💡✨",
        bg: "linear-gradient(135deg, #1a0a3d, #3d0a3d)",

Lumi claps with delight, sending sparkles everywhere. "Correct! You figured it out! And because you were wise enough to ask for help, I have a special bonus gift for you!"

Lumi hands you a tiny compass that glows with soft purple light.`,
        vocab: [
          { word: "wisdom", definition: "Being smart about making good choices — using what you know to do the right thing." }
        ],
        quiz: {
          question: "Why did Lumi say asking for help was good?",
          options: ["Because the riddle was too easy", "Because asking for help is a sign of wisdom", "Because Lumi wanted to talk more", "Because you had to ask"],
          correct: 1
        },
        item: { name: "Glowing Compass", icon: "🧭" },
        choices: [
          { text: "Follow where the compass points", icon: "🧭", next: "ember_shortcut" }
        ]
      },

      riddle_correct: {
        emoji: "🗺️🎉",
        bg: "linear-gradient(135deg, #0a1a3d, #3d0a3d)",
        text: `"A MAP!" you answer with confidence.

Lumi drops a tiny star into your palm. It floats just above your skin.

// ─── UI Functions ───
function updateStats() {
  document.getElementById('starsCount').textContent = state.stars;
  document.getElementById('wordsCount').textContent = state.wordsLearned.length;
  document.getElementById('questionsCount').textContent = `${state.questionsRight}/${state.questionsTotal}`;
  document.getElementById('chapterNum').textContent = state.chapter;
}

function updateTrail() {
  const trail = document.getElementById('trail');
  trail.innerHTML = '';
  const story = STORIES[state.currentStory];
  const allNodes = Object.keys(story.nodes);
  state.visitedNodes.forEach((nodeId, i) => {
    if (i > 0) trail.innerHTML += '<span class="trail-arrow">▶</span>';
    const dot = document.createElement('div');
    dot.className = 'trail-dot' + (nodeId === state.currentNode ? ' current' : ' visited');
    dot.title = nodeId.replace(/_/g, ' ');
    trail.appendChild(dot);
  });
}

function updateInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  state.inventory.forEach(item => {
    const el = document.createElement('div');
    el.className = 'inv-item';
    el.innerHTML = `<span>${item.icon}</span> ${item.name}`;
    inv.appendChild(el);
  });
}

function showVocab(word, def) {
  document.getElementById('vocabWord').textContent = word;
  document.getElementById('vocabDef').textContent = def;
  document.getElementById('vocabPopup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  if (!state.wordsLearned.includes(word)) {
    state.wordsLearned.push(word);
    state.stars += 1;
    updateStats();
  }
}

function closeVocab() {
  document.getElementById('vocabPopup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ─── Render Functions ───
function showStartScreen() {
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('trail').style.display = 'none';
  const card = document.getElementById('mainCard');
  let html = `<div class="start-screen">
    <h2>Choose Your Adventure!</h2>
    <p>Pick a story to begin your reading adventure. You'll explore magical worlds, learn new words, and answer fun questions along the way!</p>
    <div class="story-select">`;

  for (const [key, story] of Object.entries(STORIES)) {
    html += `<div class="story-card" onclick="startStory('${key}')">
      <div class="sc-icon">${story.icon}</div>
      <div class="sc-title">${story.title}</div>
      <div class="sc-desc">${story.desc}</div>
    </div>`;
  }

  html += `</div></div>`;
  card.innerHTML = html;
}

function startStory(storyKey) {
  state = {
    stars: 0, wordsLearned: [], questionsRight: 0, questionsTotal: 0,
    chapter: 1, inventory: [], currentStory: storyKey,
    visitedNodes: [], currentNode: null, quizAnswered: false
  };
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('trail').style.display = 'flex';
  goToNode('start');
}

function goToNode(nodeId) {
  const story = STORIES[state.currentStory];
  const node = story.nodes[nodeId];
  state.currentNode = nodeId;
  if (!state.visitedNodes.includes(nodeId)) {
    state.visitedNodes.push(nodeId);
    state.chapter = state.visitedNodes.length;
  }
  state.quizAnswered = false;

  if (node.item) {
    if (!state.inventory.find(i => i.name === node.item.name)) {
      state.inventory.push(node.item);
      state.stars += 2;
    }
  }

  updateStats();
  updateTrail();
  updateInventory();

  const card = document.getElementById('mainCard');
  // Build story text with clickable vocab
  let text = node.text;
  if (node.vocab) {
    node.vocab.forEach(v => {
      const regex = new RegExp(`\\b(${v.word})\\b`, 'gi');
      text = text.replace(regex, `<span class="highlight" onclick="showVocab('${v.word}', '${v.definition.replace(/'/g, "\\'")}')">$1</span>`);
    });
  }

  let html = `
    <div class="scene-image" style="background: ${node.bg};">
      <span>${node.emoji}</span>
    </div>
    <div class="story-text">${text}</div>`;

  // Quiz
  if (node.quiz) {
    html += `<div class="quiz-section" id="quizSection">
      <h3>📝 Reading Check!</h3>
      <p style="margin-bottom:12px; color: var(--muted);">${node.quiz.question}</p>
      <div class="quiz-options">`;
    node.quiz.options.forEach((opt, i) => {
      html += `<button class="quiz-opt" id="qopt${i}" onclick="answerQuiz(${i}, ${node.quiz.correct})">${opt}</button>`;
    });
    html += `</div><div id="quizFeedback"></div></div>`;
  }

  // Choices (hidden until quiz is answered, or shown if no quiz)
  html += `<div class="choices" id="choicesArea" style="${node.quiz ? 'display:none;' : ''}">`;
  if (node.ending) {
    html += `<div class="end-screen">
      <h2>Adventure Complete! 🎉</h2>
      <div class="end-stats">
        <div class="end-stat"><div class="es-val">${state.stars}</div><div class="es-label">Stars Earned</div></div>
        <div class="end-stat"><div class="es-val">${state.wordsLearned.length}</div><div class="es-label">Words Learned</div></div>
        <div class="end-stat"><div class="es-val">${state.questionsRight}/${state.questionsTotal}</div><div class="es-label">Questions Right</div></div>
        <div class="end-stat"><div class="es-val">${state.visitedNodes.length}</div><div class="es-label">Chapters Visited</div></div>
      </div>
      <button class="play-again-btn" onclick="showStartScreen()">Play Another Adventure! 🚀</button>
    </div>`;
  } else {
    node.choices.forEach(c => {
      html += `<button class="choice-btn" onclick="goToNode('${c.next}')">
        <span class="choice-icon">${c.icon}</span> ${c.text}
      </button>`;
    });
  }
  html += `</div>`;

  card.innerHTML = html;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function answerQuiz(selected, correct) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  state.questionsTotal++;

  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((o, i) => {
    o.style.pointerEvents = 'none';
    if (i === correct) o.classList.add('correct');
    if (i === selected && i !== correct) o.classList.add('wrong');
  });

  const fb = document.getElementById('quizFeedback');
  if (selected === correct) {
    state.questionsRight++;
    state.stars += 3;
    fb.innerHTML = '<div class="feedback good">⭐ Great job! That\'s correct! +3 stars</div>';
  } else {
    state.stars += 1;
    fb.innerHTML = '<div class="feedback try-again">Not quite — but you still earned a star for trying! ⭐</div>';
  }
  updateStats();

  // Show choices after a moment
  setTimeout(() => {
    document.getElementById('choicesArea').style.display = 'flex';
    document.getElementById('choicesArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 1200);
}

// ─── Init ───
showStartScreen();
</script>
</body>
</html>
