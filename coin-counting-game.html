<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Counting Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0f0a1e;--card:#1a1030;--border:rgba(245,158,11,0.2);--text:#e8dff5;--muted:#a89cc8;
  --purple:#8b5cf6;--pink:#ec4899;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--cyan:#06b6d4;--orange:#f97316;}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8);}100%{opacity:1;transform:scale(1.2);}}

.game-area{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px;}

.header{text-align:center;padding:16px 0 8px;}
.header h1{font-size:1.8em;background:linear-gradient(135deg,var(--gold),var(--orange),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.header p{color:var(--muted);font-size:0.95em;}

.hud{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0;flex-wrap:wrap;}
.hud-stat{background:rgba(139,92,246,0.12);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:0.88em;display:flex;align-items:center;gap:6px;}
.hud-stat .hs-icon{font-size:1.1em;}
.hud-stat .hs-val{font-family:'Press Start 2P',monospace;font-size:0.7em;color:var(--gold);}

.diff-bar{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.diff-btn{padding:6px 14px;border-radius:20px;font-size:0.82em;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:rgba(139,92,246,0.08);color:var(--muted);transition:all .2s;font-family:'Quicksand',sans-serif;}
.diff-btn.active{border-color:var(--gold);background:rgba(245,158,11,0.15);color:var(--gold);}
.diff-btn:disabled{opacity:0.35;cursor:default;}
.diff-btn:not(:disabled):hover{border-color:var(--purple);transform:scale(1.04);}

.mode-selector{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.mode-btn{padding:8px 16px;border-radius:20px;font-size:0.9em;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:rgba(139,92,246,0.08);color:var(--muted);transition:all .2s;font-family:'Quicksand',sans-serif;}
.mode-btn.active{border-color:var(--cyan);background:rgba(6,182,212,0.15);color:var(--cyan);}
.mode-btn:hover{border-color:var(--purple);transform:scale(1.03);}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:14px;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.prompt-text{font-size:1.3em;font-weight:700;text-align:center;margin-bottom:16px;color:var(--text);}

.coins-display{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px;min-height:80px;align-items:center;}
.coin{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:default;transition:all .2s;position:relative;box-shadow:0 0 12px rgba(0,0,0,0.4),inset 0 2px 4px rgba(255,255,255,0.15);}
.coin:hover{transform:scale(1.12);box-shadow:0 0 20px rgba(245,158,11,0.3),inset 0 2px 4px rgba(255,255,255,0.15);}
.coin-penny{background:linear-gradient(135deg,#e8926a,#c45a2c);border:3px solid #d85a30;color:#fff;width:62px;height:62px;text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.coin-nickel{background:linear-gradient(135deg,#b8b5aa,#8a877d);border:3px solid #999;color:#fff;width:66px;height:66px;text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.coin-dime{background:linear-gradient(135deg,#c8c5bb,#9a978d);border:3px solid #aaa;color:#fff;width:52px;height:52px;text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.coin-quarter{background:linear-gradient(135deg,#c0bdb3,#8a877d);border:3px solid #999;color:#fff;width:76px;height:76px;text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.coin-half{background:linear-gradient(135deg,#b8b5aa,#7a776d);border:3px solid #888;color:#fff;width:84px;height:84px;text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.coin-dollar{background:linear-gradient(135deg,#f7d76a,#c8941a);border:3px solid #ba7517;color:#412402;width:78px;height:78px;text-shadow:0 1px 1px rgba(255,255,255,0.2);}
.coin-name{font-size:10px;margin-top:1px;opacity:0.8;}
.coin-value{font-size:13px;font-weight:700;}
.coin-tap{cursor:pointer !important;}
.coin-tap:active{transform:scale(0.93);}

.answer-section{text-align:center;margin-bottom:8px;}
.answer-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;}
.dollar-sign,.cents-label{font-size:20px;font-weight:700;color:var(--gold);}
.answer-input{width:120px;font-size:22px;text-align:center;padding:10px 12px;border-radius:12px;border:2px solid var(--border);background:rgba(0,0,0,0.3);color:var(--gold);font-family:'Press Start 2P',monospace;outline:none;}
.answer-input:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,0.2);}
.answer-input::placeholder{color:rgba(168,156,200,0.4);}

.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn{padding:11px 24px;border-radius:12px;font-size:0.95em;font-weight:700;cursor:pointer;border:none;transition:all .2s;font-family:'Quicksand',sans-serif;}
.btn:active{transform:scale(0.96);}
.btn-check{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;}
.btn-check:hover{transform:scale(1.04);box-shadow:0 0 15px rgba(59,130,246,0.3);}
.btn-next{background:linear-gradient(135deg,var(--green),#34d399);color:#fff;}
.btn-next:hover{transform:scale(1.04);box-shadow:0 0 15px rgba(16,185,129,0.3);}
.btn-hint{background:rgba(139,92,246,0.15);color:var(--muted);border:1px solid var(--border);}
.btn-hint:hover{background:rgba(139,92,246,0.25);}
.btn-teach{background:rgba(245,158,11,0.15);color:var(--gold);border:1.5px solid rgba(245,158,11,0.3);}
.btn-teach:hover{background:rgba(245,158,11,0.25);transform:scale(1.04);}
.btn-easier{background:rgba(139,92,246,0.15);color:var(--purple);border:1.5px solid rgba(139,92,246,0.3);}
.btn-easier:hover{background:rgba(139,92,246,0.25);transform:scale(1.04);}

.feedback{font-size:1em;font-weight:600;min-height:24px;margin-top:14px;text-align:center;line-height:1.5;}
.feedback-correct{color:var(--green);}
.feedback-wrong{color:var(--red);}

.levelup-msg{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);color:var(--gold);padding:12px 16px;border-radius:14px;text-align:center;margin-bottom:14px;font-size:0.95em;font-weight:700;animation:popIn 0.4s ease-out;}
@keyframes popIn{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.group-card{border:2px solid var(--border);border-radius:16px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(139,92,246,0.06);}
.group-card:hover{border-color:var(--purple);background:rgba(139,92,246,0.12);transform:scale(1.02);}
.group-card.selected-correct{border-color:var(--green);background:rgba(16,185,129,0.15);animation:popIn .3s ease;}
.group-card.selected-wrong{border-color:var(--red);background:rgba(239,68,68,0.1);animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.group-label{font-weight:700;margin-bottom:8px;font-size:1.05em;color:var(--gold);}
.running-total{font-size:1.2em;font-weight:700;margin-bottom:14px;color:var(--cyan);font-family:'Press Start 2P',monospace;font-size:0.9em;}

/* Teaching area */
.teach-area{margin-top:14px;background:rgba(245,158,11,0.06);border:1.5px solid rgba(245,158,11,0.2);border-radius:16px;padding:18px;text-align:left;animation:fadeIn .3s ease;}
.teach-step{margin-bottom:14px;animation:fadeIn 0.3s ease;}
.teach-step:last-child{margin-bottom:0;}
.teach-label{font-size:0.7em;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:6px;font-family:'Press Start 2P',monospace;}
.teach-text{font-size:0.95em;line-height:1.7;color:var(--text);}
.teach-next-btn{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:10px;font-size:0.88em;font-weight:700;cursor:pointer;background:rgba(245,158,11,0.15);color:var(--gold);border:1px solid rgba(245,158,11,0.3);font-family:'Quicksand',sans-serif;transition:all .2s;}
.teach-next-btn:hover{background:rgba(245,158,11,0.25);transform:scale(1.03);}

/* Coin counting visual */
.coin-count-visual{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-family:'Press Start 2P',monospace;font-size:0.7em;background:rgba(0,0,0,0.3);padding:14px 20px;border-radius:14px;border:1px solid var(--border);margin:10px 0;}
.coin-count-row{display:flex;align-items:center;gap:10px;}
.coin-count-label{min-width:130px;text-align:right;color:var(--muted);font-family:'Quicksand',sans-serif;font-size:1.6em;font-weight:600;}
.coin-count-value{min-width:60px;text-align:right;font-weight:700;color:var(--cyan);}
.coin-count-total{border-top:2px solid rgba(245,158,11,0.3);padding-top:8px;margin-top:6px;}
.coin-count-result{color:var(--green);}

.celebration{font-size:1.3em;animation:popIn 0.4s ease-out;display:block;margin-top:6px;}

@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.coin-bounce{animation:bounce 0.4s ease;}

@media(max-width:480px){
  .header h1{font-size:1.4em;}
  .hud{gap:8px;}
  .hud-stat{padding:5px 12px;font-size:0.82em;}
  .coins-display{gap:8px;}
  .compare-grid{gap:8px;}
  .coin-count-label{min-width:100px;font-size:1.3em;}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="game-area">
  <div class="header">
    <h1>Coin Counting Game</h1>
    <p>Count coins, make change, and level up!</p>
  </div>

  <div class="hud">
    <div class="hud-stat"><span class="hs-icon">💰</span> Score: <span class="hs-val" id="score">0</span></div>
    <div class="hud-stat"><span class="hs-icon">⭐</span> <span id="level" class="hs-val" style="font-size:0.6em">LV 1</span></div>
    <div class="hud-stat"><span class="hs-icon">🔥</span> Streak: <span class="hs-val" id="streak">0</span></div>
  </div>

  <div class="diff-bar" id="diffBar"></div>

  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('count')">Count the coins</button>
    <button class="mode-btn" onclick="setMode('make')">Make the amount</button>
    <button class="mode-btn" onclick="setMode('compare')">Which is more?</button>
  </div>

  <div id="levelup"></div>
  <div class="card">
    <div class="prompt-text" id="prompt"></div>
    <div class="coins-display" id="coins"></div>
    <div id="game-content"></div>
  </div>
  <div id="teach-container"></div>
  <div class="feedback" id="feedback"></div>
</div>

<script>
// Stars
(function(){var s=document.getElementById('stars');for(var i=0;i<80;i++){var d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';var sz=Math.random()*2.5+1;d.style.width=sz+'px';d.style.height=sz+'px';d.style.setProperty('--dur',(Math.random()*3+2)+'s');s.appendChild(d);}})();

var COINS = [
  { name: 'penny', value: 1, plural: 'pennies' },
  { name: 'nickel', value: 5, plural: 'nickels' },
  { name: 'dime', value: 10, plural: 'dimes' },
  { name: 'quarter', value: 25, plural: 'quarters' },
  { name: 'half dollar', value: 50, plural: 'half dollars' },
  { name: 'dollar', value: 100, plural: 'dollars' }
];

var LEVELS = [
  { name: 'Pennies only',      coins: [0],                maxTotal: 10,  minCoins: 2, maxCoins: 6,  unlockScore: 0 },
  { name: 'Pennies + nickels', coins: [0, 1],             maxTotal: 25,  minCoins: 2, maxCoins: 5,  unlockScore: 30 },
  { name: 'Add dimes',         coins: [0, 1, 2],          maxTotal: 50,  minCoins: 2, maxCoins: 5,  unlockScore: 70 },
  { name: 'Add quarters',      coins: [0, 1, 2, 3],       maxTotal: 100, minCoins: 2, maxCoins: 6,  unlockScore: 120 },
  { name: 'All coins',         coins: [0, 1, 2, 3, 4, 5], maxTotal: 200, minCoins: 2, maxCoins: 7,  unlockScore: 200 },
];

var SAVE_KEY = 'coin-game-save';
var teachLevel = 0;
var currentTeach = null;
var state = loadState();

function defaultState() {
  return { score: 0, streak: 0, mode: 'count', answer: 0, coins: [], hintUsed: false, answered: false, diff: 0, highestUnlocked: 0, selectedCoins: [], g1: null, g2: null };
}
function loadState() {
  try { var s = localStorage.getItem(SAVE_KEY); if (s) return Object.assign(defaultState(), JSON.parse(s)); } catch(e) {}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ score: state.score, streak: state.streak, mode: state.mode, diff: state.diff, highestUnlocked: state.highestUnlocked })); } catch(e) {}
}
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function fmt(cents) { return (cents / 100).toFixed(2); }
function fmtCents(cents) { return cents + '¢'; }
function useCentsInput() { return LEVELS[state.diff].maxTotal < 100; }

function makeCoinEl(coin, extra) {
  var cls = 'coin coin-' + coin.name.split(' ')[0] + (extra || '');
  var label = coin.value >= 100 ? '$' + (coin.value / 100) : coin.value + '¢';
  return '<div class="' + cls + '"><span class="coin-value">' + label + '</span><span class="coin-name">' + coin.name + '</span></div>';
}

function renderDiffBar() {
  var html = '';
  LEVELS.forEach(function(lv, i) {
    var unlocked = i <= state.highestUnlocked;
    var cls = 'diff-btn' + (i === state.diff ? ' active' : '');
    var lock = unlocked ? '' : ' (' + lv.unlockScore + ')';
    html += '<button class="' + cls + '" onclick="setDiff(' + i + ')" ' + (unlocked ? '' : 'disabled') + '>Lv ' + (i + 1) + lock + '</button>';
  });
  document.getElementById('diffBar').innerHTML = html;
}

function checkUnlocks() {
  var prev = state.highestUnlocked;
  for (var i = 0; i < LEVELS.length; i++) {
    if (state.score >= LEVELS[i].unlockScore) state.highestUnlocked = i;
  }
  if (state.highestUnlocked > prev) {
    document.getElementById('levelup').innerHTML = '<div class="levelup-msg">⭐ New level unlocked: ' + LEVELS[state.highestUnlocked].name + '!</div>';
    setTimeout(function() { document.getElementById('levelup').innerHTML = ''; }, 3500);
    state.diff = state.highestUnlocked;
  }
  renderDiffBar();
  saveState();
}

function setDiff(d) {
  if (d > state.highestUnlocked) return;
  state.diff = d;
  renderDiffBar();
  updateLevelLabel();
  newRound();
  saveState();
}

function updateLevelLabel() {
  document.getElementById('level').textContent = 'LV ' + (state.diff + 1);
}

function updateScoreUI() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('streak').textContent = state.streak;
}

function pickCoinsForLevel() {
  var lv = LEVELS[state.diff];
  var available = lv.coins.map(function(i) { return COINS[i]; });
  var coins = [];
  var total = 0;
  var numCoins = rand(lv.minCoins, lv.maxCoins);
  for (var n = 0; n < numCoins; n++) {
    var possible = available.filter(function(c) { return c.value + total <= lv.maxTotal; });
    if (possible.length === 0) break;
    var c = possible[rand(0, possible.length - 1)];
    coins.push(c);
    total += c.value;
  }
  if (total === 0) { coins.push(available[0]); total = available[0].value; }
  return { coins: coins, total: total };
}

// ── TEACHING ENGINE ──
function buildCountTeach(coins, answer) {
  var byType = {};
  coins.forEach(function(c) { byType[c.name] = (byType[c.name] || 0) + 1; });
  var sorted = Object.keys(byType).sort(function(a, b) {
    return COINS.find(function(c){return c.name===b;}).value - COINS.find(function(c){return c.name===a;}).value;
  });
  var nudge = 'Look at each coin carefully. Do you know how much each one is worth? Start with the biggest coins and count up!';
  var parts = [];
  sorted.forEach(function(name) {
    var coin = COINS.find(function(c){return c.name===name;});
    var count = byType[name];
    parts.push('<strong>' + count + ' ' + (count===1 ? coin.name : coin.plural) + '</strong> = ' + count + ' × ' + coin.value + '¢ = ' + (count * coin.value) + '¢');
  });
  var strategy = 'Group the same coins together and multiply:<br>' + parts.join('<br>') + '<br><br>Then add all the groups together!';
  var wh = '<div class="coin-count-visual">';
  sorted.forEach(function(name) {
    var coin = COINS.find(function(c){return c.name===name;});
    var count = byType[name];
    wh += '<div class="coin-count-row"><span class="coin-count-label">' + count + ' ' + (count===1?coin.name:coin.plural) + ':</span><span class="coin-count-value">' + (count*coin.value) + '¢</span></div>';
  });
  wh += '<div class="coin-count-row coin-count-total"><span class="coin-count-label">Total:</span><span class="coin-count-value coin-count-result">' + (useCentsInput() ? answer + '¢' : '$' + fmt(answer)) + '</span></div></div>';
  return { nudge: nudge, strategy: strategy, walkthrough: 'Let\'s add each coin type step by step:<br><br>' + wh + '<br>The answer is <strong>' + (useCentsInput() ? fmtCents(answer) : '$' + fmt(answer)) + '</strong>.' };
}

function buildMakeTeach(target) {
  var lv = LEVELS[state.diff];
  var available = lv.coins.map(function(i) { return COINS[i]; }).sort(function(a,b){return b.value-a.value;});
  var nudge = 'Start with the biggest coin you can use without going over. Then fill in the rest with smaller coins!';
  var strategy = 'The target is <strong>' + (useCentsInput() ? fmtCents(target) : '$' + fmt(target)) + '</strong>. What\'s the biggest coin that fits? Use that first, then keep going with smaller coins.';
  var remaining = target, steps = [];
  available.forEach(function(coin) {
    if (remaining >= coin.value) {
      var count = Math.floor(remaining / coin.value);
      steps.push({ coin: coin, count: count, subtotal: count * coin.value });
      remaining -= count * coin.value;
    }
  });
  var wh = '<div class="coin-count-visual">';
  steps.forEach(function(s) {
    wh += '<div class="coin-count-row"><span class="coin-count-label">' + s.count + ' ' + (s.count===1?s.coin.name:s.coin.plural) + ':</span><span class="coin-count-value">' + s.subtotal + '¢</span></div>';
  });
  wh += '<div class="coin-count-row coin-count-total"><span class="coin-count-label">Total:</span><span class="coin-count-value coin-count-result">' + (useCentsInput() ? target + '¢' : '$' + fmt(target)) + '</span></div></div>';
  return { nudge: nudge, strategy: strategy, walkthrough: 'Here\'s one way to make ' + (useCentsInput() ? fmtCents(target) : '$' + fmt(target)) + ':<br><br>' + wh + '<br>Tap the coins shown above, then hit Check!' };
}

function buildCompareTeach(g1, g2) {
  var nudge = 'Count each group of coins separately, then compare the two totals!';
  var strategy = 'Count Group A\'s coins first, then count Group B\'s coins. The group with the <strong>higher total</strong> has more money!';
  function buildGC(group, label) {
    var byType = {};
    group.coins.forEach(function(c) { byType[c.name] = (byType[c.name] || 0) + 1; });
    var sorted = Object.keys(byType).sort(function(a, b) {
      return COINS.find(function(c){return c.name===b;}).value - COINS.find(function(c){return c.name===a;}).value;
    });
    var html = '<strong>' + label + ':</strong><br><div class="coin-count-visual" style="margin-top:6px">';
    sorted.forEach(function(name) {
      var coin = COINS.find(function(c){return c.name===name;});
      var count = byType[name];
      html += '<div class="coin-count-row"><span class="coin-count-label">' + count + ' ' + (count===1?coin.name:coin.plural) + ':</span><span class="coin-count-value">' + (count*coin.value) + '¢</span></div>';
    });
    html += '<div class="coin-count-row coin-count-total"><span class="coin-count-label">Total:</span><span class="coin-count-value coin-count-result">' + (useCentsInput() ? group.total + '¢' : '$' + fmt(group.total)) + '</span></div></div>';
    return html;
  }
  var fA = useCentsInput() ? fmtCents(g1.total) : '$' + fmt(g1.total);
  var fB = useCentsInput() ? fmtCents(g2.total) : '$' + fmt(g2.total);
  var winner = g1.total > g2.total ? 'A' : 'B';
  return { nudge: nudge, strategy: strategy, walkthrough: buildGC(g1, 'Group A') + '<br>' + buildGC(g2, 'Group B') + '<br><strong>' + fA + '</strong> vs <strong>' + fB + '</strong> — Group <strong>' + winner + '</strong> has more!' };
}

function buildTeachContent() {
  if (!currentTeach) return '';
  var steps = [];
  if (teachLevel >= 1) steps.push({ label: 'Think about it', text: currentTeach.nudge });
  if (teachLevel >= 2) steps.push({ label: 'Strategy', text: currentTeach.strategy });
  if (teachLevel >= 3) steps.push({ label: "Let's solve it", text: currentTeach.walkthrough });
  if (steps.length === 0) return '';
  var html = '<div class="teach-area">';
  steps.forEach(function(s) { html += '<div class="teach-step"><div class="teach-label">' + s.label + '</div><div class="teach-text">' + s.text + '</div></div>'; });
  if (teachLevel < 3 && !state.answered) html += '<button class="teach-next-btn" onclick="nextTeachLevel()">I still need more help</button>';
  html += '</div>';
  return html;
}
function showTeach() { if (teachLevel === 0) teachLevel = 1; state.hintUsed = true; document.getElementById('teach-container').innerHTML = buildTeachContent(); }
function nextTeachLevel() { if (teachLevel < 3) teachLevel++; document.getElementById('teach-container').innerHTML = buildTeachContent(); }

function tryEasier() {
  var prevDiff = state.diff;
  if (state.diff > 0) state.diff = Math.max(0, state.diff - 1);
  document.getElementById('levelup').innerHTML = '<div class="levelup-msg">🌟 Let\'s try an easier one!</div>';
  newRound(true);
  state.diff = prevDiff;
}

// ── GAME MODES ──
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(b, i) {
    b.classList.toggle('active', (i === 0 && mode === 'count') || (i === 1 && mode === 'make') || (i === 2 && mode === 'compare'));
  });
  newRound(); saveState();
}

function newRound(keepLevelup) {
  state.hintUsed = false; state.answered = false; teachLevel = 0; currentTeach = null;
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('teach-container').innerHTML = '';
  if (!keepLevelup) document.getElementById('levelup').innerHTML = '';
  updateLevelLabel();
  if (state.mode === 'count') setupCount();
  else if (state.mode === 'make') setupMake();
  else setupCompare();
}

function setupCount() {
  var r = pickCoinsForLevel();
  state.answer = r.total;
  state.coins = r.coins;
  r.coins.sort(function(a, b) { return b.value - a.value; });
  currentTeach = buildCountTeach(r.coins, r.total);
  document.getElementById('prompt').textContent = '💰 How much money is this?';
  document.getElementById('coins').innerHTML = r.coins.map(function(c) { return makeCoinEl(c); }).join('');
  var inputHtml;
  if (useCentsInput()) {
    inputHtml = '<div class="answer-row"><input class="answer-input" id="ans" type="number" placeholder="0" autocomplete="off" min="0" style="width:100px"><span class="cents-label">¢</span></div>';
  } else {
    inputHtml = '<div class="answer-row"><span class="dollar-sign">$</span><input class="answer-input" id="ans" type="text" placeholder="0.00" autocomplete="off"></div>';
  }
  document.getElementById('game-content').innerHTML =
    '<div class="answer-section">' + inputHtml +
    '<div class="btn-row"><button class="btn btn-check" onclick="checkAnswer()">Check</button>' +
    '<button class="btn btn-teach" onclick="showTeach()">Teach me</button></div></div>';
  var inp = document.getElementById('ans');
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkAnswer(); });
  inp.focus();
}

function setupMake() {
  var lv = LEVELS[state.diff];
  var target;
  if (state.diff === 0) target = rand(2, 10);
  else target = rand(Math.max(1, Math.round(lv.maxTotal * 0.15)), lv.maxTotal);
  state.answer = target; state.selectedCoins = [];
  currentTeach = buildMakeTeach(target);
  var label = useCentsInput() ? fmtCents(target) : '$' + fmt(target);
  document.getElementById('prompt').textContent = '🪙 Tap coins to make ' + label;
  document.getElementById('coins').innerHTML = '';
  var coinTypes = lv.coins.map(function(i) { return COINS[i]; });
  var html = '<div class="answer-section"><div class="coins-display" style="margin-bottom:12px">';
  coinTypes.forEach(function(c, i) {
    var cls = 'coin coin-' + c.name.split(' ')[0] + ' coin-tap';
    var val = c.value >= 100 ? '$' + (c.value / 100) : c.value + '¢';
    html += '<div class="' + cls + '" onclick="tapCoin(' + i + ',' + c.value + ')"><span class="coin-value">' + val + '</span><span class="coin-name">' + c.name + '</span></div>';
  });
  html += '</div>';
  var runLabel = useCentsInput() ? '<span id="running">0</span>¢' : '$<span id="running">0.00</span>';
  html += '<div class="running-total">Your total: ' + runLabel + '</div>';
  html += '<div class="btn-row"><button class="btn btn-check" onclick="checkMake()">Check</button><button class="btn btn-hint" onclick="resetMake()">Start over</button><button class="btn btn-teach" onclick="showTeach()">Teach me</button></div></div>';
  document.getElementById('game-content').innerHTML = html;
}

function tapCoin(idx, value) {
  if (state.answered) return;
  state.selectedCoins.push(value);
  var total = state.selectedCoins.reduce(function(a, b) { return a + b; }, 0);
  document.getElementById('running').textContent = useCentsInput() ? total : fmt(total);
  var coinEls = document.querySelectorAll('#game-content .coin');
  if (coinEls[idx]) { coinEls[idx].classList.remove('coin-bounce'); void coinEls[idx].offsetWidth; coinEls[idx].classList.add('coin-bounce'); }
}

function resetMake() {
  state.selectedCoins = [];
  document.getElementById('running').textContent = useCentsInput() ? '0' : '0.00';
  document.getElementById('feedback').innerHTML = '';
}

function checkMake() {
  if (state.answered) return;
  var total = state.selectedCoins.reduce(function(a, b) { return a + b; }, 0);
  if (total === state.answer) { correct(); }
  else if (total > state.answer) { document.getElementById('feedback').innerHTML = '<span class="feedback-wrong">That\'s too much! Try starting over.</span>'; }
  else { document.getElementById('feedback').innerHTML = '<span class="feedback-wrong">Not enough yet! Keep adding coins.</span>'; }
}

function setupCompare() {
  var g1 = pickCoinsForLevel(), g2 = pickCoinsForLevel(), tries = 0;
  while (g1.total === g2.total && tries < 20) { g2 = pickCoinsForLevel(); tries++; }
  if (g1.total === g2.total) { g2.coins.push(COINS[0]); g2.total += 1; }
  state.answer = g1.total > g2.total ? 'A' : 'B';
  state.g1 = g1; state.g2 = g2;
  currentTeach = buildCompareTeach(g1, g2);
  document.getElementById('prompt').textContent = '⚖️ Which group has more money?';
  document.getElementById('coins').innerHTML = '';
  var g1s = g1.coins.slice().sort(function(a, b) { return b.value - a.value; });
  var g2s = g2.coins.slice().sort(function(a, b) { return b.value - a.value; });
  var html = '<div class="answer-section"><div class="compare-grid">' +
    '<div class="group-card" onclick="pickGroup(\'A\')" id="groupA"><div class="group-label">Group A</div><div class="coins-display" style="min-height:auto;margin-bottom:0">' + g1s.map(function(c) { return makeCoinEl(c); }).join('') + '</div></div>' +
    '<div class="group-card" onclick="pickGroup(\'B\')" id="groupB"><div class="group-label">Group B</div><div class="coins-display" style="min-height:auto;margin-bottom:0">' + g2s.map(function(c) { return makeCoinEl(c); }).join('') + '</div></div></div>' +
    '<div class="btn-row"><button class="btn btn-teach" onclick="showTeach()">Teach me</button></div></div>';
  document.getElementById('game-content').innerHTML = html;
}

function pickGroup(choice) {
  if (state.answered) return;
  if (choice === state.answer) {
    document.getElementById('group' + choice).classList.add('selected-correct');
    correct();
  } else {
    state.answered = true; state.streak = 0; updateScoreUI();
    document.getElementById('group' + choice).classList.add('selected-wrong');
    document.getElementById('group' + state.answer).classList.add('selected-correct');
    teachLevel = 3;
    document.getElementById('teach-container').innerHTML = buildTeachContent();
    var fA = useCentsInput() ? fmtCents(state.g1.total) : '$' + fmt(state.g1.total);
    var fB = useCentsInput() ? fmtCents(state.g2.total) : '$' + fmt(state.g2.total);
    document.getElementById('feedback').innerHTML = '<span class="feedback-wrong">Not quite! Group A = ' + fA + ', Group B = ' + fB + '</span><br><div class="btn-row" style="margin-top:8px"><button class="btn btn-easier" onclick="tryEasier()">Try easier</button><button class="btn btn-next" onclick="newRound()">Next</button></div>';
    saveState();
  }
}

function checkAnswer() {
  if (state.answered) return;
  var input = document.getElementById('ans').value.trim().replace('$', '');
  var val;
  if (useCentsInput()) { val = Math.round(parseFloat(input)); }
  else { val = Math.round(parseFloat(input) * 100); }
  if (isNaN(val)) { document.getElementById('feedback').innerHTML = '<span class="feedback-wrong">' + (useCentsInput() ? 'Type a number like 7' : 'Type a number like 0.75') + '</span>'; return; }
  if (val === state.answer) { correct(); }
  else {
    state.answered = true; state.streak = 0; updateScoreUI();
    teachLevel = 3;
    document.getElementById('teach-container').innerHTML = buildTeachContent();
    var ans = useCentsInput() ? fmtCents(state.answer) : '$' + fmt(state.answer);
    document.getElementById('feedback').innerHTML = '<span class="feedback-wrong">Not quite! The answer is ' + ans + '</span><br><div class="btn-row" style="margin-top:8px"><button class="btn btn-easier" onclick="tryEasier()">Try easier</button><button class="btn btn-next" onclick="newRound()">Next</button></div>';
    saveState();
  }
}

function correct() {
  state.answered = true;
  var pts = state.hintUsed ? 5 : 10;
  state.score += pts; state.streak++;
  updateScoreUI(); checkUnlocks();
  var msgs = ['Great job! ⭐','You got it! 🎉','Amazing! 💫','Super star! 🌟','Awesome! 🔥','Nailed it! 💰','Perfect! ✨','Way to go! 🚀','So smart! 🧠','Fantastic! 🎊'];
  var msg = pick(msgs);
  var bonus = (state.streak > 0 && state.streak % 5 === 0) ? '<span class="celebration">🔥 Wow, ' + state.streak + ' in a row!</span>' : '';
  document.getElementById('feedback').innerHTML = '<span class="feedback-correct">' + msg + ' +' + pts + '</span>' + bonus + '<br><button class="btn btn-next" onclick="newRound()" style="margin-top:8px">Next</button>';
  saveState();
}

// Init
updateScoreUI(); renderDiffBar();
document.querySelectorAll('.mode-btn').forEach(function(b, i) {
  b.classList.toggle('active', (i === 0 && state.mode === 'count') || (i === 1 && state.mode === 'make') || (i === 2 && state.mode === 'compare'));
});
newRound();
</script>
</body>
</html>
