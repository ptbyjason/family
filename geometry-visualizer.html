<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0e1a; --card: #111827; --border: #1e293b;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
    --purple: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* Top bar */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; background:var(--card); border-bottom:1px solid var(--border);
  }
  .topbar h1 { font-size:1.2em; display:flex; align-items:center; gap:8px; }
  .topbar h1 span { color:var(--accent); }
  .mode-tabs { display:flex; gap:4px; }
  .mode-tab {
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 14px; border-radius:8px; font-family:'Inter',sans-serif;
    font-size:0.85em; cursor:pointer; transition:all 0.2s;
  }
  .mode-tab:hover { border-color:var(--accent); color:var(--text); }
  .mode-tab.active { background:var(--accent); border-color:var(--accent); color:white; }

  /* Main layout */
  .main { display:flex; flex:1; overflow:hidden; }

  /* Left tools panel */
  .tools-panel {
    width:220px; background:var(--card); border-right:1px solid var(--border);
    padding:12px; overflow-y:auto; flex-shrink:0;
  }
  .tool-section { margin-bottom:16px; }
  .tool-section h3 { font-size:0.75em; text-transform:uppercase; color:var(--muted); letter-spacing:0.05em; margin-bottom:8px; }
  .tool-btn {
    display:flex; align-items:center; gap:8px; width:100%;
    background:rgba(59,130,246,0.08); border:1px solid var(--border);
    color:var(--text); padding:8px 10px; border-radius:8px;
    font-family:'Inter',sans-serif; font-size:0.85em; cursor:pointer;
    transition:all 0.2s; margin-bottom:4px;
  }
  .tool-btn:hover { border-color:var(--accent); background:rgba(59,130,246,0.15); }
  .tool-btn.active { border-color:var(--accent); background:rgba(59,130,246,0.2); box-shadow:0 0 10px rgba(59,130,246,0.2); }
  .tool-btn .ti { font-size:1.1em; width:20px; text-align:center; }

  .color-row { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .color-swatch {
    width:24px; height:24px; border-radius:6px; cursor:pointer;
    border:2px solid transparent; transition:all 0.2s;
  }
  .color-swatch:hover, .color-swatch.active { border-color:white; transform:scale(1.15); }

  /* Canvas area */
  .canvas-area { flex:1; position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }

  /* Info panel (right) */
  .info-panel {
    width:260px; background:var(--card); border-left:1px solid var(--border);
    padding:12px; overflow-y:auto; flex-shrink:0;
  }
  .info-panel h3 { font-size:0.8em; text-transform:uppercase; color:var(--muted); letter-spacing:0.05em; margin-bottom:8px; }
  .info-block {
    background:rgba(59,130,246,0.05); border:1px solid var(--border);
    border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .info-row { display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.88em; }
  .info-row .label { color:var(--muted); }
  .info-row .value { font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:500; }

  .formula-box {
    background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.3);
    border-radius:8px; padding:10px; margin-top:8px; font-family:'JetBrains Mono',monospace;
    font-size:0.82em; color:var(--purple); line-height:1.6;
  }

  .tip-box {
    background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.3);
    border-radius:8px; padding:10px; margin-top:8px; font-size:0.85em;
    color:var(--green); line-height:1.5;
  }

  /* Lesson panel */
  .lesson-panel {
    display:none; position:absolute; bottom:0; left:0; right:0;
    background:var(--card); border-top:2px solid var(--accent);
    padding:16px 20px; max-height:40%; overflow-y:auto;
    animation:slideUp 0.3s ease;
  }
  .lesson-panel.show { display:block; }
  @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
  .lesson-panel h3 { color:var(--accent); margin-bottom:8px; }
  .lesson-panel p { color:var(--muted); line-height:1.6; margin-bottom:8px; font-size:0.92em; }
  .lesson-close {
    position:absolute; top:12px; right:16px;
    background:var(--border); border:none; color:var(--text);
    width:28px; height:28px; border-radius:50%; cursor:pointer;
    font-size:1em; display:flex; align-items:center; justify-content:center;
  }

  /* Status bar */
  .statusbar {
    padding:6px 20px; background:var(--card); border-top:1px solid var(--border);
    display:flex; justify-content:space-between; font-size:0.78em; color:var(--muted);
    font-family:'JetBrains Mono',monospace;
  }

  /* Slider */
  .slider-row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .slider-row label { font-size:0.82em; color:var(--muted); min-width:50px; }
  input[type="range"] {
    flex:1; -webkit-appearance:none; height:4px; border-radius:2px;
    background:var(--border); outline:none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer;
  }
  .slider-val { font-family:'JetBrains Mono',monospace; font-size:0.82em; color:var(--accent); min-width:35px; text-align:right; }

  .clear-btn {
    background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
    color:var(--red); padding:8px; border-radius:8px; width:100%;
    font-family:'Inter',sans-serif; font-size:0.85em; cursor:pointer;
    transition:all 0.2s; margin-top:8px;
  }
  .clear-btn:hover { background:rgba(239,68,68,0.2); }
</style>
</head>
<body>

<div class="topbar">
  <h1>📐 <span>Geometry Visualizer</span></h1>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('create')">Create</button>
    <button class="mode-tab" onclick="setMode('transform')">Transform</button>
    <button class="mode-tab" onclick="setMode('measure')">Measure</button>
    <button class="mode-tab" onclick="setMode('explore')">Explore</button>
  </div>
</div>

<div class="main">
  <!-- Left panel -->
  <div class="tools-panel" id="toolsPanel">
    <!-- populated by JS -->
  </div>

  <!-- Canvas -->
  <div class="canvas-area">
    <canvas id="geoCanvas"></canvas>
    <div class="lesson-panel" id="lessonPanel">
      <button class="lesson-close" onclick="closeLesson()">×</button>
      <div id="lessonContent"></div>
    </div>
  </div>

  <!-- Right info -->
  <div class="info-panel" id="infoPanel">
    <h3>Properties</h3>
    <div id="infoContent">
      <div class="info-block">
        <p style="color:var(--muted);font-size:0.9em;">Click on a shape to see its properties, or create a new shape using the tools on the left.</p>
      </div>
      <div class="tip-box">💡 Tip: Drag any vertex (corner point) to reshape a figure and watch the measurements update live!</div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="statusCoords">Mouse: (0, 0)</span>
  <span id="statusInfo">Ready — click a tool to begin</span>
  <span id="statusShapes">Shapes: 0</span>
</div>

<script>
// ─── State ───
let mode = 'create';
let activeTool = null;
let shapes = [];
let selectedShape = null;
let dragPoint = null;
let dragShapeOffset = null;
let currentColor = '#3b82f6';
let gridSnap = true;
let showGrid = true;
let showAngles = true;
let showLengths = true;
let gridSize = 30;
let panX = 0, panY = 0;
let creatingPoints = [];

const COLORS = ['#3b82f6','#10b981','#ef4444','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316'];

const canvas = document.getElementById('geoCanvas');
const ctx = canvas.getContext('2d');

// ─── Resize ───
function resize() {
  const area = canvas.parentElement;
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

// ─── Snap ───
function snap(x, y) {
  if (!gridSnap) return {x, y};
  return {
    x: Math.round((x - panX) / gridSize) * gridSize + panX,
    y: Math.round((y - panY) / gridSize) * gridSize + panY
  };
}

// ─── Shape class ───
class Shape {
  constructor(type, points, color) {
    this.type = type; // 'triangle','rect','polygon','circle','line','angle'
    this.points = points.map(p => ({...p}));
    this.color = color;
    this.id = Date.now() + Math.random();
  }

  getBounds() {
    const xs = this.points.map(p=>p.x), ys = this.points.map(p=>p.y);
    return { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
  }

  containsPoint(px, py) {
    if (this.type === 'circle') {
      const dx = px - this.points[0].x, dy = py - this.points[0].y;
      const r = dist(this.points[0], this.points[1]);
      return Math.sqrt(dx*dx+dy*dy) <= r + 5;
    }
    if (this.type === 'line') {
      return distToSegment(px, py, this.points[0], this.points[1]) < 8;
    }
    // polygon point-in-polygon
    let inside = false;
    const pts = this.points;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      if ((pts[i].y > py) !== (pts[j].y > py) &&
          px < (pts[j].x - pts[i].x) * (py - pts[i].y) / (pts[j].y - pts[i].y) + pts[i].x)
        inside = !inside;
    }
    return inside;
  }

  nearestVertex(px, py) {
    let best = -1, bestD = 20;
    this.points.forEach((p, i) => {
      const d = Math.sqrt((px-p.x)**2 + (py-p.y)**2);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  getProperties() {
    const props = {};
    if (this.type === 'circle') {
      const r = dist(this.points[0], this.points[1]);
      props['Radius'] = r.toFixed(1) + ' units';
      props['Diameter'] = (2*r).toFixed(1) + ' units';
      props['Circumference'] = (2*Math.PI*r).toFixed(1) + ' units';
      props['Area'] = (Math.PI*r*r).toFixed(1) + ' sq units';
      props['Center'] = `(${((this.points[0].x-panX)/gridSize).toFixed(1)}, ${(-(this.points[0].y-panY)/gridSize).toFixed(1)})`;
    } else if (this.type === 'line') {
      const d = dist(this.points[0], this.points[1]);
      props['Length'] = d.toFixed(1) + ' units';
      const dx = this.points[1].x - this.points[0].x;
      const dy = this.points[1].y - this.points[0].y;
      const angle = Math.atan2(-dy, dx) * 180 / Math.PI;
      props['Angle'] = angle.toFixed(1) + '°';
      if (dx !== 0) props['Slope'] = (-dy/dx).toFixed(2);
      else props['Slope'] = 'undefined (vertical)';
      props['Midpoint'] = `(${(((this.points[0].x+this.points[1].x)/2-panX)/gridSize).toFixed(1)}, ${(-((this.points[0].y+this.points[1].y)/2-panY)/gridSize).toFixed(1)})`;
    } else {
      // polygon
      const pts = this.points;
      const n = pts.length;
      // perimeter
      let perim = 0;
      const sides = [];
      for (let i = 0; i < n; i++) {
        const d = dist(pts[i], pts[(i+1)%n]);
        sides.push(d);
        perim += d;
      }
      props['Sides'] = n;
      props['Perimeter'] = perim.toFixed(1) + ' units';

      // area (shoelace)
      let area = 0;
      for (let i = 0; i < n; i++) {
        area += pts[i].x * pts[(i+1)%n].y - pts[(i+1)%n].x * pts[i].y;
      }
      area = Math.abs(area) / 2;
      props['Area'] = area.toFixed(1) + ' sq units';

      // angles
      const angles = [];
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n];
        const a = Math.atan2(p0.y-p1.y, p0.x-p1.x);
        const b = Math.atan2(p2.y-p1.y, p2.x-p1.x);
        let ang = (a - b) * 180 / Math.PI;
        if (ang < 0) ang += 360;
        if (ang > 180) ang = 360 - ang;
        angles.push(ang);
      }
      props['Angles'] = angles.map(a => a.toFixed(1) + '°').join(', ');
      props['Angle Sum'] = angles.reduce((s,a)=>s+a,0).toFixed(1) + '°';

      if (n === 3) {
        props['Type'] = classifyTriangle(sides, angles);
      } else if (n === 4) {
        props['Type'] = classifyQuadrilateral(sides, angles);
      }

      // side lengths
      sides.forEach((s, i) => {
        props[`Side ${i+1}`] = s.toFixed(1) + ' units';
      });
    }
    return props;
  }
}

function classifyTriangle(sides, angles) {
  const s = sides.map(x=>Math.round(x*10));
  const a = angles;
  let type = [];
  if (s[0]===s[1] && s[1]===s[2]) type.push('Equilateral');
  else if (s[0]===s[1] || s[1]===s[2] || s[0]===s[2]) type.push('Isosceles');
  else type.push('Scalene');
  if (a.some(x => Math.abs(x-90) < 2)) type.push('Right');
  else if (a.some(x => x > 90)) type.push('Obtuse');
  else type.push('Acute');
  return type.join(' ');
}

function classifyQuadrilateral(sides, angles) {
  const s = sides.map(x=>Math.round(x*10));
  const a = angles.map(x=>Math.round(x));
  const allRight = a.every(x=>Math.abs(x-90)<3);
  const oppEqual = s[0]===s[2] && s[1]===s[3];
  const allEqual = s[0]===s[1] && s[1]===s[2] && s[2]===s[3];
  if (allEqual && allRight) return 'Square';
  if (allRight && oppEqual) return 'Rectangle';
  if (allEqual) return 'Rhombus';
  if (oppEqual) return 'Parallelogram';
  return 'Quadrilateral';
}

function dist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }
function distToSegment(px, py, a, b) {
  const dx=b.x-a.x, dy=b.y-a.y;
  const len2 = dx*dx+dy*dy;
  if (len2===0) return Math.sqrt((px-a.x)**2+(py-a.y)**2);
  let t = ((px-a.x)*dx+(py-a.y)*dy)/len2;
  t = Math.max(0, Math.min(1, t));
  return Math.sqrt((px-a.x-t*dx)**2 + (py-a.y-t*dy)**2);
}

// ─── Drawing ───
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  if (showGrid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const startX = panX % gridSize;
    const startY = panY % gridSize;
    for (let x = startX; x < canvas.width; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = startY; y < canvas.height; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    // Axes
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, panY); ctx.lineTo(canvas.width, panY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(panX, 0); ctx.lineTo(panX, canvas.height); ctx.stroke();

    // Axis labels
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '10px JetBrains Mono';
    for (let x = panX % gridSize; x < canvas.width; x += gridSize * 2) {
      const val = Math.round((x - panX) / gridSize);
      if (val !== 0) ctx.fillText(val, x - 4, panY + 14);
    }
    for (let y = panY % gridSize; y < canvas.height; y += gridSize * 2) {
      const val = -Math.round((y - panY) / gridSize);
      if (val !== 0) ctx.fillText(val, panX + 6, y + 4);
    }
  }

  // Shapes
  shapes.forEach(shape => {
    const isSelected = selectedShape && selectedShape.id === shape.id;
    ctx.save();
    ctx.strokeStyle = shape.color;
    ctx.fillStyle = shape.color + '20';
    ctx.lineWidth = isSelected ? 3 : 2;

    if (shape.type === 'circle') {
      const r = dist(shape.points[0], shape.points[1]);
      ctx.beginPath();
      ctx.arc(shape.points[0].x, shape.points[0].y, r, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // center dot
      ctx.fillStyle = shape.color;
      ctx.beginPath(); ctx.arc(shape.points[0].x, shape.points[0].y, 4, 0, Math.PI*2); ctx.fill();
    } else if (shape.type === 'line') {
      ctx.beginPath();
      ctx.moveTo(shape.points[0].x, shape.points[0].y);
      ctx.lineTo(shape.points[1].x, shape.points[1].y);
      ctx.stroke();
      if (showLengths) {
        const mx = (shape.points[0].x+shape.points[1].x)/2;
        const my = (shape.points[0].y+shape.points[1].y)/2;
        const d = dist(shape.points[0], shape.points[1]);
        drawLabel(mx, my-10, d.toFixed(1), shape.color);
      }
    } else {
      // Polygon
      ctx.beginPath();
      shape.points.forEach((p, i) => i===0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Side lengths
      if (showLengths) {
        const pts = shape.points;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i+1)%pts.length];
          const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
          const d = dist(a, b);
          drawLabel(mx, my - 8, d.toFixed(1), shape.color);
        }
      }

      // Angles
      if (showAngles) {
        const pts = shape.points;
        for (let i = 0; i < pts.length; i++) {
          const p0 = pts[(i-1+pts.length)%pts.length], p1 = pts[i], p2 = pts[(i+1)%pts.length];
          const a1 = Math.atan2(p0.y-p1.y, p0.x-p1.x);
          const a2 = Math.atan2(p2.y-p1.y, p2.x-p1.x);
          let ang = (a1 - a2) * 180 / Math.PI;
          if (ang < 0) ang += 360;
          if (ang > 180) ang = 360 - ang;

          // Draw arc
          ctx.beginPath();
          const startA = Math.min(a1, a2);
          const endA = Math.max(a1, a2);
          ctx.arc(p1.x, p1.y, 20, a2, a1);
          ctx.strokeStyle = shape.color + '80';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Right angle marker
          if (Math.abs(ang - 90) < 3) {
            const size = 12;
            const mid = (a1 + a2) / 2;
            ctx.strokeStyle = shape.color;
            ctx.strokeRect(p1.x + Math.cos(a2)*size, p1.y + Math.sin(a2)*size,
                          Math.cos(a1)*size, Math.sin(a1)*size);
          }

          // Angle label
          const midA = (a1 + a2) / 2;
          const lx = p1.x + Math.cos(midA) * 32;
          const ly = p1.y + Math.sin(midA) * 32;
          ctx.fillStyle = '#ffffff99';
          ctx.font = '10px JetBrains Mono';
          ctx.fillText(ang.toFixed(0) + '°', lx - 10, ly + 3);
        }
      }
    }

    // Vertices
    shape.points.forEach((p, i) => {
      ctx.fillStyle = isSelected ? '#fff' : shape.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isSelected ? 6 : 5, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = shape.color;
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    if (isSelected) {
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#ffffff40';
      ctx.lineWidth = 1;
      const b = shape.getBounds();
      ctx.strokeRect(b.minX-10, b.minY-10, b.maxX-b.minX+20, b.maxY-b.minY+20);
      ctx.setLineDash([]);
    }

    ctx.restore();
  });

  // Creation preview
  if (creatingPoints.length > 0 && activeTool) {
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = currentColor + '80';
    ctx.lineWidth = 2;
    ctx.beginPath();
    creatingPoints.forEach((p, i) => i===0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.setLineDash([]);
    creatingPoints.forEach(p => {
      ctx.fillStyle = currentColor;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    });
  }
}

function drawLabel(x, y, text, color) {
  ctx.font = '11px JetBrains Mono';
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - 8, w, 16, 4);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.fillText(text, x - w/2 + 4, y + 4);
}

// ─── Tools Panel ───
const TOOLS = {
  create: [
    { section: 'Shapes', items: [
      { id:'triangle', icon:'△', label:'Triangle', tip:'Click 3 points' },
      { id:'rectangle', icon:'▭', label:'Rectangle', tip:'Click 2 corners' },
      { id:'polygon', icon:'⬠', label:'Polygon', tip:'Click points, double-click to finish' },
      { id:'circle', icon:'○', label:'Circle', tip:'Click center, then edge' },
      { id:'line', icon:'╱', label:'Line Segment', tip:'Click 2 endpoints' },
    ]},
    { section: 'Options', items: [] }
  ],
  transform: [
    { section: 'Transformations', items: [
      { id:'translate', icon:'↗', label:'Translate', tip:'Drag to move' },
      { id:'rotate', icon:'↻', label:'Rotate', tip:'Select shape, use slider' },
      { id:'reflect_x', icon:'↔', label:'Reflect X-axis', tip:'Flip over x-axis' },
      { id:'reflect_y', icon:'↕', label:'Reflect Y-axis', tip:'Flip over y-axis' },
      { id:'scale_up', icon:'⊕', label:'Scale Up 1.5×', tip:'Make 1.5× bigger' },
      { id:'scale_down', icon:'⊖', label:'Scale Down 0.67×', tip:'Make smaller' },
      { id:'duplicate', icon:'⧉', label:'Duplicate', tip:'Copy selected shape' },
    ]}
  ],
  measure: [
    { section: 'Display', items: [
      { id:'toggle_lengths', icon:'📏', label:'Side Lengths', tip:'Show/hide lengths' },
      { id:'toggle_angles', icon:'📐', label:'Angles', tip:'Show/hide angles' },
      { id:'toggle_grid', icon:'#', label:'Grid', tip:'Show/hide grid' },
      { id:'toggle_snap', icon:'🧲', label:'Grid Snap', tip:'Snap to grid on/off' },
    ]},
    { section: 'Actions', items: [
      { id:'midpoint', icon:'·', label:'Add Midpoints', tip:'Add midpoints to selected shape' },
    ]}
  ],
  explore: [
    { section: 'Lessons', items: [
      { id:'lesson_angles', icon:'📐', label:'Angle Relationships', tip:'Learn about angles' },
      { id:'lesson_triangles', icon:'△', label:'Triangle Types', tip:'Explore triangle properties' },
      { id:'lesson_pythagorean', icon:'²', label:'Pythagorean Theorem', tip:'a² + b² = c²' },
      { id:'lesson_area', icon:'▦', label:'Area Formulas', tip:'Calculate areas' },
      { id:'lesson_transforms', icon:'↻', label:'Transformations', tip:'Slides, flips, turns' },
      { id:'lesson_congruence', icon:'≅', label:'Congruence', tip:'When shapes are identical' },
    ]}
  ]
};

const LESSONS = {
  lesson_angles: {
    title: '📐 Angle Relationships',
    content: `<p><strong>Complementary angles</strong> add up to 90°. <strong>Supplementary angles</strong> add up to 180°.</p>
    <p><strong>Vertical angles</strong> are formed when two lines cross — they're always equal!</p>
    <p><strong>Try it:</strong> Create two intersecting lines and measure the angles. Notice how opposite angles are always equal.</p>
    <div class="formula-box">Complementary: a + b = 90°<br>Supplementary: a + b = 180°<br>Triangle angle sum: a + b + c = 180°<br>Quadrilateral angle sum: a + b + c + d = 360°</div>`
  },
  lesson_triangles: {
    title: '△ Triangle Types',
    content: `<p><strong>By sides:</strong> Equilateral (all equal), Isosceles (two equal), Scalene (none equal)</p>
    <p><strong>By angles:</strong> Acute (all < 90°), Right (one = 90°), Obtuse (one > 90°)</p>
    <p><strong>Try it:</strong> Create different triangles and drag the vertices. Watch how the classification changes in the properties panel!</p>
    <div class="formula-box">All triangle angles sum to 180°<br>Equilateral: all angles = 60°<br>Isosceles: base angles are equal</div>`
  },
  lesson_pythagorean: {
    title: '² Pythagorean Theorem',
    content: `<p>In a <strong>right triangle</strong>, the square of the longest side (hypotenuse) equals the sum of squares of the other two sides.</p>
    <p><strong>Try it:</strong> Create a right triangle (like 3-4-5). Check that a² + b² = c² using the side lengths shown!</p>
    <div class="formula-box">a² + b² = c²<br><br>Common right triangles:<br>3-4-5, 5-12-13, 8-15-17<br>Any multiple works too: 6-8-10</div>`
  },
  lesson_area: {
    title: '▦ Area Formulas',
    content: `<p>Create shapes and see their areas calculated live!</p>
    <div class="formula-box">Triangle: A = ½ × base × height<br>Rectangle: A = length × width<br>Circle: A = π × r²<br>Parallelogram: A = base × height<br>Trapezoid: A = ½(b₁ + b₂) × h</div>
    <p><strong>Try it:</strong> Create a rectangle and a triangle with the same base and height. The triangle's area is always exactly half!</p>`
  },
  lesson_transforms: {
    title: '↻ Transformations',
    content: `<p><strong>Translation</strong> — sliding a shape without rotating or flipping it.</p>
    <p><strong>Rotation</strong> — turning a shape around a point.</p>
    <p><strong>Reflection</strong> — flipping a shape over a line (like a mirror).</p>
    <p><strong>Dilation</strong> — making a shape bigger or smaller while keeping the same proportions.</p>
    <p><strong>Try it:</strong> Create a shape, then switch to Transform mode. Try each transformation and see what changes (and what stays the same)!</p>
    <div class="formula-box">Rigid transformations preserve:<br>• Side lengths ✓<br>• Angle measures ✓<br>• Area ✓<br><br>Dilations preserve:<br>• Angle measures ✓<br>• Shape proportions ✓<br>• Side lengths ✗ (they scale)</div>`
  },
  lesson_congruence: {
    title: '≅ Congruence & Similarity',
    content: `<p><strong>Congruent shapes</strong> are exactly the same size and shape. You can slide, rotate, or flip one to match the other perfectly.</p>
    <p><strong>Similar shapes</strong> have the same shape but can be different sizes. All angles are equal, and sides are proportional.</p>
    <p><strong>Try it:</strong> Create a triangle, duplicate it, then try translating, rotating, and reflecting. The duplicate stays congruent! Now try scaling — it becomes similar but not congruent.</p>
    <div class="formula-box">Congruence tests (triangles):<br>SSS: all 3 sides equal<br>SAS: 2 sides + included angle<br>ASA: 2 angles + included side<br>AAS: 2 angles + any side</div>`
  }
};

function buildToolsPanel() {
  const panel = document.getElementById('toolsPanel');
  const sections = TOOLS[mode] || [];
  let html = '';

  sections.forEach(sec => {
    html += `<div class="tool-section"><h3>${sec.section}</h3>`;
    sec.items.forEach(item => {
      const isActive = activeTool === item.id;
      const isToggle = item.id.startsWith('toggle_');
      let activeClass = isActive ? ' active' : '';
      if (item.id === 'toggle_lengths' && showLengths) activeClass = ' active';
      if (item.id === 'toggle_angles' && showAngles) activeClass = ' active';
      if (item.id === 'toggle_grid' && showGrid) activeClass = ' active';
      if (item.id === 'toggle_snap' && gridSnap) activeClass = ' active';
      html += `<button class="tool-btn${activeClass}" onclick="selectTool('${item.id}')" title="${item.tip}">
        <span class="ti">${item.icon}</span> ${item.label}
      </button>`;
    });
    html += '</div>';
  });

  // Color palette for create mode
  if (mode === 'create') {
    html += '<div class="tool-section"><h3>Color</h3><div class="color-row">';
    COLORS.forEach(c => {
      html += `<div class="color-swatch${c===currentColor?' active':''}" style="background:${c}" onclick="setColor('${c}')"></div>`;
    });
    html += '</div></div>';
  }

  // Transform slider
  if (mode === 'transform') {
    html += `<div class="tool-section"><h3>Rotation</h3>
      <div class="slider-row"><label>Angle</label>
        <input type="range" min="0" max="360" value="0" id="rotSlider" oninput="updateRotLabel()">
        <span class="slider-val" id="rotVal">0°</span>
      </div>
      <button class="tool-btn" onclick="applyRotation()"><span class="ti">✓</span> Apply Rotation</button>
    </div>`;
  }

  html += '<button class="clear-btn" onclick="clearAll()">🗑 Clear All Shapes</button>';
  panel.innerHTML = html;
}

function updateRotLabel() {
  document.getElementById('rotVal').textContent = document.getElementById('rotSlider').value + '°';
}

function applyRotation() {
  if (!selectedShape) { setStatus('Select a shape first!'); return; }
  const deg = parseInt(document.getElementById('rotSlider').value);
  const rad = deg * Math.PI / 180;
  const cx = selectedShape.points.reduce((s,p)=>s+p.x,0) / selectedShape.points.length;
  const cy = selectedShape.points.reduce((s,p)=>s+p.y,0) / selectedShape.points.length;
  selectedShape.points.forEach(p => {
    const dx = p.x - cx, dy = p.y - cy;
    p.x = cx + dx*Math.cos(rad) - dy*Math.sin(rad);
    p.y = cy + dx*Math.sin(rad) + dy*Math.cos(rad);
  });
  draw();
  updateInfo();
}

// ─── Tool actions ───
function selectTool(id) {
  // Toggle display options
  if (id === 'toggle_lengths') { showLengths = !showLengths; buildToolsPanel(); draw(); return; }
  if (id === 'toggle_angles') { showAngles = !showAngles; buildToolsPanel(); draw(); return; }
  if (id === 'toggle_grid') { showGrid = !showGrid; buildToolsPanel(); draw(); return; }
  if (id === 'toggle_snap') { gridSnap = !gridSnap; buildToolsPanel(); draw(); return; }

  // Transform actions
  if (id === 'reflect_x' && selectedShape) {
    const cy = panY;
    selectedShape.points.forEach(p => p.y = 2*cy - p.y);
    draw(); updateInfo(); return;
  }
  if (id === 'reflect_y' && selectedShape) {
    const cx = panX;
    selectedShape.points.forEach(p => p.x = 2*cx - p.x);
    draw(); updateInfo(); return;
  }
  if (id === 'scale_up' && selectedShape) {
    scaleShape(selectedShape, 1.5); draw(); updateInfo(); return;
  }
  if (id === 'scale_down' && selectedShape) {
    scaleShape(selectedShape, 0.667); draw(); updateInfo(); return;
  }
  if (id === 'duplicate' && selectedShape) {
    const newPts = selectedShape.points.map(p => ({x: p.x + 40, y: p.y + 40}));
    const ns = new Shape(selectedShape.type, newPts, selectedShape.color);
    shapes.push(ns);
    selectedShape = ns;
    draw(); updateInfo(); updateShapeCount(); return;
  }
  if (id === 'midpoint' && selectedShape && selectedShape.type !== 'circle') {
    const pts = selectedShape.points;
    const mids = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i+1)%pts.length];
      mids.push({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
    }
    mids.forEach(m => {
      shapes.push(new Shape('circle', [m, {x:m.x+3, y:m.y}], '#ffffff'));
    });
    draw(); updateShapeCount(); return;
  }

  // Lessons
  if (id.startsWith('lesson_')) {
    showLesson(id); return;
  }

  // Transform actions that need selection
  if (['reflect_x','reflect_y','scale_up','scale_down','duplicate','midpoint'].includes(id) && !selectedShape) {
    setStatus('Select a shape first!'); return;
  }

  activeTool = activeTool === id ? null : id;
  creatingPoints = [];
  buildToolsPanel();
  if (activeTool) setStatus(`Tool: ${id} — ${TOOLS[mode].flatMap(s=>s.items).find(i=>i.id===id)?.tip || ''}`);
  else setStatus('Ready');
}

function scaleShape(shape, factor) {
  const cx = shape.points.reduce((s,p)=>s+p.x,0) / shape.points.length;
  const cy = shape.points.reduce((s,p)=>s+p.y,0) / shape.points.length;
  shape.points.forEach(p => {
    p.x = cx + (p.x-cx)*factor;
    p.y = cy + (p.y-cy)*factor;
  });
}

function showLesson(id) {
  const lesson = LESSONS[id];
  if (!lesson) return;
  document.getElementById('lessonContent').innerHTML = `<h3>${lesson.title}</h3>${lesson.content}`;
  document.getElementById('lessonPanel').classList.add('show');
}
function closeLesson() {
  document.getElementById('lessonPanel').classList.remove('show');
}

// ─── Mode switch ───
function setMode(m) {
  mode = m;
  activeTool = null;
  creatingPoints = [];
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase() === m));
  buildToolsPanel();
  if (m === 'transform' && !selectedShape && shapes.length > 0) {
    setStatus('Click a shape to select it, then use transform tools');
  }
}

function setColor(c) {
  currentColor = c;
  buildToolsPanel();
}

function clearAll() {
  shapes = []; selectedShape = null; creatingPoints = [];
  draw(); updateInfo(); updateShapeCount();
}

// ─── Mouse handling ───
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const snapped = snap(mx, my);

  // Check for vertex drag on selected shape
  if (selectedShape) {
    const vi = selectedShape.nearestVertex(mx, my);
    if (vi >= 0) { dragPoint = { shape: selectedShape, index: vi }; return; }
  }

  // Check for shape click
  for (let i = shapes.length - 1; i >= 0; i--) {
    if (shapes[i].containsPoint(mx, my)) {
      // Check vertex first
      const vi = shapes[i].nearestVertex(mx, my);
      if (vi >= 0) {
        selectedShape = shapes[i];
        dragPoint = { shape: shapes[i], index: vi };
        updateInfo(); draw(); return;
      }
      // Shape body drag
      if (mode === 'transform' || !activeTool) {
        selectedShape = shapes[i];
        dragShapeOffset = { dx: mx - shapes[i].points[0].x, dy: my - shapes[i].points[0].y };
        updateInfo(); draw(); return;
      }
    }
  }

  // Creating new shape
  if (mode === 'create' && activeTool) {
    creatingPoints.push(snapped);
    const tool = activeTool;

    if (tool === 'triangle' && creatingPoints.length === 3) {
      shapes.push(new Shape('triangle', creatingPoints, currentColor));
      creatingPoints = [];
      updateShapeCount();
    } else if (tool === 'rectangle' && creatingPoints.length === 2) {
      const [a, b] = creatingPoints;
      const pts = [{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}];
      shapes.push(new Shape('rect', pts, currentColor));
      creatingPoints = [];
      updateShapeCount();
    } else if (tool === 'circle' && creatingPoints.length === 2) {
      shapes.push(new Shape('circle', creatingPoints, currentColor));
      creatingPoints = [];
      updateShapeCount();
    } else if (tool === 'line' && creatingPoints.length === 2) {
      shapes.push(new Shape('line', creatingPoints, currentColor));
      creatingPoints = [];
      updateShapeCount();
    }
    draw();
    return;
  }

  // Deselect
  selectedShape = null;
  updateInfo();
  draw();
});

canvas.addEventListener('dblclick', e => {
  if (activeTool === 'polygon' && creatingPoints.length >= 3) {
    shapes.push(new Shape('polygon', creatingPoints, currentColor));
    creatingPoints = [];
    draw();
    updateShapeCount();
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const snapped = snap(mx, my);

  // Coordinate display
  const gx = ((mx - panX) / gridSize).toFixed(1);
  const gy = (-(my - panY) / gridSize).toFixed(1);
  document.getElementById('statusCoords').textContent = `Mouse: (${gx}, ${gy})`;

  if (dragPoint) {
    dragPoint.shape.points[dragPoint.index] = snapped;
    draw();
    if (selectedShape) updateInfo();
    return;
  }

  if (dragShapeOffset && selectedShape) {
    const dx = mx - dragShapeOffset.dx - selectedShape.points[0].x;
    const dy = my - dragShapeOffset.dy - selectedShape.points[0].y;
    selectedShape.points.forEach(p => { p.x += dx; p.y += dy; });
    dragShapeOffset.dx = mx - selectedShape.points[0].x;
    dragShapeOffset.dy = my - selectedShape.points[0].y;
    draw();
    updateInfo();
    return;
  }

  // Hover cursor
  let onVertex = false;
  shapes.forEach(s => { if (s.nearestVertex(mx, my) >= 0) onVertex = true; });
  canvas.style.cursor = onVertex ? 'grab' : (activeTool ? 'crosshair' : 'default');
});

canvas.addEventListener('mouseup', () => {
  dragPoint = null;
  dragShapeOffset = null;
});

// Delete key
document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedShape) {
    shapes = shapes.filter(s => s.id !== selectedShape.id);
    selectedShape = null;
    draw(); updateInfo(); updateShapeCount();
  }
  if (e.key === 'Escape') {
    creatingPoints = [];
    activeTool = null;
    buildToolsPanel();
    draw();
  }
});

// ─── Info panel update ───
function updateInfo() {
  const el = document.getElementById('infoContent');
  if (!selectedShape) {
    el.innerHTML = `<div class="info-block">
      <p style="color:var(--muted);font-size:0.9em;">Click on a shape to see its properties, or create a new shape using the tools on the left.</p>
    </div>
    <div class="tip-box">💡 Tip: Drag any vertex (corner point) to reshape a figure and watch the measurements update live!</div>`;
    return;
  }

  const props = selectedShape.getProperties();
  let html = `<div class="info-block">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <div style="width:14px;height:14px;border-radius:4px;background:${selectedShape.color};"></div>
      <strong>${selectedShape.type.charAt(0).toUpperCase() + selectedShape.type.slice(1)}</strong>
    </div>`;

  for (const [key, val] of Object.entries(props)) {
    html += `<div class="info-row"><span class="label">${key}</span><span class="value">${val}</span></div>`;
  }
  html += '</div>';

  // Formulas
  if (selectedShape.type === 'circle') {
    html += `<div class="formula-box">C = 2πr<br>A = πr²</div>`;
  } else if (selectedShape.type === 'triangle' || selectedShape.points?.length === 3) {
    html += `<div class="formula-box">A = ½ × base × height<br>Angle sum = 180°</div>`;
  } else if (selectedShape.points?.length === 4) {
    html += `<div class="formula-box">Rectangle: A = l × w<br>Angle sum = 360°</div>`;
  }

  html += `<div class="tip-box">💡 Press Delete/Backspace to remove this shape. Drag vertices to reshape.</div>`;
  el.innerHTML = html;
}

function updateShapeCount() {
  document.getElementById('statusShapes').textContent = `Shapes: ${shapes.length}`;
}

function setStatus(msg) {
  document.getElementById('statusInfo').textContent = msg;
}

// ─── Init ───
function init() {
  panX = Math.round(canvas.width * 0.4);
  panY = Math.round(canvas.height * 0.5);
  buildToolsPanel();
  draw();
}
resize();
setTimeout(init, 50);
</script>
</body>
</html>
