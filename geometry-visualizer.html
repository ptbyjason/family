<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Prep Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0e1a; --card: #111827; --border: #1e293b;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
    --purple: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* Top bar */
  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 20px; background:var(--card); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .topbar h1 { font-size:1.15em; display:flex; align-items:center; gap:8px; }
  .topbar h1 span { color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    background:rgba(59,130,246,0.08); border:1px solid var(--border); border-radius:20px;
    padding:4px 12px; font-size:0.82em; font-family:'JetBrains Mono',monospace; color:var(--text);
  }
  .mode-tabs { display:flex; gap:4px; }
  .mode-tab {
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:7px 16px; border-radius:8px; font-family:'Inter',sans-serif; font-weight:600;
    font-size:0.88em; cursor:pointer; transition:all 0.2s;
  }
  .mode-tab:hover { border-color:var(--accent); color:var(--text); }
  .mode-tab.active { background:var(--accent); border-color:var(--accent); color:white; }

  .content { flex:1; overflow-y:auto; padding:18px; }
  .wrap { max-width:860px; margin:0 auto; }
  .tab { display:none; }
  .tab.active { display:block; }

  h2.sec { font-size:0.8em; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:14px 0 8px; }

  /* Topic mastery bars */
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; margin-bottom:14px; }
  .topic-row {
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px;
  }
  .topic-row .tr-top { display:flex; justify-content:space-between; font-size:0.82em; margin-bottom:5px; }
  .topic-row .tr-pct { font-family:'JetBrains Mono',monospace; color:var(--accent); }
  .bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--cyan)); border-radius:3px; transition:width .4s; }

  /* Flashcard */
  .flash { perspective:1200px; height:360px; cursor:pointer; margin-bottom:12px; }
  .flash-inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flash.flipped .flash-inner { transform:rotateY(180deg); }
  .flash-face {
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px; gap:8px; text-align:center; overflow:hidden;
  }
  .flash-back { transform:rotateY(180deg); border-color:rgba(139,92,246,0.45); }
  .flash-topic { font-size:0.72em; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .flash-title { font-size:1.25em; font-weight:700; }
  .flash-hint { font-size:0.78em; color:var(--muted); }
  .mdots { font-size:0.85em; letter-spacing:2px; color:var(--green); }

  .fig-box svg { width:100%; max-width:330px; height:auto; display:block; margin:0 auto; }

  .formula-box {
    background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.3);
    border-radius:8px; padding:10px 16px; font-family:'JetBrains Mono',monospace;
    font-size:1.05em; color:var(--purple); line-height:1.6;
  }
  .example-box {
    background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.3);
    border-radius:8px; padding:10px 14px; font-size:0.9em; color:var(--green); line-height:1.6;
    font-family:'JetBrains Mono',monospace;
  }

  .btn {
    background:rgba(59,130,246,0.12); border:1px solid var(--accent); color:var(--text);
    padding:10px 20px; border-radius:10px; font-family:'Inter',sans-serif; font-weight:700;
    font-size:0.95em; cursor:pointer; transition:all .15s;
  }
  .btn:hover { background:rgba(59,130,246,0.25); }
  .btn.green { border-color:var(--green); background:rgba(16,185,129,0.12); color:var(--green); }
  .btn.green:hover { background:rgba(16,185,129,0.25); }
  .btn.red { border-color:var(--red); background:rgba(239,68,68,0.1); color:var(--red); }
  .btn.red:hover { background:rgba(239,68,68,0.22); }
  .btn.big { font-size:1.1em; padding:14px 30px; }
  .btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* Practice */
  .level-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .lvl-btn {
    flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:9px 8px; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif;
    font-size:0.85em; text-align:center; transition:all .15s;
  }
  .lvl-btn .lname { font-weight:700; }
  .lvl-btn .lsub { display:block; font-size:0.78em; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .lvl-btn.sel { border-color:var(--accent); background:rgba(59,130,246,0.15); box-shadow:0 0 12px rgba(59,130,246,0.25); }
  .lvl-btn.locked { opacity:0.45; cursor:not-allowed; }

  .prob-card {
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px; text-align:center;
  }
  .prob-q { font-size:1.05em; font-weight:600; margin:10px 0 14px; }
  .ans-row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .ans-row input {
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:1.15em; padding:10px 14px;
    border-radius:10px; width:150px; text-align:center; outline:none;
  }
  .ans-row input:focus { border-color:var(--accent); }
  .ans-unit { font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:1.05em; min-width:44px; text-align:left; }

  .fb-good {
    margin-top:14px; padding:12px; border-radius:10px; font-weight:700;
    background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.4); color:var(--green);
  }
  .fb-bad {
    margin-top:14px; padding:12px; border-radius:10px; text-align:left;
    background:rgba(239,68,68,0.07); border:1px solid rgba(239,68,68,0.35);
  }
  .fb-bad .fb-head { color:var(--red); font-weight:700; margin-bottom:8px; }
  .step {
    font-family:'JetBrains Mono',monospace; font-size:0.9em; color:var(--text);
    padding:5px 10px; margin:4px 0; background:rgba(139,92,246,0.08);
    border-left:3px solid var(--purple); border-radius:4px;
  }

  .acc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin-top:8px; }

  /* Challenge */
  .chal-hero { text-align:center; padding:26px 16px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .chal-timer { font-family:'JetBrains Mono',monospace; font-size:2.4em; font-weight:700; color:var(--yellow); }
  .chal-timer.low { color:var(--red); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:0.5; } }
  .chal-stats { display:flex; gap:14px; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:0.95em; margin:8px 0; flex-wrap:wrap; }
  .chal-stats b { color:var(--accent); }
  .chal-streak { color:var(--yellow); }
  .chal-last { min-height:24px; font-family:'JetBrains Mono',monospace; font-size:0.9em; margin-top:8px; }
  .pr-line { font-size:1.05em; margin:10px 0; }
  .pr-line b { color:var(--yellow); font-family:'JetBrains Mono',monospace; }

  /* PR overlay */
  .pr-overlay {
    display:none; position:fixed; inset:0; background:rgba(10,14,26,0.9); z-index:50;
    align-items:center; justify-content:center;
  }
  .pr-overlay.show { display:flex; }
  .pr-inner { text-align:center; animation:pop .4s ease; }
  @keyframes pop { from { transform:scale(0.5); opacity:0; } to { transform:scale(1); opacity:1; } }
  .pr-title { font-size:3em; font-weight:800; color:var(--yellow); text-shadow:0 0 30px rgba(245,158,11,0.6); margin-bottom:8px; }
  .pr-sub { font-size:1.2em; color:var(--text); margin-bottom:18px; font-family:'JetBrains Mono',monospace; }
  .confetti { position:absolute; top:-20px; font-size:1.4em; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  @media (max-width:640px) {
    .content { padding:10px; }
    .flash { height:400px; }
    .topbar { padding:8px 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>📐 <span>Geometry Prep Trainer</span></h1>
  <div class="chips">
    <span class="chip" id="chipPts" title="Points — earn them in Practice and Challenge to unlock levels">⭐ 0 pts</span>
    <span class="chip" id="chipDay" title="Daily streak — train every day!">🔥 0</span>
    <span class="chip" id="chipPR" title="Challenge all-time high score">🏆 PR 0</span>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabbtn-learn" onclick="showTab('learn')">Learn</button>
    <button class="mode-tab" id="tabbtn-practice" onclick="showTab('practice')">Practice</button>
    <button class="mode-tab" id="tabbtn-challenge" onclick="showTab('challenge')">Challenge</button>
  </div>
</div>

<div class="content">
  <div class="wrap">
    <section class="tab active" id="tab-learn"></section>
    <section class="tab" id="tab-practice"></section>
    <section class="tab" id="tab-challenge"></section>
  </div>
</div>

<div class="pr-overlay" id="prOverlay">
  <div class="pr-inner">
    <div class="pr-title">🏆 NEW PR!</div>
    <div class="pr-sub" id="prSub"></div>
    <button class="btn big green" onclick="hidePR()">Let's go!</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  Geometry Prep Trainer — for Isaiah
//  Learn formulas → Practice problems → Beat your PR
// ════════════════════════════════════════════════════════════

const SAVE_KEY = 'geometry-visualizer-save-v1';
const LEVEL_PTS = [0, 100, 250, 500];
const LEVEL_NAMES = ['Rookie', 'Skilled', 'Pro', 'Legend'];

const TOPIC_META = {
  area:        { name:'Area',                 icon:'▦'  },
  perimeter:   { name:'Perimeter & Circles',  icon:'📏' },
  angles:      { name:'Angles',               icon:'📐' },
  pythagorean: { name:'Pythagorean',          icon:'²'  },
  volume:      { name:'Volume & Surface Area',icon:'🧊' },
  shapes:      { name:'Shapes & Types',       icon:'△'  },
};
const PRACTICE_TOPICS = ['area','perimeter','angles','pythagorean','volume'];

// ─── State + persistence ───
let S = { cards:{}, topics:{}, points:0, best:0, day:{ last:'', count:0 }, activity:{ date:'', actions:0, earnedDates:[] } };

// ─── Daily effort tracking ───
function localToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function normActivity(a) {
  const n = { date:'', actions:0, earnedDates:[] };
  if (a && typeof a === 'object') {
    if (typeof a.date === 'string') n.date = a.date;
    if (Number.isFinite(a.actions)) n.actions = a.actions;
    if (Array.isArray(a.earnedDates)) n.earnedDates = a.earnedDates.slice(-30);
  }
  return n;
}
function recordActivity(weight) {
  try {
    S.activity = normActivity(S.activity);
    const today = localToday();
    if (S.activity.date !== today) { S.activity.date = today; S.activity.actions = 0; }
    S.activity.actions += weight;
    if (S.activity.actions >= 20 && S.activity.earnedDates.indexOf(today) === -1) {
      S.activity.earnedDates.push(today);
      if (S.activity.earnedDates.length > 30) S.activity.earnedDates = S.activity.earnedDates.slice(-30);
    }
  } catch (e) { /* tracking must never break the app */ }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object') {
        S.cards  = (d.cards && typeof d.cards === 'object') ? d.cards : {};
        S.topics = (d.topics && typeof d.topics === 'object') ? d.topics : {};
        S.points = Number.isFinite(d.points) ? d.points : 0;
        S.best   = Number.isFinite(d.best) ? d.best : 0;
        S.day    = (d.day && typeof d.day === 'object') ? { last:d.day.last||'', count:d.day.count||0 } : { last:'', count:0 };
        S.activity = normActivity(d.activity); // older saves have no activity field
      }
    }
  } catch (e) { /* corrupt or unavailable save — start fresh */ }
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  writeHubSummary();
  updateChips();
}

function overallMastery() {
  let s = 0;
  CARDS.forEach(c => s += Math.min(2, S.cards[c.id] || 0));
  return CARDS.length ? Math.round(s / (CARDS.length * 2) * 100) : 0;
}

function unlockedLevel() {
  let l = 1;
  for (let i = 1; i < 4; i++) if (S.points >= LEVEL_PTS[i]) l = i + 1;
  return l;
}

function writeHubSummary() {
  try {
    const act = normActivity(S.activity);
    const today = localToday();
    localStorage.setItem('hubSummary_geometry-visualizer', JSON.stringify({
      app: 'geometry-visualizer', kid: 'isaiah', icon: '📐',
      label: `Level ${unlockedLevel()} • ${overallMastery()}% mastery • PR ${S.best}`,
      pct: overallMastery(),
      streak: S.day.count || null,
      stars: null,
      lastPlayed: new Date().toISOString(),
      actionsToday: act.date === today ? act.actions : 0,
      actionsDate: today,
      earnedDates: act.earnedDates
    }));
  } catch (e) {}
}

function markPlayed() {
  const today = new Date().toISOString().slice(0, 10);
  if (S.day.last === today) return;
  const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.day.count = (S.day.last === yest) ? (S.day.count || 0) + 1 : 1;
  S.day.last = today;
}

function updateChips() {
  document.getElementById('chipPts').textContent = `⭐ ${S.points} pts`;
  document.getElementById('chipDay').textContent = `🔥 ${S.day.count || 0}`;
  document.getElementById('chipPR').textContent = `🏆 PR ${S.best}`;
}

// ═══GEN-BEGIN═══ (pure figure + problem-generator code; node-testable)

function R(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function round2(x) { return Math.round(x * 100) / 100; }
const UNITS = ['cm', 'm', 'in', 'ft'];

// ─── SVG figure helpers (schematic, dimensions labeled) ───
function svgWrap(inner) {
  return `<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
const SHAPE_ST = 'stroke="var(--accent)" stroke-width="2.5" fill="rgba(59,130,246,0.12)" stroke-linejoin="round"';
const DASH_ST  = 'stroke="var(--yellow)" stroke-width="2" stroke-dasharray="6,4" fill="none"';
function T(x, y, s, anchor, size, fill) {
  return `<text x="${x}" y="${y}" fill="${fill||'var(--text)'}" font-size="${size||15}" text-anchor="${anchor||'middle'}" font-family="'JetBrains Mono',monospace">${s}</text>`;
}

function figRect(wL, hL) {
  return svgWrap(
    `<rect x="80" y="42" width="170" height="105" ${SHAPE_ST}/>` +
    T(165, 172, wL) + T(258, 100, hL, 'start')
  );
}
function figTri(bL, hL) {
  return svgWrap(
    `<polygon points="60,158 265,158 175,38" ${SHAPE_ST}/>` +
    `<line x1="175" y1="38" x2="175" y2="158" ${DASH_ST}/>` +
    `<path d="M175,146 h10 v12" stroke="var(--yellow)" fill="none" stroke-width="1.5"/>` +
    T(160, 180, bL) + T(184, 105, hL, 'start', 15, 'var(--yellow)')
  );
}
function figTriSides(aL, bL, cL) {
  // aL = bottom, bL = left, cL = right
  return svgWrap(
    `<polygon points="60,158 270,158 150,42" ${SHAPE_ST}/>` +
    T(165, 180, aL) + T(88, 95, bL, 'end') + T(228, 95, cL, 'start')
  );
}
function figPara(bL, hL) {
  return svgWrap(
    `<polygon points="55,152 215,152 270,52 110,52" ${SHAPE_ST}/>` +
    `<line x1="110" y1="52" x2="110" y2="152" ${DASH_ST}/>` +
    `<path d="M110,140 h10 v12" stroke="var(--yellow)" fill="none" stroke-width="1.5"/>` +
    T(135, 176, bL) + T(119, 108, hL, 'start', 15, 'var(--yellow)')
  );
}
function figTrap(topL, botL, hL) {
  return svgWrap(
    `<polygon points="50,152 275,152 215,48 110,48" ${SHAPE_ST}/>` +
    `<line x1="160" y1="48" x2="160" y2="152" ${DASH_ST}/>` +
    T(162, 38, topL) + T(162, 176, botL) + T(169, 106, hL, 'start', 15, 'var(--yellow)')
  );
}
function figCircle(label, kind) {
  const line = kind === 'd'
    ? `<line x1="92" y1="98" x2="228" y2="98" stroke="var(--yellow)" stroke-width="2"/>`
    : `<line x1="160" y1="98" x2="228" y2="98" stroke="var(--yellow)" stroke-width="2"/>`;
  return svgWrap(
    `<circle cx="160" cy="98" r="68" ${SHAPE_ST}/>` + line +
    `<circle cx="160" cy="98" r="3.5" fill="var(--accent)"/>` +
    T(kind === 'd' ? 160 : 194, 88, label, 'middle', 15, 'var(--yellow)')
  );
}
function figRightTri(aL, bL, cL) {
  // aL = vertical leg, bL = horizontal leg, cL = hypotenuse
  return svgWrap(
    `<polygon points="75,160 260,160 75,45" ${SHAPE_ST}/>` +
    `<path d="M75,144 h16 v16" stroke="var(--accent)" fill="none" stroke-width="1.5"/>` +
    T(64, 105, aL, 'end') + T(168, 180, bL) + T(180, 92, cL, 'start')
  );
}
function figTriAngles(leftL, rightL, topL) {
  return svgWrap(
    `<polygon points="60,160 270,160 150,45" ${SHAPE_ST}/>` +
    `<path d="M84,160 A24,24 0 0 0 76,144" stroke="var(--green)" fill="none" stroke-width="1.5"/>` +
    `<path d="M246,160 A24,24 0 0 1 254,146" stroke="var(--green)" fill="none" stroke-width="1.5"/>` +
    `<path d="M138,64 A22,22 0 0 1 163,65" stroke="var(--green)" fill="none" stroke-width="1.5"/>` +
    T(97, 150, leftL, 'start', 14) + T(238, 150, rightL, 'end', 14) + T(150, 88, topL, 'middle', 14, 'var(--yellow)')
  );
}
function figStraight(rightL, leftL) {
  return svgWrap(
    `<line x1="30" y1="150" x2="290" y2="150" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<line x1="160" y1="150" x2="235" y2="58" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<circle cx="160" cy="150" r="3.5" fill="var(--accent)"/>` +
    `<path d="M186,150 A26,26 0 0 0 176,130" stroke="var(--green)" fill="none" stroke-width="1.5"/>` +
    `<path d="M134,150 A26,26 0 0 1 145,128" stroke="var(--green)" fill="none" stroke-width="1.5"/>` +
    T(206, 134, rightL, 'start', 14) + T(118, 134, leftL, 'end', 14, 'var(--yellow)')
  );
}
function figVertical(leftL, rightL) {
  return svgWrap(
    `<line x1="50" y1="160" x2="270" y2="40" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<line x1="50" y1="40" x2="270" y2="160" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<circle cx="160" cy="100" r="3.5" fill="var(--accent)"/>` +
    T(84, 106, leftL, 'end', 14) + T(238, 106, rightL, 'start', 14, 'var(--yellow)')
  );
}
function figComp(lowerL, upperL) {
  return svgWrap(
    `<line x1="70" y1="160" x2="275" y2="160" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<line x1="70" y1="160" x2="70" y2="38" stroke="var(--accent)" stroke-width="2.5"/>` +
    `<line x1="70" y1="160" x2="215" y2="70" stroke="var(--accent)" stroke-width="2.5"/>` +
    T(160, 138, lowerL, 'middle', 14) + T(102, 82, upperL, 'middle', 14, 'var(--yellow)')
  );
}
function figQuadAngles(l1, l2, l3, l4) {
  // l1=bottom-left, l2=bottom-right, l3=top-right, l4=top-left
  return svgWrap(
    `<polygon points="70,155 265,160 235,45 100,40" ${SHAPE_ST}/>` +

function makeProblem(level) {
  const pool = GENS.filter(g => g.lvl <= level);
  const weighted = [];
  pool.forEach(g => { const w = (g.lvl === level) ? 3 : 1; for (let i = 0; i < w; i++) weighted.push(g); });
  const g = pick(weighted);
  const p = g.gen(level);
  p.genLvl = g.lvl;
  return p;
}

function checkAnswer(problem, value) {
  return Number.isFinite(value) && Math.abs(value - problem.ans) <= problem.tol;
}

let curTab = 'learn';
function showTab(t) {
  curTab = t;
  ['learn','practice','challenge'].forEach(x => {
    document.getElementById('tab-' + x).classList.toggle('active', x === t);
    document.getElementById('tabbtn-' + x).classList.toggle('active', x === t);

// ═══ LEARN ═══
let curCard = null, flipped = false;

function cardLevel(id) { return Math.min(2, S.cards[id] || 0); }

function topicMastery(t) {
  const cs = CARDS.filter(c => c.topic === t);
  if (!cs.length) return 0;
  let s = 0; cs.forEach(c => s += cardLevel(c.id));
  return Math.round(s / (cs.length * 2) * 100);
}

function nextCard() {
  const pool = [];
  CARDS.forEach(c => {
    const w = [6, 3, 1][cardLevel(c.id)];  // "still learning" cards show up way more
    for (let i = 0; i < w; i++) pool.push(c);
  });
  let c, guard = 0;
  do { c = pool[Math.floor(Math.random() * pool.length)]; guard++; }
  while (curCard && c.id === curCard.id && guard < 30);
  return c;
}

function renderLearn() {
  if (!curCard) curCard = nextCard();
  const el = document.getElementById('tab-learn');
  let bars = '';
  Object.keys(TOPIC_META).forEach(t => {
    const m = topicMastery(t);
    bars += `<div class="topic-row">
      <div class="tr-top"><span>${TOPIC_META[t].icon} ${TOPIC_META[t].name}</span><span class="tr-pct">${m}%</span></div>
      <div class="bar"><div style="width:${m}%"></div></div>
    </div>`;
  });
  const lv = cardLevel(curCard.id);
  const dots = '●'.repeat(lv) + '○'.repeat(2 - lv);
  el.innerHTML = `
    <h2 class="sec">Formula mastery — ${overallMastery()}% overall</h2>
    <div class="topic-grid">${bars}</div>
    <h2 class="sec">Flashcard — tap the card to flip it</h2>
    <div class="flash" id="flashCard" onclick="flipCard()">
      <div class="flash-inner">
        <div class="flash-face flash-front">
          <div class="flash-topic">${TOPIC_META[curCard.topic].icon} ${TOPIC_META[curCard.topic].name} <span class="mdots">${dots}</span></div>
          <div class="flash-title">${curCard.title}</div>
          <div class="fig-box">${curCard.fig}</div>
          <div class="flash-hint">tap to see the formula →</div>
        </div>
        <div class="flash-face flash-back">
          <div class="flash-topic">${curCard.title}</div>
          <div class="formula-box">${curCard.formula}</div>
          <div class="example-box">${curCard.ex}</div>
          <div class="flash-hint">Be honest — it makes you faster in Challenge mode!</div>
        </div>
      </div>
    </div>
    <div class="btn-row" id="flashActions" style="visibility:${flipped ? 'visible' : 'hidden'}">
      <button class="btn red" onclick="gradeCard(0)">😅 Still learning</button>
      <button class="btn green" onclick="gradeCard(1)">💪 Got it</button>
    </div>`;
  if (flipped) document.getElementById('flashCard').classList.add('flipped');
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashCard').classList.toggle('flipped', flipped);
  document.getElementById('flashActions').style.visibility = flipped ? 'visible' : 'hidden';
}

function gradeCard(got) {
  if (got) S.cards[curCard.id] = Math.min(2, (S.cards[curCard.id] || 0) + 1);
  else S.cards[curCard.id] = 0;
  markPlayed();
  recordActivity(1); // flashcard rated
  save();
  curCard = nextCard();
  flipped = false;
  renderLearn();
}

  if (l > unlockedLevel()) return;
  curLevel = l;
  practiceNew();
}

function practiceNew() {
  curLevel = Math.min(curLevel, unlockedLevel());
  curProblem = makeProblem(curLevel);
  answered = false;
  lastFeedback = '';

  const s = S.topics[t] || { r: 0, w: 0 };
  const tot = s.r + s.w;
  return { r: s.r, tot, pct: tot ? Math.round(s.r / tot * 100) : 0 };
}

        <input type="number" step="any" id="ansIn" placeholder="?" ${answered ? 'disabled' : ''}
          onkeydown="if(event.key==='Enter')practiceCheck()">
        <span class="ans-unit">${curProblem.unit}</span>
        ${answered
          ? '<button class="btn green" onclick="practiceNew()">Next problem ▶</button>'
          : '<button class="btn" onclick="practiceCheck()">Check ✓</button>'}
      </div>
      ${lastFeedback}
    </div>`;
  }

  let acc = '';
  PRACTICE_TOPICS.forEach(t => {
    const a = topicAcc(t);
    acc += `<div class="topic-row">
      <div class="tr-top"><span>${TOPIC_META[t].icon} ${TOPIC_META[t].name}</span>
      <span class="tr-pct">${a.tot ? `${a.r}/${a.tot} (${a.pct}%)` : '—'}</span></div>
      <div class="bar"><div style="width:${a.pct}%"></div></div>
    </div>`;
  });

  el.innerHTML = `
    <h2 class="sec">Difficulty — earn points to unlock higher levels</h2>
    <div class="level-row">${lvls}</div>
    ${probHTML}
    <h2 class="sec">Accuracy by topic</h2>
    <div class="acc-grid">${acc}</div>`;
}

function practiceCheck() {
  if (answered || !curProblem) return;
  const inp = document.getElementById('ansIn');
  const val = parseFloat(String(inp.value).replace(',', '.'));
  if (!Number.isFinite(val)) { inp.focus(); return; }
  answered = true;
  const t = curProblem.topic;
  if (!S.topics[t]) S.topics[t] = { r: 0, w: 0 };
  if (checkAnswer(curProblem, val)) {
    const pts = 10 * curLevel;
    S.topics[t].r++;
    const before = unlockedLevel();
    S.points += pts;
    const after = unlockedLevel();
    lastFeedback = `<div class="fb-good">✓ Correct! +${pts} pts${after > before ? ` &nbsp;🔓 LEVEL ${after} UNLOCKED!` : ''}</div>`;
  } else {
    S.topics[t].w++;
    const steps = curProblem.steps.map(s => `<div class="step">${s}</div>`).join('');
    lastFeedback = `<div class="fb-bad">
      <div class="fb-head">✗ Not quite — the answer is ${curProblem.ans} ${curProblem.unit}. Here's how:</div>
      ${steps}
    </div>`;
  }
  markPlayed();
  recordActivity(2); // practice problem answered (right or wrong)
  save();
  renderPractice();
}

// ═══ CHALLENGE (PR mode) ═══
const CHAL_TIME = 120;
let chal = { running: false, done: false, time: CHAL_TIME, score: 0, solved: 0, streak: 0, best: 0, prob: null, timer: null, last: '' };

function renderChallenge() {
  const el = document.getElementById('tab-challenge');
  if (!chal.running && !chal.done) {
    el.innerHTML = `<div class="chal-hero">
      <div style="font-size:2.6em">⚡</div>
      <h2 style="margin:6px 0">2-Minute Sprint</h2>
      <p style="color:var(--muted);max-width:420px;margin:6px auto 4px;line-height:1.5">
        Solve as many problems as you can in 2 minutes.<br>
        Correct = <b style="color:var(--accent)">10 pts</b> + <b style="color:var(--yellow)">streak bonus</b> (+2 per answer in a row, up to +20).<br>
        Wrong answers kill your streak. Problems come from all your unlocked levels.
      </p>
      <div class="pr-line">All-time PR: <b>🏆 ${S.best}</b></div>
      <button class="btn big green" onclick="startChallenge()">START ▶</button>
    </div>`;
    return;
  }
  if (chal.done) {
    el.innerHTML = `<div class="chal-hero">
      <div style="font-size:2.6em">${chal.newPR ? '🏆' : '⏱'}</div>
      <h2 style="margin:6px 0">${chal.newPR ? 'NEW PERSONAL RECORD!' : 'Time!'}</h2>
      <div class="chal-stats">
        <span>Score: <b>${chal.score}</b></span>
        <span>Solved: <b>${chal.solved}</b></span>
        <span class="chal-streak">Best streak: ${chal.maxStreak}</span>
      </div>
      <div class="pr-line">All-time PR: <b>🏆 ${S.best}</b>${chal.newPR ? '' : ` — ${S.best - chal.score} pts away, you got this`}</div>
      <div class="btn-row">
        <button class="btn big green" onclick="startChallenge()">Run it back ▶</button>
        <button class="btn" onclick="chal.done=false;renderChallenge()">Done</button>
      </div>
    </div>`;
    return;
  }
  // running
  el.innerHTML = `<div class="chal-hero">
    <div class="chal-timer${chal.time <= 15 ? ' low' : ''}" id="chalTimer">${fmtTime(chal.time)}</div>
    <div class="chal-stats">
      <span>Score: <b id="chalScore">${chal.score}</b></span>
      <span>Solved: <b>${chal.solved}</b></span>
      <span class="chal-streak">🔥 Streak: ${chal.streak}${chal.streak >= 2 ? ` (+${Math.min(20, 2*chal.streak)} bonus)` : ''}</span>
    </div>
    <div class="fig-box">${chal.prob.fig}</div>
    <div class="prob-q">${chal.prob.q}</div>
    <div class="ans-row">
      <input type="number" step="any" id="chalIn" placeholder="?" autocomplete="off"
        onkeydown="if(event.key==='Enter')chalCheck()">
      <span class="ans-unit">${chal.prob.unit}</span>
      <button class="btn" onclick="chalCheck()">Go ✓</button>
      <button class="btn red" onclick="chalSkip()" title="Skipping resets your streak">Skip</button>
    </div>
    <div class="chal-last">${chal.last}</div>
  </div>`;
  const inp = document.getElementById('chalIn');
  if (inp) inp.focus();
}

function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function startChallenge() {
  chal = { running: true, done: false, time: CHAL_TIME, score: 0, solved: 0, streak: 0, maxStreak: 0, newPR: false,
           prob: makeProblem(unlockedLevel()), timer: null, last: '' };
  chal.timer = setInterval(() => {
    chal.time--;
    const t = document.getElementById('chalTimer');
    if (t) { t.textContent = fmtTime(chal.time); t.classList.toggle('low', chal.time <= 15); }
    if (chal.time <= 0) endChallenge();
  }, 1000);
  renderChallenge();
}

function chalNext() {
  chal.prob = makeProblem(unlockedLevel());
  renderChallenge();
}

function chalCheck() {
  if (!chal.running) return;
  const inp = document.getElementById('chalIn');
  const val = parseFloat(String(inp.value).replace(',', '.'));
  if (!Number.isFinite(val)) { inp.focus(); return; }
  const t = chal.prob.topic;
  if (!S.topics[t]) S.topics[t] = { r: 0, w: 0 };
  if (checkAnswer(chal.prob, val)) {
    const bonus = Math.min(20, 2 * chal.streak);
    const gain = 10 + bonus;
    chal.score += gain;
    chal.solved++;
    chal.streak++;
    chal.maxStreak = Math.max(chal.maxStreak, chal.streak);
    S.topics[t].r++;
    chal.last = `<span style="color:var(--green)">✓ +${gain}${bonus ? ` (streak +${bonus})` : ''}</span>`;
  } else {
    chal.streak = 0;
    S.topics[t].w++;
    chal.last = `<span style="color:var(--red)">✗ Answer was ${chal.prob.ans} ${chal.prob.unit} — streak reset!</span>`;
  }
  chalNext();
}

function chalSkip() {
  if (!chal.running) return;
  chal.streak = 0;
  chal.last = `<span style="color:var(--muted)">Skipped (answer: ${chal.prob.ans} ${chal.prob.unit})</span>`;
  chalNext();
}

function endChallenge() {
  clearInterval(chal.timer);
  chal.running = false;
  chal.done = true;
  S.points += chal.score;
  if (chal.score > S.best) {
    chal.newPR = true;
    const old = S.best;
    S.best = chal.score;
    showPR(chal.score, old);
  }
  markPlayed();
  recordActivity(8); // challenge sprint completed
  save();
  renderChallenge();
}

// ─── PR celebration ───
function showPR(score, old) {
  document.getElementById('prSub').innerHTML = `${score} points!${old ? `<br>Old PR: ${old} — crushed it 💪` : '<br>First PR on the board!'}`;
  const ov = document.getElementById('prOverlay');
  ov.classList.add('show');
  // confetti
  const bits = ['🎉','⭐','🏆','📐','✨','🔥'];
  for (let i = 0; i < 26; i++) {
    const sp = document.createElement('span');
    sp.className = 'confetti';
    sp.textContent = bits[i % bits.length];
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    sp.style.animationDelay = (Math.random() * 0.8) + 's';
    ov.appendChild(sp);
  }
}
function hidePR() {
  const ov = document.getElementById('prOverlay');
  ov.classList.remove('show');
  ov.querySelectorAll('.confetti').forEach(c => c.remove());
}

// ─── Init ───
load();
updateChips();
writeHubSummary();
renderLearn();
</script>
</body>
</html>
