<style>

<body>

<div class="header">
  <h1>Summer Training Dashboard</h1>
  <div class="subtitle">May 25 – Aug 12, 2026 • 5 days/week • Soccer | XC | Speed | Mobility</div>
</div>
<div id="phase-banner" class="phase-banner phase-1"></div>

<div class="nav">
  <button class="active" onclick="showSection('schedule',this)">Schedule</button>
  <button onclick="showSection('tests',this)">Fitness Tests</button>
  <button onclick="showSection('progress',this)">Progress</button>
  <button onclick="showSection('insights',this)">Insights</button>
</div>

<div id="schedule-section" class="section active">
  <div class="week-nav">
    <button onclick="changeWeek(-1)">◀</button>
    <div class="week-label" id="week-label">Week 1</div>
    <button onclick="changeWeek(1)">▶</button>
  </div>
  <div class="travel-toggle">
    <label>Mark this week as travel/off:</label>
    <label class="toggle-switch"><input type="checkbox" id="travel-toggle" onchange="toggleTravel()"><span class="toggle-slider"></span></label>
  </div>
  <div id="day-cards"></div>
</div>

<div id="tests-section" class="section">
  <div style="text-align:center;margin-bottom:16px">
    <div class="test-section-header">Fitness Test Battery</div>
    <div class="test-section-sub">Test every 2 weeks (Weeks 1, 3, 5, 7, 9, 11) • Warm up fully before testing</div>
  </div>
  <div id="test-pr-grid" class="test-pr-grid"></div>
  <div class="test-selector" id="test-selector"></div>
  <div id="test-content"></div>
</div>

<div id="progress-section" class="section">
  <div class="progress-grid" id="stat-cards"></div>
  <div class="chart-container"><h3>Weekly Completion Rate</h3><div class="chart-wrap"><canvas id="completionChart"></canvas></div></div>
  <div class="chart-container"><h3>Category Breakdown</h3><div class="chart-wrap"><canvas id="categoryChart"></canvas></div></div>
  <div class="chart-container"><h3>Difficulty Trend by Category</h3><div class="chart-wrap"><canvas id="difficultyChart"></canvas></div></div>
</div>

<div id="insights-section" class="section"></div>

<script>
const START_DATE=new Date(2026,4,25),TOTAL_WEEKS=11;
let currentWeek=0;
const DIFF={EASY:1,RIGHT:2,HARD:3},DIFF_LABELS={1:'Too Easy',2:'Just Right',3:'Too Hard'},DIFF_CSS={1:'selected-easy',2:'selected-right',3:'selected-hard'},DIFF_IND={1:'ind-easy',2:'ind-right',3:'ind-hard'};
function getPhase(w){return w<4?1:w<8?2:3}
function getPhaseLabel(w){const p=getPhase(w);if(p===1)return{label:'Phase 1: Foundation (Weeks 1–4)',cls:'phase-1'};if(p===2)return{label:'Phase 2: Development (Weeks 5–8)',cls:'phase-2'};return{label:'Phase 3: Preseason (Weeks 9–11)',cls:'phase-3'}}
const CATEGORIES={sprint:{label:'Speed',color:'#dc2626',tagClass:'tag-sprint'},cardio:{label:'Cardio',color:'#2563eb',tagClass:'tag-cardio'},soccer:{label:'Soccer',color:'#059669',tagClass:'tag-soccer'},strength:{label:'Strength',color:'#d97706',tagClass:'tag-strength'},mobility:{label:'Mobility',color:'#7c3aed',tagClass:'tag-mobility'}};

// ===== FITNESS TESTS =====
const TEST_WEEKS=[0,2,4,6,8,10];
const TESTS=[
  {
    id:'sprint_30m',name:'30m Sprint',unit:'seconds',cat:'Speed',color:'#dc2626',
    lowerIsBetter:true,icon:'⚡',
    protocol:`<strong>What it measures:</strong> Acceleration and raw sprint speed.<br><br>
<strong>Setup:</strong> Mark 30 meters on flat ground (use a tape measure or count ~33 large steps). Set a clear start and finish line.<br><br>
<strong>Protocol:</strong><br>
1. Full dynamic warmup first (at least 5 min)<br>
2. 2 practice runs at 80% to prime your legs<br>
3. Start from a standing 3-point stance<br>
4. <strong>3 max-effort trials</strong> with 2 min rest between each<br>
5. Have someone start the timer on your first movement and stop at the finish line<br>
6. <strong>Record your best time</strong><br><br>
<strong>Tips:</strong> Drive your arms hard. Stay low through the first 10m. Don't look at the timer mid-sprint.`
  },
  {
    id:'broad_jump',name:'Broad Jump',unit:'inches',cat:'Power',color:'#d97706',
    lowerIsBetter:false,icon:'💪',
    protocol:`<strong>What it measures:</strong> Explosive lower-body power from plyometric training.<br><br>
<strong>Setup:</strong> Find flat ground. Mark a start line with tape. Have a tape measure ready.<br><br>
<strong>Protocol:</strong><br>
1. Stand with toes behind the line, feet shoulder-width<br>
2. Swing arms back, bend knees, then explode forward<br>
3. Land on both feet — <strong>measure from start line to back of nearest heel</strong><br>
4. <strong>3 attempts</strong> with 60s rest between each<br>
5. <strong>Record your best distance in inches</strong><br><br>
<strong>Tips:</strong> The arm swing is half the jump. Reach forward as you land. If you fall backward, retake it.`
  },
  {
    id:'six_min_run',name:'6-Minute Run',unit:'meters',cat:'Cardio',color:'#2563eb',
    lowerIsBetter:false,icon:'🏃',
    protocol:`<strong>What it measures:</strong> Aerobic endurance — your engine for XC and soccer.<br><br>
<strong>Setup:</strong> Find a flat route you can measure. A field perimeter works great — measure one lap. Or use a GPS app.<br><br>
<strong>Protocol:</strong><br>
1. Light 3 min jog warmup, then a few strides<br>
2. Set a <strong>6-minute countdown timer</strong><br>
3. Run as far as you can in exactly 6 minutes — <strong>pacing matters</strong><br>
4. When the timer goes off, stop and mark your spot<br>
5. <strong>Record total distance in meters</strong> (1 lap of a soccer field ≈ 350m)<br><br>
<strong>Tips:</strong> Start at a pace you can hold for 6 min. Most people go out too fast. Even splits = good pacing.`
  },
  {
    id:'juggling',name:'Juggling Record',unit:'touches',cat:'Soccer',color:'#059669',
    lowerIsBetter:false,icon:'⚽',
    protocol:`<strong>What it measures:</strong> Ball control, touch quality, and focus under pressure.<br><br>
<strong>Setup:</strong> Flat surface, properly inflated ball. No wind if possible.<br><br>
<strong>Protocol:</strong><br>
1. Light ball mastery warmup (2 min toe taps, sole rolls)<br>
2. <strong>5 attempts</strong> to set your max consecutive touches<br>
3. Any surface counts: feet, thighs, head, shoulders, chest<br>
4. The ball cannot touch the ground between touches<br>
5. <strong>Record your highest number</strong><br><br>
<strong>Tips:</strong> Keep ball below head height. Relax your ankle on contact. Use thigh to reset when it drifts. Count out loud.`
  },
  {
    id:'squat_hold',name:'Deep Squat Hold',unit:'seconds',cat:'Mobility',color:'#7c3aed',
    lowerIsBetter:false,icon:'🧘',
    protocol:`<strong>What it measures:</strong> Functional mobility across ankles, hips, and thoracic spine — the three areas that matter most for soccer and running performance.<br><br>
<strong>Setup:</strong> Flat, firm surface. No shoes (barefoot or socks) for the most honest test. Have a phone timer ready.<br><br>
<strong>Protocol:</strong><br>
1. Warm up first — 5 min of easy movement, leg swings, bodyweight squats<br>
2. Drop into a full deep squat with these standards:<br>
&nbsp;&nbsp;• <strong>Heels flat on the ground</strong> (no lifting onto toes)<br>
&nbsp;&nbsp;• <strong>Hips below knees</strong> (full depth)<br>
&nbsp;&nbsp;• <strong>Chest up, back relatively straight</strong> (not collapsed forward)<br>
&nbsp;&nbsp;• <strong>Feet roughly shoulder-width</strong>, toes can angle out up to 30°<br>
&nbsp;&nbsp;• <strong>Arms in front for balance</strong> (not holding onto anything)<br>
3. Start the timer when you're in position<br>
4. Hold as long as you can <strong>maintain ALL of the standards above</strong><br>
5. Stop the timer when any standard breaks — heels lift, chest collapses, or you have to grab something<br>
6. <strong>3 attempts</strong> with 60s rest. <strong>Record your best time.</strong><br><br>
<strong>Tips:</strong> Push your knees out over your toes — don't let them cave in. Breathe slowly and deeply. If you can't hold it at all with heels down, that's your starting point — the mobility work in the program is designed to fix exactly this. Most 13-year-olds start around 30–60 seconds. Elite movers can hold 3+ minutes.`
  },
  {
    id:'shuttle_5_10_5',name:'5-10-5 Shuttle',unit:'seconds',cat:'Agility',color:'#f59e0b',
    lowerIsBetter:true,icon:'🔄',
    protocol:`<strong>What it measures:</strong> Change-of-direction speed and lateral agility — critical for soccer.<br><br>
<strong>Setup:</strong> Place 3 cones in a line, 5 yards apart (so 5 yds – center – 5 yds). Start at center cone.<br><br>
<strong>Protocol:</strong><br>
1. Full dynamic warmup + 2 practice runs at 80%<br>
2. Start in a 3-point stance at the center cone<br>
3. Sprint 5 yards RIGHT, touch the line<br>
4. Sprint 10 yards LEFT (past center to far cone), touch the line<br>
5. Sprint 5 yards RIGHT back through center — timer stops<br>
6. <strong>3 attempts</strong> with 2 min rest. Record best time.<br><br>
<strong>Tips:</strong> Stay low through turns — lower = faster direction change. Plant hard on outside foot. Don't round the turns.`
  }
];

let activeTestId=TESTS[0].id;

// ===== STATE =====
function getState(){try{return JSON.parse(localStorage.getItem('trainingV5')||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem('trainingV5',JSON.stringify(s))}
function getWS(w,bid){return getState()[`w${w}_${bid}`]||{done:false,notes:'',diff:0}}
function setWS(w,bid,d){const s=getState();s[`w${w}_${bid}`]=d;saveState(s)}
function isTravel(w){return getState()[`w${w}_travel`]||false}
function setTravelState(w,v){const s=getState();s[`w${w}_travel`]=v;saveState(s)}
function getTestResults(tid){const s=getState();return s[`test_${tid}`]||[]}
function saveTestResult(tid,wk,val){const s=getState(),k=`test_${tid}`;let r=s[k]||[];r=r.filter(x=>x.week!==wk);r.push({week:wk,value:parseFloat(val),date:new Date(START_DATE.getTime()+wk*7*24*60*60*1000).toISOString()});r.sort((a,b)=>a.week-b.week);s[k]=r;saveState(s)}
function deleteTestResult(tid,wk){const s=getState(),k=`test_${tid}`;s[k]=(s[k]||[]).filter(x=>x.week!==wk);saveState(s)}
function getWeekDates(w){const d=[];for(let i=0;i<7;i++){const dt=new Date(START_DATE);dt.setDate(dt.getDate()+w*7+i);d.push(dt)}return d}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}

// ===== SCHEDULE =====
function renderSchedule(){
  const dates=getWeekDates(currentWeek),phase=getPhase(currentWeek),pi=getPhaseLabel(currentWeek);
  document.getElementById('week-label').textContent=`Week ${currentWeek+1} — ${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;
  document.getElementById('travel-toggle').checked=isTravel(currentWeek);
  const b=document.getElementById('phase-banner');b.className=`phase-banner ${pi.cls}`;b.textContent=pi.label;
  const prg=getPrograms(phase),dk=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'],dl=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],dt=['Speed + Soccer + Mobility','Strength + Easy Run + Stretch','Soccer Technical + Yoga (Light)','Strength + Intervals + Mobility','Plyos + Shooting + Full Mobility','Rest & Recovery','Rest & Recovery'];
  const c=document.getElementById('day-cards');c.innerHTML='';const tv=isTravel(currentWeek);
  const isTestWeek=TEST_WEEKS.includes(currentWeek);
  dk.forEach((key,di)=>{
    const day=prg[key],card=document.createElement('div'),isR=day.rest;
    card.className=`day-card${isR?' rest':''}${tv?' travel':''}`;
    let h=`<h3>${dl[di]} <span class="date-label">${fmtDate(dates[di])}</span></h3>`;
    if(tv){h+=`<p style="font-size:13px;color:#888;font-style:italic">Travel week — rest or do what you can!</p>`}
    else if(isR){
      h+=`<p style="font-size:13px;color:#888;font-style:italic">Rest & recovery — go outside, stretch, have fun.</p>`;
      if(di===5&&isTestWeek)h+=`<div style="margin-top:8px;padding:8px 12px;background:#eff6ff;border-radius:6px;border-left:3px solid #1e40af;font-size:12px"><strong>📋 Test Week!</strong> Run your fitness tests this week. Go to the Fitness Tests tab to log results.</div>`;
    } else {
      h+=`<div class="day-theme">${dt[di]}</div>`;
      if(di===0&&isTestWeek)h+=`<div style="margin-bottom:10px;padding:8px 12px;background:#eff6ff;border-radius:6px;border-left:3px solid #1e40af;font-size:12px"><strong>📋 Test Week ${TEST_WEEKS.indexOf(currentWeek)+1} of 6</strong> — Run your fitness tests this week. Go to the <strong>Fitness Tests</strong> tab to log results.</div>`;
      h+=`<div class="warmup-block"><h4>WARMUP</h4><p>${day.warmup}</p></div>`;
      day.blocks.forEach(bl=>{
        const ws=getWS(currentWeek,bl.id),cat=CATEGORIES[bl.cat],io=expandedBlocks[`${currentWeek}_${bl.id}`],dv=ws.diff||0;
        h+=`<div class="workout-block"><div class="workout-header" onclick="toggleExpand(${currentWeek},'${bl.id}',this)"><input type="checkbox" ${ws.done?'checked':''} onclick="event.stopPropagation();toggleDone(${currentWeek},'${bl.id}',this.checked)"><span class="workout-title ${ws.done?'done':''}"><span class="category-tag ${cat.tagClass}">${cat.label}</span>${bl.title}`;
        if(dv)h+=` <span class="diff-indicator ${DIFF_IND[dv]}"></span>`;
        h+=`</span><span class="expand-icon ${io?'open':''}">▶</span></div>`;
        h+=`<div class="workout-detail ${io?'open':''}"><ul class="exercise-list">`;
        bl.exercises.forEach(ex=>{h+=`<li><span class="ex-name">${ex.name}</span><span class="ex-prescription">${ex.rx}${ex.note?`<span class="ex-note">${ex.note}</span>`:''}</span></li>`});
        h+=`</ul></div><div class="workout-footer"><div class="difficulty-row"><span class="difficulty-label">How was it?</span>`;
        [1,2,3].forEach(d=>{h+=`<button class="diff-btn ${dv===d?DIFF_CSS[d]:''}" onclick="setDiff(${currentWeek},'${bl.id}',${d})">${DIFF_LABELS[d]}</button>`});
        h+=`</div><textarea class="notes-input" rows="1" placeholder="Notes..." onchange="saveNotes(${currentWeek},'${bl.id}',this.value)" onfocus="this.rows=2" onblur="if(!this.value)this.rows=1">${ws.notes||''}</textarea></div></div>`;
      });
      const tot=day.blocks.length;let dn=0;day.blocks.forEach(bl=>{if(getWS(currentWeek,bl.id).done)dn++});
      h+=`<div style="font-size:11px;color:#888;margin-top:8px">${dn}/${tot} blocks complete</div>`;
    }
    card.innerHTML=h;c.appendChild(card);
  });
}
function toggleExpand(w,bid,el){const k=`${w}_${bid}`;expandedBlocks[k]=!expandedBlocks[k];el.nextElementSibling.classList.toggle('open');el.querySelector('.expand-icon').classList.toggle('open')}
function toggleDone(w,bid,ch){const ws=getWS(w,bid);ws.done=ch;setWS(w,bid,ws);renderSchedule()}
function saveNotes(w,bid,n){const ws=getWS(w,bid);ws.notes=n;setWS(w,bid,ws)}
function setDiff(w,bid,d){const ws=getWS(w,bid);ws.diff=ws.diff===d?0:d;setWS(w,bid,ws);renderSchedule()}
function toggleTravel(){setTravelState(currentWeek,document.getElementById('travel-toggle').checked);renderSchedule()}
function changeWeek(dir){currentWeek=Math.max(0,Math.min(TOTAL_WEEKS-1,currentWeek+dir));renderSchedule()}

// ===== FITNESS TESTS =====
function renderTests(){
  const prGrid=document.getElementById('test-pr-grid');
  let prHtml='';
  TESTS.forEach(t=>{
    const results=getTestResults(t.id);
    if(results.length===0){prHtml+=`<div class="pr-card"><div class="pr-value" style="color:#ccc">—</div><div class="pr-label">${t.name}</div><div class="pr-change" style="color:#888">No data yet</div></div>`;return}
    const best=t.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));
    let changeHtml='';
    if(results.length>=2){const first=results[0].value,last=results[results.length-1].value;const pct=((last-first)/first*100).toFixed(1);const imp=t.lowerIsBetter?(last<first):(last>first);changeHtml=`<div class="pr-change" style="color:${imp?'#059669':'#dc2626'}">${imp?'▲':'▼'} ${Math.abs(pct)}% ${imp?'improvement':'regression'}</div>`}
    const unitSuffix=t.unit==='seconds'?'s':t.unit==='inches'?'"':'';
    prHtml+=`<div class="pr-card"><div class="pr-value" style="color:${t.color}">${best}${unitSuffix}</div><div class="pr-label">${t.icon} ${t.name} PR</div>${changeHtml}</div>`;
  });
  prGrid.innerHTML=prHtml;
  const sel=document.getElementById('test-selector');
  sel.innerHTML=TESTS.map(t=>`<button class="${t.id===activeTestId?'active-test':''}" onclick="selectTest('${t.id}')">${t.icon} ${t.name}</button>`).join('');
  const test=TESTS.find(t=>t.id===activeTestId);const results=getTestResults(test.id);
  const cont=document.getElementById('test-content');
  let html=`<div class="test-card" style="border-top-color:${test.color}"><h3>${test.icon} ${test.name}</h3><div class="test-cat" style="color:${test.color}">Category: ${test.cat} • ${test.lowerIsBetter?'Lower is better':'Higher is better'} • Unit: ${test.unit}</div><div class="test-protocol">${test.protocol}</div>`;
  html+=`<div class="test-input-row"><div class="test-input-group"><label>Test Week</label><select id="test-week-select">`;
  TEST_WEEKS.forEach(w=>{const dates=getWeekDates(w);const has=results.some(r=>r.week===w);html+=`<option value="${w}">Week ${w+1} (${fmtDate(dates[0])})${has?' ✓':''}</option>`});
  html+=`</select></div><div class="test-input-group"><label>Result (${test.unit})</label><input type="number" step="any" id="test-value-input" placeholder="Enter result"></div><button class="save-test-btn" onclick="saveTest('${test.id}')">Save Result</button><span class="save-msg" id="save-msg">Saved!</span></div></div>`;
  if(results.length>0){
    const prVal=test.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));
    html+=`<div class="chart-container"><h3>Results History</h3><table class="results-table"><thead><tr><th>Week</th><th>Date</th><th>Result</th><th>Change</th><th></th></tr></thead><tbody>`;
    results.forEach((r,i)=>{
      const dates=getWeekDates(r.week);const isPR=r.value===prVal;let ch='';
      if(i>0){const prev=results[i-1].value;const diff=r.value-prev;const pct=((diff/prev)*100).toFixed(1);const imp=test.lowerIsBetter?(diff<0):(diff>0);ch=`<span class="improve-badge ${imp?'improve-up':diff===0?'improve-same':'improve-down'}">${imp?'▲':'▼'} ${Math.abs(pct)}%</span>`}else{ch='<span style="color:#888;font-size:11px">Baseline</span>'}
      html+=`<tr><td>Week ${r.week+1}</td><td>${fmtDate(dates[0])}</td><td><strong>${r.value}</strong> ${test.unit}${isPR?' <span class="pr-badge">PR!</span>':''}</td><td>${ch}</td><td><button class="delete-btn" onclick="deleteTest('${test.id}',${r.week})" title="Delete">✕</button></td></tr>`;
    });
    html+=`</tbody></table></div>`;
    html+=`<div class="chart-container"><h3>Progress Over Time</h3><div class="chart-wrap-test"><canvas id="testProgressChart"></canvas></div></div>`;
  }else{html+=`<div class="no-data-msg">No results yet for ${test.name}. Run your first test and log it above!</div>`}
  cont.innerHTML=html;
  if(results.length>0){
    const prVal=test.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));
    new Chart(document.getElementById('testProgressChart').getContext('2d'),{type:'line',data:{labels:results.map(r=>'Wk '+(r.week+1)),datasets:[{label:test.name,data:results.map(r=>r.value),borderColor:test.color,backgroundColor:test.color+'22',fill:true,tension:.3,pointRadius:6,pointBackgroundColor:results.map(r=>r.value===prVal?'#d97706':test.color),pointBorderWidth:results.map(r=>r.value===prVal?3:1)}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{title:{display:true,text:test.unit},reverse:test.lowerIsBetter}},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y} ${test.unit}`}}}}});
  }
}
function selectTest(id){activeTestId=id;renderTests()}
function saveTest(tid){const wk=parseInt(document.getElementById('test-week-select').value);const val=document.getElementById('test-value-input').value;if(!val||isNaN(parseFloat(val)))return;saveTestResult(tid,wk,val);document.getElementById('test-value-input').value='';const msg=document.getElementById('save-msg');msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);renderTests()}
function deleteTest(tid,wk){deleteTestResult(tid,wk);renderTests()}

let completionChart=null,categoryChart=null,difficultyChart=null;
function getAllBlocks(phase){const p=getPrograms(phase),b=[];['monday','tuesday','wednesday','thursday','friday'].forEach((d,i)=>{if(p[d].blocks)p[d].blocks.forEach(bl=>b.push({...bl,dayIdx:i}))});return b}
function getCatDiffHistory(cat){const h=[];for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w)){h.push(null);continue}const bl=getAllBlocks(getPhase(w)).filter(b=>b.cat===cat);let s=0,c=0;bl.forEach(b=>{const ws=getWS(w,b.id);if(ws.diff>0){s+=ws.diff;c++}});h.push(c>0?s/c:null)}return h}
function getRecentTrend(cat){const h=getCatDiffHistory(cat).filter(v=>v!==null);if(h.length<2)return{trend:'unknown',avg:h.length?h[h.length-1]:0,values:h};const r=h.slice(-3),f=r[0],l=r[r.length-1],a=r.reduce((s,v)=>s+v,0)/r.length;let t='flat';if(l-f>=.4)t='getting_harder';else if(f-l>=.4)t='getting_easier';return{trend:t,avg:a,values:r,first:f,last:l}}
function renderProgress(){
  let tB=0,cB=0;const cs={};Object.keys(CATEGORIES).forEach(c=>{cs[c]={total:0,done:0}});const wr=[];
  for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w)){wr.push(null);continue}const bl=getAllBlocks(getPhase(w));let wT=0,wD=0;bl.forEach(b=>{tB++;wT++;cs[b.cat].total++;if(getWS(w,b.id).done){cB++;wD++;cs[b.cat].done++}});wr.push(wT>0?Math.round(wD/wT*100):0)}
  const pct=tB>0?Math.round(cB/tB*100):0;let streak=0;for(let w=getCurrentWeekIdx();w>=0;w--){if(isTravel(w))continue;const bl=getAllBlocks(getPhase(w));if(bl.every(b=>getWS(w,b.id).done)&&bl.length>0)streak++;else if(w<getCurrentWeekIdx())break}
  let tR=0;for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{if(getWS(w,b.id).diff>0)tR++})}
  document.getElementById('stat-cards').innerHTML=`<div class="stat-card"><div class="stat-value" style="color:#2d6a4f">${pct}%</div><div class="stat-label">Completion</div></div><div class="stat-card"><div class="stat-value" style="color:#2563eb">${cB}</div><div class="stat-label">Blocks Done</div></div><div class="stat-card"><div class="stat-value" style="color:#d97706">${tR}</div><div class="stat-label">Ratings</div></div><div class="stat-card"><div class="stat-value" style="color:#7c3aed">${streak}</div><div class="stat-label">Week Streak</div></div>`;
  const x1=document.getElementById('completionChart').getContext('2d');if(completionChart)completionChart.destroy();
  completionChart=new Chart(x1,{type:'bar',data:{labels:wr.map((_,i)=>`Wk ${i+1}`),datasets:[{data:wr.map(v=>v===null?0:v),backgroundColor:wr.map((v,i)=>v===null?'#ffc107':i>getCurrentWeekIdx()?'#e5e7eb':v>=80?'#2d6a4f':v>=50?'#a7c4b5':'#f87171'),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}}});
  const x2=document.getElementById('categoryChart').getContext('2d');if(categoryChart)categoryChart.destroy();const ck=Object.keys(CATEGORIES);
  categoryChart=new Chart(x2,{type:'radar',data:{labels:ck.map(k=>CATEGORIES[k].label),datasets:[{data:ck.map(k=>cs[k].total>0?Math.round(cs[k].done/cs[k].total*100):0),backgroundColor:'rgba(45,106,79,0.2)',borderColor:'#2d6a4f',pointBackgroundColor:ck.map(k=>CATEGORIES[k].color),pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{display:false}}},plugins:{legend:{display:false}}}});
  const x3=document.getElementById('difficultyChart').getContext('2d');if(difficultyChart)difficultyChart.destroy();
  difficultyChart=new Chart(x3,{type:'line',data:{labels:Array.from({length:TOTAL_WEEKS},(_,i)=>`Wk ${i+1}`),datasets:ck.map(k=>({label:CATEGORIES[k].label,data:getCatDiffHistory(k).map(v=>v===null?null:Math.round(v*100)/100),borderColor:CATEGORIES[k].color,backgroundColor:CATEGORIES[k].color+'33',tension:.3,spanGaps:true,pointRadius:4}))},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:.5,max:3.5,ticks:{callback:v=>{if(v===1)return'Too Easy';if(v===2)return'Just Right';if(v===3)return'Too Hard';return''}}}},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});
}

// ===== INSIGHTS =====
function renderInsights(){
  const c=document.getElementById('insights-section');const cs={};Object.keys(CATEGORIES).forEach(k=>{cs[k]={total:0,done:0,notes:[],diffs:[]}});
  const wc=Math.min(getCurrentWeekIdx()+1,TOTAL_WEEKS);
  for(let w=0;w<wc;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{cs[b.cat].total++;const ws=getWS(w,b.id);if(ws.done)cs[b.cat].done++;if(ws.notes)cs[b.cat].notes.push(ws.notes);if(ws.diff>0)cs[b.cat].diffs.push(ws.diff)})}
  let html='<h3 style="font-size:16px;font-weight:600;margin-bottom:12px">Training Insights</h3>';
  const cr=Object.keys(CATEGORIES).map(k=>({key:k,label:CATEGORIES[k].label,rate:cs[k].total>0?cs[k].done/cs[k].total:0,total:cs[k].total,done:cs[k].done,diffs:cs[k].diffs})).filter(x=>x.total>0).sort((a,b)=>b.rate-a.rate);
  const td=cr.reduce((s,x)=>s+x.diffs.length,0);
  const testInsights=getTestInsights();if(testInsights)html+=testInsights;
  if(cr.length===0){html+=`<div class="insight-card"><h4>No data yet</h4><p>Start checking off workouts and rating difficulty.</p></div>`;c.innerHTML=html;return}
  if(td>=2){
    html+='<h3 style="font-size:15px;font-weight:600;margin:16px 0 10px">Adaptive Recommendations</h3>';
    Object.keys(CATEGORIES).forEach(cat=>{const t=getRecentTrend(cat),st=cs[cat];if(st.diffs.length<2)return;const rd=st.diffs.slice(-4),ra=rd.reduce((s,v)=>s+v,0)/rd.length,ec=rd.filter(d=>d===1).length,rc=rd.filter(d=>d===2).length,hc=rd.filter(d=>d===3).length;
    let rt='',rT='',rB='',ti='',tc='';
    if(ra<=1.4||(ec>=3&&hc===0)){rt='progress-up';ti='↑';tc='trend-down';rT=`${CATEGORIES[cat].label}: Ready to Progress`;rB=getProgressionRec(cat)}
    else if(ra>=2.7||(hc>=3&&ec===0)){rt='caution';ti='↓';tc='trend-up';rT=`${CATEGORIES[cat].label}: Consider Scaling Back`;rB=getDeloadRec(cat)}
    else if(t.trend==='getting_harder'&&ra>=2.3){rt='warning';ti='⚠';tc='trend-up';rT=`${CATEGORIES[cat].label}: Difficulty Climbing`;rB=getClimbingRec(cat)}
    else if(t.trend==='getting_easier'){rt='progress-up';ti='✓';tc='trend-down';rT=`${CATEGORIES[cat].label}: Adapting Well`;rB=getAdaptingRec(cat)}
    else if(rc>=2){rt='';ti='→';tc='trend-flat';rT=`${CATEGORIES[cat].label}: On Track`;rB='Difficulty feels right. Stay the course.'}
    else if(ec>=1&&hc>=1){rt='warning';ti='~';tc='trend-flat';rT=`${CATEGORIES[cat].label}: Mixed Signals`;rB=getMixedRec(cat)}
    if(rT){let sk='';const comp=st.total>0?st.done/st.total:0;if(comp<.5&&hc>=2)sk=' <em>Also skipping often — difficulty may be discouraging. Try scaled-back version.</em>';html+=`<div class="insight-card ${rt}"><h4><span class="trend-arrow ${tc}">${ti}</span> ${rT}</h4><p>${rB}${sk}</p></div>`}});
  }else if(td>0){html+=`<div class="insight-card"><h4>Keep Rating!</h4><p>${td} rating${td>1?'s':''} logged. Need more for adaptive recommendations.</p></div>`}
  else{html+=`<div class="insight-card warning"><h4>Rate Your Workouts</h4><p>Use "Too Easy / Just Right / Too Hard" to power adaptive recommendations.</p></div>`}
  html+='<h3 style="font-size:15px;font-weight:600;margin:20px 0 10px">Completion Insights</h3>';
  const best=cr[0],worst=cr[cr.length-1];
  if(best.rate>0)html+=`<div class="insight-card strength-insight"><h4>Strongest: ${best.label}</h4><p>${Math.round(best.rate*100)}% (${best.done}/${best.total})</p></div>`;
  if(worst.rate<best.rate){const adv={sprint:"Move speed work earlier or pair with soccer.",cardio:"Even 15 min counts.",soccer:"10 min of wall passes adds up.",strength:"Just show up.",mobility:"Tack 5 min onto other sessions."};html+=`<div class="insight-card warning"><h4>Needs Attention: ${worst.label}</h4><p>${Math.round(worst.rate*100)}% (${worst.done}/${worst.total}). ${adv[worst.key]||''}</p></div>`}
  const ov=cr.reduce((s,x)=>s+x.done,0)/Math.max(cr.reduce((s,x)=>s+x.total,0),1);
  if(ov>=.8)html+=`<div class="insight-card"><h4>Excellent Consistency</h4><p>Over 80%. Check adaptive recs to level up.</p></div>`;
  else if(ov>=.5)html+=`<div class="insight-card"><h4>Solid — Room to Grow</h4><p>${Math.round(ov*100)}%. Make easy sessions non-negotiable.</p></div>`;
  else if(ov>0)html+=`<div class="insight-card warning"><h4>Building Momentum</h4><p>Under 50%. Focus on 3 must-do blocks per day.</p></div>`;
  let tw=0;for(let w=0;w<TOTAL_WEEKS;w++)if(isTravel(w))tw++;
  if(tw>0)html+=`<div class="insight-card"><h4>Travel: ${tw}/${TOTAL_WEEKS} weeks</h4><p>15 min bodyweight + mobility keeps the habit.</p></div>`;
  const wn=getCurrentWeekIdx()+1;
  if(wn>=4&&wn<8)html+=`<div class="insight-card strength-insight"><h4>Phase 2 Check-In</h4><p>Should feel harder — that's by design. Use ratings to check if it's productive-hard or too-much-hard.</p></div>`;
  if(wn>=8)html+=`<div class="insight-card strength-insight"><h4>Preseason Mode</h4><p>${TOTAL_WEEKS-wn+1} weeks left. Sharpen, don't add.</p></div>`;
  c.innerHTML=html;
}

function getTestInsights(){
  let html='';let hasAny=false;
  TESTS.forEach(t=>{
    const r=getTestResults(t.id);if(r.length<2)return;hasAny=true;
    const first=r[0].value,last=r[r.length-1].value;
    const pct=((last-first)/first*100).toFixed(1);
    const improved=t.lowerIsBetter?(last<first):(last>first);
    const stagnant=Math.abs(pct)<1;
    if(improved&&Math.abs(pct)>=5){html+=`<div class="insight-card progress-up"><h4>${t.icon} ${t.name}: ${Math.abs(pct)}% Improvement!</h4><p>From ${first} to ${last} ${t.unit}. ${getTestProgressTip(t.id)}</p></div>`}
    else if(!improved&&Math.abs(pct)>=3){html+=`<div class="insight-card caution"><h4>${t.icon} ${t.name}: Trending Wrong Direction</h4><p>${Math.abs(pct)}% regression (${first} → ${last} ${t.unit}). ${getTestRegressTip(t.id)}</p></div>`}
    else if(stagnant&&r.length>=3){html+=`<div class="insight-card warning"><h4>${t.icon} ${t.name}: Plateau Detected</h4><p>Stuck around ${last} ${t.unit} for ${r.length} tests. ${getTestPlateauTip(t.id)}</p></div>`}
  });
  if(hasAny)html='<h3 style="font-size:15px;font-weight:600;margin:0 0 10px">Fitness Test Insights</h3>'+html;
  return html||'';
}

function getTestProgressTip(id){return{
  sprint_30m:'Keep building acceleration mechanics. Once you plateau, try resisted sprints (uphill or sled).',
  broad_jump:'Explosive power developing. Your plyometric work is translating directly.',
  six_min_run:'Aerobic base is growing. This will show up big in XC season.',
  juggling:'Ball comfort improving. Challenge yourself with weak-foot-only sessions.',
  squat_hold:'Ankle, hip, and thoracic mobility all improving together. This means fewer injuries and better movement quality in everything else.',
  shuttle_5_10_5:'Change-of-direction speed improving. Great for soccer positioning and defensive recovery.'}[id]||''}

function getTestRegressTip(id){return{
  sprint_30m:'Could be fatigue accumulation. Make sure speed days follow rest days. Consider a lighter week.',
  broad_jump:'Leg power dipping — might be overtraining with too much running + lifting. Check recovery.',
  six_min_run:'Aerobic capacity dropping. Skipping easy runs? Those build the base. Also check sleep and hydration.',
  juggling:'Touch getting worse under fatigue? Make sure technical work happens on fresh legs.',
  squat_hold:'Losing squat depth usually means other training is tightening you up — ankles and hips especially. Are you skipping mobility work? Also check if you\'re foam rolling after hard sessions. This is an early warning sign for potential injury.',
  shuttle_5_10_5:'Agility dropping — could be fatigue or tightness. Check mobility work and recovery.'}[id]||''}

function getTestPlateauTip(id){return{
  sprint_30m:'Sprint plateau — try contrast training (heavy strength then sprint) or work on arm mechanics.',
  broad_jump:'Broad jump plateau — add more reactive plyos (depth jumps, bounds) rather than just strength.',
  six_min_run:'Aerobic plateau — try a true tempo run (20 min comfortably hard) once a week.',
  juggling:'Juggling plateau? Add constraints: weak foot only, thigh-to-foot alternating, or head-included sequences.',
  squat_hold:'Deep squat plateau — your body has adapted to current mobility work. Try these: (1) Add a light weight held in front of you as a counterbalance — many people can squat deeper with 5–10 lbs held at chest height. (2) Spend 30 seconds shifting weight side to side in the squat to open different angles. (3) Add banded ankle dorsiflexion work — ankle stiffness is usually the limiting factor.',
  shuttle_5_10_5:'Agility plateau — work on deceleration: approach a cone at full speed and stop in 2 steps.'}[id]||''}

function getProgressionRec(cat){const r={sprint:'<span class="rec-tag rec-progress">PROGRESS</span> Add 1–2 sprint reps, extend to a longer distance, or reduce rest by 15s.',cardio:'<span class="rec-tag rec-progress">PROGRESS</span> Add 5 min to easy runs, add 1 interval rep, or reduce rest by 15s.',soccer:'<span class="rec-tag rec-progress">PROGRESS</span> Speed up drills with a timer, add a defender, or use weak foot for 50% of reps.',strength:'<span class="rec-tag rec-progress">PROGRESS</span> Add weight, reps, or an extra set.',mobility:'<span class="rec-tag rec-progress">PROGRESS</span> Hold 15s longer, try deeper variations, or add banded stretches.'};return r[cat]||'Ready for more.'}
function getDeloadRec(cat){const r={sprint:'<span class="rec-tag rec-deload">SCALE BACK</span> Drop 2 reps per distance, add 30s rest, run at 85% instead of max.',cardio:'<span class="rec-tag rec-deload">SCALE BACK</span> Shorten runs by 5 min, drop 1–2 interval reps, add 30s rest.',soccer:'<span class="rec-tag rec-deload">SCALE BACK</span> Cut drills by 30%, focus on 2–3 per session, more juggling for fun.',strength:'<span class="rec-tag rec-deload">SCALE BACK</span> Deload: reduce weight 20% or drop a set.',mobility:'<span class="rec-tag rec-deload">SCALE BACK</span> Shorter holds, stay at 6/10 intensity, basics only.'};return r[cat]||'Reduce 20–30%.'}
function getClimbingRec(cat){return`<span class="rec-tag rec-adjust">WATCH</span> ${CATEGORIES[cat].label} difficulty rising. Monitor one more week.`}
function getAdaptingRec(cat){return`<span class="rec-tag rec-maintain">ADAPTING</span> ${CATEGORIES[cat].label} getting easier = adapting. Stay the course until consistently "Too Easy."`}
function getMixedRec(cat){return`<span class="rec-tag rec-adjust">MIXED</span> Some ${CATEGORIES[cat].label.toLowerCase()} sessions easy, some hard. Check sleep, prior day, time of day.`}

// ===== NAV =====
function showSection(section,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(`${section}-section`).classList.add('active');
  btn.classList.add('active');
  if(section==='progress')renderProgress();
  if(section==='insights')renderInsights();
  if(section==='tests')renderTests();
}
currentWeek=getCurrentWeekIdx();renderSchedule();
</script>
