<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Lab Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Patrick+Hand&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0a1020;--card:#111a30;--border:rgba(6,182,212,0.2);--text:#e2efff;--muted:#8ba4c8;
    --cyan:#06b6d4;--green:#10b981;--blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899;--gold:#f59e0b;--red:#ef4444;--lime:#84cc16;}
  body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .container{max-width:860px;margin:0 auto;padding:16px;}

  .header{text-align:center;padding:20px 0 12px;}
  .header h1{font-size:2em;background:linear-gradient(135deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header p{color:var(--muted);font-size:1em;margin-top:4px;}

  /* Stats */
  .stats-bar{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap;}
  .stat{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);border-radius:16px;padding:6px 16px;font-size:0.88em;display:flex;align-items:center;gap:5px;}
  .stat .sv{color:var(--cyan);font-weight:700;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:14px;animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* Experiment select */
  .exp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0;}
  @media(max-width:600px){.exp-grid{grid-template-columns:1fr;}}
  .exp-card{background:rgba(6,182,212,0.06);border:2px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:all .3s;position:relative;}
  .exp-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 6px 20px rgba(6,182,212,0.15);}
  .exp-card.done{opacity:0.65;}
  .exp-card .ec-icon{font-size:2.5em;margin-bottom:8px;}
  .exp-card .ec-title{font-weight:700;font-size:1.05em;margin-bottom:3px;}
  .exp-card .ec-desc{color:var(--muted);font-size:0.85em;line-height:1.4;}
  .exp-card .ec-badge{position:absolute;top:10px;right:10px;font-size:0.72em;padding:3px 10px;border-radius:10px;font-weight:700;background:rgba(16,185,129,0.15);color:var(--green);}
  .exp-card .ec-topic{font-size:0.75em;color:var(--cyan);margin-top:6px;}

  /* Experiment view */
  .exp-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .exp-header .eh-icon{font-size:2.5em;}
  .exp-header h2{font-size:1.4em;}
  .exp-header .eh-topic{color:var(--cyan);font-size:0.85em;}

  .step-tracker{display:flex;gap:4px;margin:12px 0;justify-content:center;}
  .st-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid var(--border);transition:all .3s;}
  .st-dot.done{background:var(--green);border-color:var(--green);}
  .st-dot.active{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(6,182,212,0.5);}

  .experiment-step{margin:16px 0;}
  .es-label{font-size:0.75em;text-transform:uppercase;color:var(--cyan);letter-spacing:0.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .es-content{background:rgba(6,182,212,0.05);border:1px solid var(--border);border-radius:14px;padding:18px;line-height:1.65;}
  .es-content p{margin-bottom:10px;font-size:0.95em;}

  /* Lab bench visual */
  .lab-bench{background:linear-gradient(180deg,rgba(6,182,212,0.05),rgba(16,185,129,0.05));border:2px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin:14px 0;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .lab-bench .bench-emoji{font-size:4em;margin-bottom:8px;transition:all .5s;}
  .lab-bench .bench-label{color:var(--muted);font-size:0.9em;}

  /* Animations */
  .lab-bench.reacting .bench-emoji{animation:bounce 0.6s ease infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}
  .lab-bench.exploding .bench-emoji{animation:spin 0.5s ease;}
  @keyframes spin{0%{transform:rotate(0) scale(1);}50%{transform:rotate(180deg) scale(1.3);}100%{transform:rotate(360deg) scale(1);}}
  .lab-bench.growing .bench-emoji{animation:grow 1s ease forwards;}
  @keyframes grow{0%{transform:scale(0.5);}100%{transform:scale(1.5);}}
  .lab-bench.cooling .bench-emoji{animation:shiver 0.3s ease infinite;}
  @keyframes shiver{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}

  .bubbles{position:absolute;bottom:0;left:0;right:0;height:60px;pointer-events:none;overflow:hidden;}
  .bubble{position:absolute;bottom:-10px;width:12px;height:12px;border-radius:50%;background:rgba(6,182,212,0.3);animation:rise var(--dur) ease-in infinite;}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-80px) scale(0.5);opacity:0;}}

  /* Choice buttons */
  .choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0;}
  .choice-btn{background:rgba(6,182,212,0.08);border:2px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:0.95em;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:10px;}
  .choice-btn:hover{border-color:var(--cyan);background:rgba(6,182,212,0.15);transform:scale(1.02);}
  .choice-btn.correct{border-color:var(--green);background:rgba(16,185,129,0.15);}
  .choice-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);}
  .choice-btn .cb-icon{font-size:1.3em;}

  .prediction-input{width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:0.95em;resize:vertical;min-height:60px;outline:none;}
  .prediction-input:focus{border-color:var(--cyan);}

  .action-btn{background:linear-gradient(135deg,var(--cyan),var(--green));border:none;border-radius:12px;padding:11px 24px;color:#000;font-family:'Quicksand',sans-serif;font-size:1em;font-weight:700;cursor:pointer;transition:all .3s;margin:4px;}
  .action-btn:hover{transform:scale(1.03);box-shadow:0 0 15px rgba(6,182,212,0.3);}
  .action-btn.secondary{background:rgba(6,182,212,0.15);color:var(--text);border:1px solid var(--border);}

  .feedback-box{border-radius:12px;padding:16px;margin:12px 0;line-height:1.6;font-size:0.95em;animation:fadeIn .4s ease;}
  .feedback-box.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);}
  .feedback-box.info{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);color:var(--cyan);}
  .feedback-box.oops{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);color:var(--gold);}

  .result-card{text-align:center;padding:20px;}
  .result-card h2{color:var(--green);font-size:1.5em;margin-bottom:8px;}
  .result-stats{display:flex;gap:12px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .rs{background:rgba(6,182,212,0.08);border:1px solid var(--border);border-radius:12px;padding:12px 18px;text-align:center;}
  .rs .rs-val{font-size:1.4em;font-weight:700;color:var(--cyan);}
  .rs .rs-label{font-size:0.78em;color:var(--muted);margin-top:2px;}

  .conclusion-box{background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.25);border-radius:12px;padding:16px;text-align:left;margin:12px 0;}
  .conclusion-box h4{color:var(--purple);margin-bottom:6px;}
  .conclusion-box p{color:var(--muted);font-size:0.92em;line-height:1.6;}

  .notebook{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:16px;margin:10px 0;}
  .notebook h4{color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .notebook p{color:var(--muted);font-size:0.9em;line-height:1.5;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔬 Science Lab Simulator</h1>
    <p>Run virtual experiments and discover how science works!</p>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat">🧪 Experiments: <span class="sv" id="expCount">0</span></div>
    <div class="stat">🎯 Predictions: <span class="sv" id="predCount">0/0</span></div>
    <div class="stat">⭐ Stars: <span class="sv" id="starCount">0</span></div>
    <div class="stat">🔬 Scientist Level: <span class="sv" id="sciLevel">Beginner</span></div>
  </div>

  <div class="card" id="mainCard"></div>
</div>

<script>
// ─── State ───
let state = {
  expsDone: [],
  predictions: {right:0, total:0},
  stars: 0,
  currentExp: null,
  currentStep: 0,
  stepAnswers: {},
  optionOrder: []
};

// ─── Persistence ───
const SAVE_KEY = 'science-lab-simulator-save-v1';
const HUB_KEY = 'hubSummary_science-lab-simulator';

// ─── Daily effort tracking ───
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function ensureActivity(obj) {
  if (!obj.activity || typeof obj.activity !== 'object') obj.activity = { date: todayStr(), actions: 0, earnedDates: [] };
  if (typeof obj.activity.actions !== 'number') obj.activity.actions = 0;
  if (!Array.isArray(obj.activity.earnedDates)) obj.activity.earnedDates = [];
  return obj.activity;
}

function bumpActivity(weight) {
  try {
    const act = ensureActivity(state);
    const today = todayStr();
    if (act.date !== today) { act.date = today; act.actions = 0; }
    act.actions += weight;
    if (act.actions >= 20 && !act.earnedDates.includes(today)) {
      act.earnedDates.push(today);
      if (act.earnedDates.length > 30) act.earnedDates = act.earnedDates.slice(-30);
    }
    saveState();
  } catch(e) { /* keep playing even if tracking fails */ }
}

function saveState() {
  try {
    const act = ensureActivity(state);
    const today = todayStr();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      expsDone: state.expsDone,
      predictions: state.predictions,
      stars: state.stars,
      level: getLevel(),
      activity: act
    }));
    const pct = Math.round((state.expsDone.length / EXPERIMENTS.length) * 100);
    localStorage.setItem(HUB_KEY, JSON.stringify({
      app: 'science-lab-simulator',
      kid: 'siena',
      icon: '🔬',
      label: `${state.expsDone.length}/${EXPERIMENTS.length} experiments • ⭐${state.stars} • ${getLevel()}`,
      pct: pct,
      streak: null,
      stars: state.stars,
      lastPlayed: new Date().toISOString(),
      actionsToday: act.date === today ? act.actions : 0,
      actionsDate: today,
      earnedDates: act.earnedDates.slice()
    }));
  } catch (e) { /* localStorage unavailable — play on without saving */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.expsDone)) state.expsDone = saved.expsDone;
    if (saved.predictions && typeof saved.predictions.right === 'number' && typeof saved.predictions.total === 'number') {
      state.predictions = {right: saved.predictions.right, total: saved.predictions.total};
    }
    if (typeof saved.stars === 'number') state.stars = saved.stars;
    if (saved.activity && typeof saved.activity === 'object') state.activity = saved.activity;
    ensureActivity(state); // backward-compatible with saves lacking activity
  } catch (e) { /* corrupt or unavailable save — start fresh */ }
}

function getLevel() {
  if (state.stars >= 25) return 'Master Scientist';
  if (state.stars >= 15) return 'Expert';
  if (state.stars >= 8) return 'Apprentice';
  return 'Beginner';
}

function updateStats() {
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('expCount').textContent = state.expsDone.length;
  document.getElementById('predCount').textContent = `${state.predictions.right}/${state.predictions.total}`;
  document.getElementById('starCount').textContent = state.stars;
  document.getElementById('sciLevel').textContent = getLevel();
}

// ─── EXPERIMENTS ───
const EXPERIMENTS = [
  {
    id:'volcano', icon:'🌋', title:'Baking Soda Volcano',
    topic:'Chemistry — Acids & Bases', desc:'Mix chemicals to create a fizzy eruption!',
    steps:[
      {
        type:'intro',
        label:'🧪 Setup',
        text:'<p>In this experiment, we\'ll mix <strong>baking soda</strong> (a base) with <strong>vinegar</strong> (an acid) to create a chemical reaction! When an acid and a base mix, they react and produce something new.</p><p>You\'ll need to predict what happens before we try it.</p>',
        bench:{emoji:'🧪🫗',label:'Baking soda + vinegar ready on the bench'}
      },
      {
        type:'predict',
        label:'🤔 Make a Prediction',
        question:'What do you think will happen when we mix baking soda and vinegar together?',
        options:[
          {text:'Nothing will happen',icon:'😐',correct:false},
          {text:'It will fizz and bubble up',icon:'🫧',correct:true},
          {text:'It will change color to blue',icon:'🔵',correct:false},
          {text:'It will freeze solid',icon:'🧊',correct:false}
        ],
        explanation:'Great prediction! When baking soda (a base) and vinegar (an acid) mix, they react to create carbon dioxide gas — that\'s what makes all the bubbles and fizzing!'
      },
      {
        type:'action',
        label:'🧪 Run the Experiment!',
        text:'<p>Let\'s pour the vinegar into the baking soda...</p>',
        bench:{emoji:'🌋💥',label:'FIZZZZZZ! The mixture erupts with bubbles!',animation:'reacting',bubbles:true},
        result:'<p>WOW! The mixture is <strong>fizzing and bubbling</strong> like crazy! Foam is pouring over the sides!</p><p>This is a <strong>chemical reaction</strong> — the baking soda and vinegar are combining to create three new substances: water, a type of salt, and <strong>carbon dioxide gas</strong> (CO₂). The gas is what makes all those bubbles!</p>'
      },
      {
        type:'quiz',
        label:'📝 Check Understanding',
        question:'The bubbles in our volcano are made of which gas?',
        options:[
          {text:'Oxygen',icon:'💨',correct:false},
          {text:'Carbon dioxide (CO₂)',icon:'🫧',correct:true},
          {text:'Helium',icon:'🎈',correct:false},
          {text:'Nitrogen',icon:'💭',correct:false}
        ],
        explanation:'Carbon dioxide (CO₂) is the gas produced when an acid and base react. It\'s the same gas that makes soda fizzy! Plants actually breathe in CO₂ and use it to make food through photosynthesis.'
      },
      {
        type:'conclusion',
        label:'📓 Lab Notebook',
        science:'This experiment demonstrates an <strong>acid-base reaction</strong>.</p><p>Vinegar is acetic acid. Baking soda is sodium bicarbonate (a base).</p><p>When they combine: Acetic acid + Sodium bicarbonate → Water + Sodium acetate + Carbon dioxide gas.',
        realWorld:'This same type of reaction is used in fire extinguishers and antacid tablets (for upset stomachs).</p><p>It even shows up in baking — baking soda makes bread rise by creating CO₂ bubbles in the dough!'
      }
    ]
  },
  {
    id:'plants', icon:'🌱', title:'What Do Plants Need to Grow?',
    topic:'Biology — Photosynthesis', desc:'Test what plants need by changing their environment!',
    steps:[
      {
        type:'intro',
        label:'🌱 Setup',
        text:'<p>We have <strong>four identical seedlings</strong> in small pots. We\'re going to give each plant different conditions to find out what plants really need to grow.</p><p>Plant A: Normal sunlight + water<br>Plant B: No sunlight (in a dark closet) + water<br>Plant C: Normal sunlight + NO water<br>Plant D: Normal sunlight + water + extra fertilizer</p>',
        bench:{emoji:'🌱🌱🌱🌱',label:'Four identical seedlings ready for testing'}
      },
      {
        type:'predict',
        label:'🤔 Make a Prediction',
        question:'After two weeks, which plant do you think will grow the MOST?',
        options:[
          {text:'Plant A (sun + water)',icon:'☀️💧',correct:false},
          {text:'Plant B (dark + water)',icon:'🌑💧',correct:false},
          {text:'Plant C (sun + no water)',icon:'☀️🏜️',correct:false},
          {text:'Plant D (sun + water + fertilizer)',icon:'☀️💧✨',correct:true}
        ],
        explanation:'Plant D with sunlight, water, AND fertilizer will grow the most! Fertilizer gives plants extra nutrients (like nitrogen and phosphorus) that help them grow faster. But the key discovery is seeing what happens when you REMOVE something...'
      },
      {
        type:'action',
        label:'⏩ Fast Forward 2 Weeks!',
        text:'<p>Let\'s fast forward to see the results after 14 days...</p>',
        bench:{emoji:'🌿🥀🥀🌳',label:'Results are in! Check each plant!',animation:'growing'},
        result:'<p><strong>Plant A</strong> (sun + water): Grew well! Healthy green leaves. 🌿<br><strong>Plant B</strong> (dark + water): Grew tall but pale yellow, thin and weak. 🥀<br><strong>Plant C</strong> (sun, no water): Wilted and dried out. Barely alive. 🥀<br><strong>Plant D</strong> (sun + water + fertilizer): Grew the TALLEST with the biggest, darkest green leaves! 🌳</p><p>This is called a <strong>controlled experiment</strong> — we only changed ONE thing at a time so we could see what made the difference!</p>'
      },
      {
        type:'quiz',
        label:'📝 Check Understanding',
        question:'Why did Plant B grow tall but turn yellow?',
        options:[
          {text:'It got too much water',icon:'💧',correct:false},
          {text:'Without sunlight, it couldn\'t make chlorophyll (the green color) properly',icon:'☀️',correct:true},
          {text:'It was too cold in the closet',icon:'🥶',correct:false},
          {text:'The soil was bad',icon:'🪨',correct:false}
        ],
        explanation:'Plants need sunlight to make chlorophyll — the green pigment that lets them turn sunlight into food (photosynthesis). Without light, Plant B grew tall trying to "reach" for light, but it was pale and weak because it couldn\'t make enough food!'
      },
      {
        type:'conclusion',
        label:'📓 Lab Notebook',
        science:'This experiment tested <strong>variables</strong> that affect plant growth.</p><p>Plants need three things: sunlight (for photosynthesis), water (to transport nutrients and support cell structure), and nutrients from soil.</p><p><strong>Photosynthesis</strong> is the process: Sunlight + Water + CO₂ → Sugar (food) + Oxygen.',
        realWorld:'Farmers use this exact science every day! They test soil nutrients, plan for sunlight exposure, and manage irrigation (watering) systems to grow the most food possible.</p><p>Greenhouses control all these variables precisely.'
      }
    ]
  },
  {
    id:'density', icon:'🫧', title:'Density Tower Challenge',
    topic:'Physics — Density & Buoyancy', desc:'Layer liquids and discover why things float or sink!',
    steps:[
      {
        type:'intro',
        label:'🧪 Setup',
        text:'<p>We have a tall glass and four different liquids: <strong>honey</strong>, <strong>dish soap</strong>, <strong>water</strong> (dyed blue), and <strong>vegetable oil</strong>. We\'re going to pour them all into the same glass!</p><p>We also have small objects to test: a grape, a plastic bead, a cork, and a coin.</p>',
        bench:{emoji:'🍯🧴💧🫗',label:'Four liquids ready to layer'}
      },
      {
        type:'predict',
        label:'🤔 Make a Prediction',
        question:'If we carefully pour all four liquids into the same glass, what do you think will happen?',
        options:[
          {text:'They\'ll all mix together into one color',icon:'🎨',correct:false},
          {text:'They\'ll form separate layers based on density',icon:'🏗️',correct:true},
          {text:'The oil will sink to the bottom',icon:'⬇️',correct:false},
          {text:'They\'ll react and fizz',icon:'🫧',correct:false}
        ],
        explanation:'They form layers! Each liquid has a different <strong>density</strong> (how heavy it is for its size). Heavier/denser liquids sink to the bottom, and lighter ones float on top. The order from bottom to top: honey → dish soap → water → oil.'
      },
      {
        type:'action',
        label:'🧪 Build the Tower!',
        text:'<p>Carefully pouring each liquid into the glass...</p>',
        bench:{emoji:'🏗️',label:'A beautiful density tower! Four distinct layers!',animation:'reacting'},
        result:'<p>Look at that! <strong>Four perfect layers!</strong></p><p>🍯 <strong>Bottom: Honey</strong> — the densest (heaviest per volume)<br>🧴 <strong>Layer 2: Dish soap</strong> — denser than water<br>💧 <strong>Layer 3: Water</strong> — our reference point<br>🫗 <strong>Top: Vegetable oil</strong> — the least dense</p><p>Now let\'s drop in our objects and see where they land!</p>'
      },
      {
        type:'quiz',
        label:'📝 Check Understanding',
        question:'A grape sinks through the oil and water but floats on the dish soap. What does this tell us?',
        options:[
          {text:'The grape is denser than water but less dense than dish soap',icon:'🍇',correct:true},
          {text:'The grape is the lightest object',icon:'🪶',correct:false},
          {text:'Grapes always float in soap',icon:'🧴',correct:false},
          {text:'The grape is less dense than everything',icon:'⬆️',correct:false}
        ],
        explanation:'An object sinks through liquids that are LESS dense than it, and floats on liquids that are MORE dense. Since the grape sank through oil and water but stopped at the dish soap, the grape\'s density is between water and dish soap!'
      },
      {
        type:'conclusion',
        label:'📓 Lab Notebook',
        science:'<strong>Density</strong> = mass ÷ volume (how much stuff is packed into a space).</p><p>Objects float in liquids that are denser than them and sink in liquids that are less dense. This is called <strong>buoyancy</strong>.',
        realWorld:'Ships float because their overall density (including all the air inside) is less than water.</p><p>Submarines control their density by filling or emptying ballast tanks with water — more water makes them denser so they sink, pumping water out makes them float!'
      }
    ]
  },
  {
    id:'static', icon:'⚡', title:'Static Electricity Lab',
    topic:'Physics — Electric Charge', desc:'Make things move without touching them using static!',
    steps:[
      {
        type:'intro',
        label:'⚡ Setup',
        text:'<p>We have a <strong>balloon</strong>, some <strong>tiny pieces of paper</strong>, an <strong>empty aluminum can</strong>, and a <strong>wool sweater</strong>. We\'re going to create <strong>static electricity</strong> — electric charge that builds up on surfaces!</p><p>When you rub certain materials together, electrons (tiny negative particles) jump from one material to the other.</p>',
        bench:{emoji:'🎈🧶',label:'Balloon and wool sweater ready'}
      },
      {
        type:'predict',
        label:'🤔 Make a Prediction',

// ─── Render ───
function showExpSelect() {
  document.getElementById('statsBar').style.display = state.expsDone.length > 0 ? 'flex' : 'none';
  if (state.expsDone.length > 0) updateStats();

  const card = document.getElementById('mainCard');
  let html = `<h2 style="text-align:center;font-size:1.3em;margin-bottom:6px;">🧪 Choose an Experiment!</h2>
    <p style="text-align:center;color:var(--muted);margin-bottom:16px;">Each experiment teaches you real science through the scientific method: Question → Predict → Test → Observe → Conclude</p>
    <div class="exp-grid">`;

  EXPERIMENTS.forEach(exp => {
    const done = state.expsDone.includes(exp.id);
    html += `<div class="exp-card${done?' done':''}" onclick="startExperiment('${exp.id}')">
      ${done?'<span class="ec-badge">✅ Done</span>':''}
      <div class="ec-icon">${exp.icon}</div>
      <div class="ec-title">${exp.title}</div>
      <div class="ec-desc">${exp.desc}</div>
      <div class="ec-topic">📘 ${exp.topic}</div>
    </div>`;
  });

  html += '</div>';
  card.innerHTML = html;
}

function startExperiment(id) {
  const exp = EXPERIMENTS.find(e=>e.id===id);
  state.currentExp = exp;
  state.currentStep = 0;
  state.stepAnswers = {};
  document.getElementById('statsBar').style.display = 'flex';
  updateStats();
  renderStep();
}

function renderStep() {
  const exp = state.currentExp;
  const step = exp.steps[state.currentStep];
  const card = document.getElementById('mainCard');

  // Step tracker
  let dots = exp.steps.map((s,i) => {
    let cls = '';
    if (i < state.currentStep) cls = 'done';
    else if (i === state.currentStep) cls = 'active';
    return `<div class="st-dot ${cls}"></div>`;
  }).join('');

  let html = `
    <div class="exp-header">
      <div class="eh-icon">${exp.icon}</div>
      <div><h2>${exp.title}</h2><div class="eh-topic">📘 ${exp.topic}</div></div>
    </div>
    <div class="step-tracker">${dots}</div>
    <div class="experiment-step">
      <div class="es-label">${step.label}</div>`;

  if (step.type === 'intro') {
    html += `<div class="es-content">${step.text}</div>`;
    if (step.bench) {
      html += `<div class="lab-bench">
        <div class="bench-emoji">${step.bench.emoji}</div>
        <div class="bench-label">${step.bench.label}</div>
      </div>`;
    }
    html += `<div style="text-align:center;margin-top:12px;">
      <button class="action-btn" onclick="nextStep()">Let's Start! →</button>
    </div>`;
  }

  else if (step.type === 'predict' || step.type === 'quiz') {
    // Shuffle answer order so the correct one isn't always in the same spot
    state.optionOrder = step.options.map((o,i) => i);
    for (let i = state.optionOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.optionOrder[i], state.optionOrder[j]] = [state.optionOrder[j], state.optionOrder[i]];
    }
    html += `<div class="es-content"><p><strong>${step.question}</strong></p></div>
      <div class="choice-grid" id="choiceGrid">
        ${state.optionOrder.map((oi) => {
          const o = step.options[oi];
          return `<button class="choice-btn" id="choice${oi}" onclick="submitChoice(${oi})">
          <span class="cb-icon">${o.icon}</span> ${o.text}
        </button>`;
        }).join('')}
      </div>
      <div id="choiceFeedback"></div>`;
  }

  else if (step.type === 'action') {
    html += `<div class="es-content">${step.text}</div>`;
    if (step.bench) {
      html += `<div class="lab-bench ${step.bench.animation||''}" id="labBench">
        <div class="bench-emoji">${step.bench.emoji}</div>
        <div class="bench-label">${step.bench.label}</div>
        ${step.bench.bubbles ? '<div class="bubbles" id="bubbles"></div>':''}
      </div>`;
    }
    html += `<div class="es-content" style="margin-top:12px;">${step.result}</div>`;
    html += `<div style="text-align:center;margin-top:12px;">
      <button class="action-btn" onclick="nextStep()">Continue →</button>
    </div>`;

    // Add bubbles
    if (step.bench?.bubbles) {
      setTimeout(() => {
        const bubbles = document.getElementById('bubbles');
        if (bubbles) {
          for (let i = 0; i < 12; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            b.style.cssText = `left:${Math.random()*90+5}%;--dur:${Math.random()*2+1.5}s;animation-delay:${Math.random()*2}s;width:${Math.random()*8+6}px;height:${Math.random()*8+6}px;`;
            bubbles.appendChild(b);
          }
        }
      }, 100);
    }
  }

  else if (step.type === 'conclusion') {
    html += `<div class="conclusion-box">
      <h4>🔬 The Science</h4>
      <p>${step.science}</p>
    </div>
    <div class="notebook">
      <h4>🌍 Real-World Connection</h4>
      <p>${step.realWorld}</p>
    </div>`;

    // Calculate score
    const predRight = Object.values(state.stepAnswers).filter(a=>a).length;
    const predTotal = Object.keys(state.stepAnswers).length;
    const earnedStars = predRight === predTotal ? 3 : predRight > 0 ? 2 : 1;

    html += `<div class="result-card">
      <h2>🧪 Experiment Complete!</h2>
      <div class="result-stats">
        <div class="rs"><div class="rs-val">${predRight}/${predTotal}</div><div class="rs-label">Predictions Correct</div></div>
        <div class="rs"><div class="rs-val">${'⭐'.repeat(earnedStars)}</div><div class="rs-label">Stars Earned</div></div>
      </div>
      <button class="action-btn" onclick="finishExperiment(${earnedStars},${predRight},${predTotal})">🔬 Back to Lab</button>
    </div>`;
  }

  html += '</div>';
  card.innerHTML = html;
  card.scrollIntoView({behavior:'smooth',block:'start'});
}

function submitChoice(idx) {
  const step = state.currentExp.steps[state.currentStep];
  const correct = step.options[idx].correct;
  state.stepAnswers[state.currentStep] = correct;
  state.predictions.total++;
  if (correct) state.predictions.right++;

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b,i) => {
    const optIdx = state.optionOrder[i];
    b.style.pointerEvents = 'none';
    if (step.options[optIdx].correct) b.classList.add('correct');
    else if (optIdx === idx && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('choiceFeedback');
  fb.innerHTML = `<div class="feedback-box ${correct?'success':'oops'}">
    <strong>${correct?'✅ Great prediction!':'💡 Not quite — but that\'s how science works! We learn from being wrong.'}</strong><br>${step.explanation}
  </div>
  <div style="text-align:center;margin-top:10px;">
    <button class="action-btn" onclick="nextStep()">Continue →</button>
  </div>`;

  updateStats();
  bumpActivity(4); // predict/quiz answer submitted
  saveState();
}

function nextStep() {
  state.currentStep++;
  renderStep();
}

function finishExperiment(stars, right, total) {
  if (!state.expsDone.includes(state.currentExp.id)) {
    state.expsDone.push(state.currentExp.id);
    state.stars += stars;
  }
  bumpActivity(5); // experiment completed
  updateStats();
  saveState();
  showExpSelect();
}

// ─── Init ───
loadState();
showExpSelect();
</script>
