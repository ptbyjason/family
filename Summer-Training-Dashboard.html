<title>Summer Training Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#1a1a2e;line-height:1.5;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:22px;font-weight:700;color:#1a1a2e}
.header .subtitle{font-size:13px;color:#666;margin-top:2px}
.phase-banner{text-align:center;padding:8px 16px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600}
.phase-1{background:#dbeafe;color:#1e40af}.phase-2{background:#fef3c7;color:#92400e}.phase-3{background:#fce7f3;color:#9d174d}
.nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:10;background:#f8f9fa;padding:8px 0}
.nav button{padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.nav button.active{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.nav button:hover:not(.active){background:#f0f0f0}
.week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.week-nav button{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:16px;-webkit-tap-highlight-color:transparent}
.week-nav button:active{background:#e0e0e0}
.week-nav .week-label{font-size:15px;font-weight:600;min-width:220px;text-align:center}
.day-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #ddd}
.day-card.rest{border-left-color:#adb5bd;opacity:.7}.day-card.travel{border-left-color:#ffc107;background:#fffdf0}
.day-card h3{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.day-card .date-label{font-size:12px;color:#888;font-weight:400}
.day-card .day-theme{font-size:12px;color:#2d6a4f;font-weight:500;margin-bottom:10px}
.workout-block{border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;overflow:hidden}
.workout-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:#fafafa;user-select:none;-webkit-tap-highlight-color:transparent}
.workout-header:active{background:#ececec}
.workout-header input[type="checkbox"]{width:22px;height:22px;accent-color:#2d6a4f;cursor:pointer;flex-shrink:0}
.workout-header .workout-title{flex:1;font-size:14px;font-weight:600}
.workout-header .workout-title.done{text-decoration:line-through;color:#999}
.workout-header .expand-icon{font-size:12px;color:#999;transition:transform .2s}
.workout-header .expand-icon.open{transform:rotate(90deg)}
.category-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-right:6px;vertical-align:middle}
.tag-sprint{background:#fee2e2;color:#dc2626}.tag-cardio{background:#dbeafe;color:#2563eb}.tag-soccer{background:#d1fae5;color:#059669}.tag-strength{background:#fef3c7;color:#d97706}.tag-mobility{background:#ede9fe;color:#7c3aed}.tag-corrective{background:#ffe4e6;color:#be123c}
.workout-detail{display:none;padding:0 12px 12px 40px}
.workout-detail.open{display:block}
.exercise-list{list-style:none}
.exercise-list li{padding:6px 0;font-size:13px;border-bottom:1px solid #f5f5f5;display:flex;gap:8px}
.exercise-list li:last-child{border-bottom:none}
.exercise-list .ex-name{font-weight:500;min-width:40%}
.exercise-list .ex-prescription{color:#555}
.exercise-list .ex-note{font-size:11px;color:#888;font-style:italic;display:block;margin-top:2px}
.vid-link{color:#aaa;font-size:10px;text-decoration:none;margin-left:4px;padding:3px 5px;border:1px solid #ddd;border-radius:4px;vertical-align:middle;display:inline-block;line-height:1}.vid-link:active{color:#dc2626;border-color:#dc2626}
.workout-footer{padding:6px 12px 10px 12px}
.notes-input{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:14px;font-family:inherit;resize:none;-webkit-appearance:none}
.notes-input:focus{outline:none;border-color:#2d6a4f}
.difficulty-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:0 0 0 28px}
.difficulty-label{font-size:11px;color:#888;font-weight:500;white-space:nowrap}
.diff-btn{padding:6px 12px;border-radius:14px;border:1.5px solid #e0e0e0;font-size:12px;font-weight:600;cursor:pointer;background:#fff;transition:all .15s;-webkit-tap-highlight-color:transparent}
.diff-btn:active{transform:scale(0.95)}
.diff-btn.selected-easy{background:#d1fae5;border-color:#059669;color:#059669}
.diff-btn.selected-right{background:#dbeafe;border-color:#2563eb;color:#2563eb}
.diff-btn.selected-hard{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.diff-indicator{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:4px}
.diff-indicator.ind-easy{background:#059669}.diff-indicator.ind-right{background:#2563eb}.diff-indicator.ind-hard{background:#dc2626}
.travel-toggle{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px}
.travel-toggle label{font-size:13px;color:#666}
.toggle-switch{position:relative;width:44px;height:24px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.3s}
.toggle-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:#ffc107}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px)}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-card .stat-value{font-size:28px;font-weight:700}
.stat-card .stat-label{font-size:12px;color:#666;margin-top:2px}
.chart-container{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-container h3{font-size:14px;font-weight:600;margin-bottom:12px}
.chart-wrap{position:relative;height:220px}
.insight-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #2d6a4f}
.insight-card.warning{border-left-color:#f59e0b}.insight-card.caution{border-left-color:#dc2626}.insight-card.strength-insight{border-left-color:#2563eb}.insight-card.progress-up{border-left-color:#059669}
.insight-card h4{font-size:14px;font-weight:600;margin-bottom:4px}
.insight-card p{font-size:13px;color:#555}
.insight-card ul{margin:6px 0 0 16px;font-size:13px;color:#555}
.insight-card ul li{margin-bottom:4px}
.rec-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px}
.rec-progress{background:#d1fae5;color:#059669}.rec-maintain{background:#dbeafe;color:#2563eb}.rec-deload{background:#fee2e2;color:#dc2626}.rec-adjust{background:#fef3c7;color:#d97706}
.section{display:none}.section.active{display:block}
.warmup-block{background:#f8fdf9;border:1px dashed #c8e6c9;border-radius:6px;padding:10px 12px;margin-bottom:10px}
.warmup-block h4{font-size:12px;font-weight:600;color:#2d6a4f;margin-bottom:4px}
.warmup-block p{font-size:12px;color:#555}
.trend-arrow{font-size:14px;margin-right:4px}
.trend-up{color:#dc2626}.trend-down{color:#059669}.trend-flat{color:#2563eb}
.test-section-header{font-size:16px;font-weight:700;margin-bottom:4px}
.test-section-sub{font-size:13px;color:#666;margin-bottom:16px}
.test-selector{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.test-selector button{padding:6px 14px;border:1.5px solid #ddd;background:#fff;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.test-selector button.active-test{background:#1e40af;color:#fff;border-color:#1e40af}
.test-selector button:hover:not(.active-test){background:#f0f0f0}
.test-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-top:4px solid #1e40af}
.test-card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.test-card .test-cat{font-size:12px;font-weight:600;margin-bottom:8px}
.test-card .test-protocol{font-size:13px;color:#444;margin-bottom:12px;line-height:1.6}
.test-card .test-protocol strong{color:#1a1a2e}
.test-input-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap}
.test-input-group{display:flex;flex-direction:column;gap:4px}
.test-input-group label{font-size:11px;font-weight:600;color:#666}
.test-input-group select,.test-input-group input{padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:16px;font-family:inherit;width:160px;-webkit-appearance:none}
.test-input-group input:focus,.test-input-group select:focus{outline:none;border-color:#1e40af}
.save-test-btn{padding:10px 20px;background:#1e40af;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.save-test-btn:active{background:#1e3a8a;transform:scale(0.97)}
.save-msg{font-size:12px;color:#059669;font-weight:500;margin-left:8px;opacity:0;transition:opacity .3s}
.save-msg.show{opacity:1}
.results-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px}
.results-table th{text-align:left;padding:8px 10px;background:#f8f9fa;border-bottom:2px solid #e5e7eb;font-weight:600;font-size:12px;color:#666}
.results-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0}
.pr-badge{display:inline-block;background:#fef3c7;color:#d97706;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px}
.improve-badge{font-size:11px;font-weight:600;margin-left:4px}
.improve-up{color:#059669}.improve-down{color:#dc2626}.improve-same{color:#888}
.delete-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:4px 8px;-webkit-tap-highlight-color:transparent}
.delete-btn:active{color:#dc2626}
.test-pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.pr-card{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border-top:3px solid #d97706}
.pr-card .pr-value{font-size:24px;font-weight:700;color:#d97706}
.pr-card .pr-label{font-size:11px;color:#666;margin-top:2px}
.pr-card .pr-change{font-size:12px;font-weight:600;margin-top:4px}
.chart-wrap-test{position:relative;height:250px}
.no-data-msg{text-align:center;padding:40px 20px;color:#888;font-size:14px}
@media(max-width:480px){
  .progress-grid{grid-template-columns:repeat(2,1fr)}
  .nav button{padding:6px 12px;font-size:12px}
  .exercise-list li{flex-direction:column;gap:2px}
  .exercise-list .ex-name{min-width:auto}
  .difficulty-row{flex-wrap:wrap;padding-left:0}
  .test-input-row{flex-direction:column;align-items:stretch}
  .test-input-group input,.test-input-group select{width:100%}
  .test-pr-grid{grid-template-columns:repeat(2,1fr)}
  .save-test-btn{width:100%}
}
.week-focus{background:#f0fdf4;border:1px solid #cfe9d9;border-left:4px solid #2d6a4f;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.5}
.week-focus .wf-label{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:#2d6a4f;text-transform:uppercase;margin-right:6px}
.week-focus .wf-title{font-weight:600;color:#1a1a2e}
.week-focus .wf-text{display:block;color:#555;margin-top:3px}
.week-focus .wf-link{display:inline-block;margin-top:4px;font-size:12px;color:#2563eb;text-decoration:none;font-weight:600}
.day-cue{font-size:12px;color:#7a7a8c;font-style:italic;margin-bottom:10px;padding-left:2px}
</style>
</head>
<body>

<div class="header">
  <h1>Summer Training Dashboard</h1>
  <div class="subtitle">May 25 – Aug 12, 2026 • 5 days/week + XC team (Mon–Thu) • Soccer | Speed | Strength | Mobility</div>
</div>
<div id="phase-banner" class="phase-banner phase-1"></div>

<div class="nav">
  <button class="active" onclick="showSection('schedule',this)">Schedule</button>
  <button onclick="showSection('tests',this)">Fitness Tests</button>
  <button onclick="showSection('progress',this)">Progress</button>
  <button onclick="showSection('insights',this)">Insights</button>
</div>

<div id="schedule-section" class="section active">
  <div class="week-nav">
    <button onclick="changeWeek(-1)">◀</button>
    <div class="week-label" id="week-label">Week 1</div>
    <button onclick="changeWeek(1)">▶</button>
  </div>
  <div class="travel-toggle">
    <label>Mark this week as travel/off:</label>
    <label class="toggle-switch"><input type="checkbox" id="travel-toggle" onchange="toggleTravel()"><span class="toggle-slider"></span></label>
  </div>
  <div id="day-cards"></div>
</div>

<div id="tests-section" class="section">
  <div style="text-align:center;margin-bottom:16px">
    <div class="test-section-header">Fitness Test Battery</div>
    <div class="test-section-sub">Test every 2 weeks (Weeks 1, 3, 5, 7, 9, 11) • Warm up fully before testing</div>
  </div>
  <div id="test-pr-grid" class="test-pr-grid"></div>
  <div class="test-selector" id="test-selector"></div>
  <div id="test-content"></div>
</div>

<div id="progress-section" class="section">
  <div class="progress-grid" id="stat-cards"></div>
  <div class="chart-container"><h3>Weekly Completion Rate</h3><div class="chart-wrap"><canvas id="completionChart"></canvas></div></div>
  <div class="chart-container"><h3>Category Breakdown</h3><div class="chart-wrap"><canvas id="categoryChart"></canvas></div></div>
  <div class="chart-container"><h3>Difficulty Trend by Category</h3><div class="chart-wrap"><canvas id="difficultyChart"></canvas></div></div>
</div>

<div id="insights-section" class="section"></div>

<script>
const START_DATE=new Date(2026,4,25),TOTAL_WEEKS=11;let currentWeek=0;
const DIFF={EASY:1,RIGHT:2,HARD:3},DIFF_LABELS={1:'Too Easy',2:'Just Right',3:'Too Hard'},DIFF_CSS={1:'selected-easy',2:'selected-right',3:'selected-hard'},DIFF_IND={1:'ind-easy',2:'ind-right',3:'ind-hard'};
function getPhase(w){return w<4?1:w<8?2:3}
function getPhaseLabel(w){const p=getPhase(w);if(p===1)return{label:'Phase 1: Foundation (Weeks 1–4)',cls:'phase-1'};if(p===2)return{label:'Phase 2: Development (Weeks 5–8)',cls:'phase-2'};return{label:'Phase 3: Preseason (Weeks 9–11)',cls:'phase-3'}}
const CATEGORIES={sprint:{label:'Speed',color:'#dc2626',tagClass:'tag-sprint'},cardio:{label:'Cardio',color:'#2563eb',tagClass:'tag-cardio'},soccer:{label:'Soccer',color:'#059669',tagClass:'tag-soccer'},strength:{label:'Strength',color:'#d97706',tagClass:'tag-strength'},mobility:{label:'Mobility',color:'#7c3aed',tagClass:'tag-mobility'},corrective:{label:'Corrective',color:'#be123c',tagClass:'tag-corrective'}};
const TEST_WEEKS=[0,2,4,6,8,10];
const TESTS=[
{id:'sprint_30m',name:'30m Sprint',unit:'seconds',cat:'Speed',color:'#dc2626',lowerIsBetter:true,icon:'⚡',protocol:'<strong>What it measures:</strong> Acceleration and raw sprint speed.<br><br><strong>Setup:</strong> Mark 30 meters on flat ground (~33 large steps).<br><br><strong>Protocol:</strong><br>1. Full dynamic warmup (5+ min)<br>2. 2 practice runs at 80%<br>3. 3-point stance start<br>4. <strong>3 max-effort trials</strong>, 2 min rest between<br>5. Timer starts on first movement, stops at finish<br>6. <strong>Record best time</strong><br><br><strong>Tips:</strong> Drive arms hard. Stay low first 10m. Don\'t peek at the timer.'},
{id:'broad_jump',name:'Broad Jump',unit:'inches',cat:'Power',color:'#d97706',lowerIsBetter:false,icon:'💪',protocol:'<strong>What it measures:</strong> Explosive lower-body power.<br><br><strong>Setup:</strong> Flat ground, tape start line, tape measure.<br><br><strong>Protocol:</strong><br>1. Toes behind line, feet shoulder-width<br>2. Swing arms, bend knees, explode forward<br>3. Measure from start line to back of nearest heel<br>4. <strong>3 attempts</strong>, 60s rest<br>5. <strong>Record best in inches</strong><br><br><strong>Tips:</strong> Arm swing is half the jump. Reach forward on landing. Fall backward = retake.'},
{id:'six_min_run',name:'6-Minute Run',unit:'meters',cat:'Cardio',color:'#2563eb',lowerIsBetter:false,icon:'🏃',protocol:'<strong>What it measures:</strong> Aerobic endurance — your engine for XC and soccer.<br><br><strong>Setup:</strong> Flat route you can measure. Use GPS app or field perimeter (~350m/lap).<br><br><strong>Protocol:</strong><br>1. Light 3 min jog warmup + strides<br>2. Set <strong>6-minute countdown</strong><br>3. Run as far as you can — pacing matters<br>4. Stop and mark spot at the beep<br>5. <strong>Record total meters</strong><br><br><strong>Tips:</strong> Start at a pace you can hold all 6 min. First minute should feel easy. Last minute should hurt.'},
{id:'juggling',name:'Juggling Record',unit:'touches',cat:'Soccer',color:'#059669',lowerIsBetter:false,icon:'⚽',protocol:'<strong>What it measures:</strong> Ball control and focus.<br><br><strong>Setup:</strong> Flat surface, inflated ball, no wind.<br><br><strong>Protocol:</strong><br>1. 2 min ball mastery warmup<br>2. <strong>5 attempts</strong> at max consecutive touches<br>3. Any surface: feet, thighs, head, chest<br>4. Ball can\'t touch ground<br>5. <strong>Record highest number</strong><br><br><strong>Tips:</strong> Keep ball below head height. Relax ankle on contact. Use thigh to reset. Count out loud.'},
{id:'squat_hold',name:'Deep Squat Hold',unit:'seconds',cat:'Mobility',color:'#7c3aed',lowerIsBetter:false,icon:'🧘',protocol:'<strong>What it measures:</strong> Functional mobility — ankles, hips, and thoracic spine together.<br><br><strong>Setup:</strong> Flat surface. Barefoot or socks. Phone timer.<br><br><strong>Protocol:</strong><br>1. Warm up first (5 min movement, squats, leg swings)<br>2. Drop into a full deep squat with these standards:<br>&nbsp;&nbsp;• <strong>Heels flat</strong> (no lifting onto toes)<br>&nbsp;&nbsp;• <strong>Hips below knees</strong><br>&nbsp;&nbsp;• <strong>Chest up, back straight</strong> (not collapsed)<br>&nbsp;&nbsp;• <strong>Feet shoulder-width</strong>, toes out up to 30°<br>&nbsp;&nbsp;• <strong>Arms in front</strong> (not holding anything)<br>3. Start timer when in position<br>4. Stop when ANY standard breaks<br>5. <strong>3 attempts</strong>, 60s rest. <strong>Record best time.</strong><br><br><strong>Tips:</strong> Push knees out over toes. Breathe slowly. If you can\'t hold at all with heels down, that\'s your baseline — the program fixes this. Most kids start 30–60s. Elite movers hold 3+ min.'},
{id:'shuttle_5_10_5',name:'5-10-5 Shuttle',unit:'seconds',cat:'Agility',color:'#f59e0b',lowerIsBetter:true,icon:'🔄',protocol:'<strong>What it measures:</strong> Change-of-direction speed.<br><br><strong>Setup:</strong> 3 cones in a line, 5 yards apart. Start at center.<br><br><strong>Protocol:</strong><br>1. Full warmup + 2 practice at 80%<br>2. 3-point stance at center cone<br>3. Sprint 5 yds RIGHT, touch line<br>4. Sprint 10 yds LEFT (past center to far cone), touch<br>5. Sprint 5 yds RIGHT back through center<br>6. <strong>3 attempts</strong>, 2 min rest. <strong>Record best.</strong><br><br><strong>Tips:</strong> Stay LOW through turns. Plant outside foot hard. Don\'t round the turns.'}
];
let activeTestId=TESTS[0].id;
function getState(){try{return JSON.parse(localStorage.getItem('trainingV5')||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem('trainingV5',JSON.stringify(s))}
function getWS(w,bid){return getState()[`w${w}_${bid}`]||{done:false,notes:'',diff:0}}
function setWS(w,bid,d){const s=getState();s[`w${w}_${bid}`]=d;saveState(s)}
function isTravel(w){return getState()[`w${w}_travel`]||false}
function setTravelState(w,v){const s=getState();s[`w${w}_travel`]=v;saveState(s)}
function getTestResults(tid){return getState()[`test_${tid}`]||[]}
function saveTestResult(tid,wk,val){const s=getState(),k=`test_${tid}`;let r=s[k]||[];r=r.filter(x=>x.week!==wk);r.push({week:wk,value:parseFloat(val),date:new Date(START_DATE.getTime()+wk*7*24*60*60*1000).toISOString()});r.sort((a,b)=>a.week-b.week);s[k]=r;saveState(s)}
function deleteTestResult(tid,wk){const s=getState(),k=`test_${tid}`;s[k]=(s[k]||[]).filter(x=>x.week!==wk);saveState(s)}

function renderSchedule(){const dates=getWeekDates(currentWeek),phase=getPhase(currentWeek),pi=getPhaseLabel(currentWeek);document.getElementById('week-label').textContent=`Week ${currentWeek+1} — ${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;document.getElementById('travel-toggle').checked=isTravel(currentWeek);const b=document.getElementById('phase-banner');b.className=`phase-banner ${pi.cls}`;b.textContent=pi.label;const prg=getPrograms(phase),dk=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'],dl=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],dt=['Speed + Soccer + Mobility • +XC team run','Strength + Mobility + Stretch • +XC team run','Soccer Technical + Yoga • +XC team run','Strength + Mobility • +XC team run','Plyos + Shooting + Easy Jog + Mobility','Rest & Recovery','Rest & Recovery'];const c=document.getElementById('day-cards');c.innerHTML=weekFocusHTML(currentWeek);const tv=isTravel(currentWeek),isTW=TEST_WEEKS.includes(currentWeek);
dk.forEach((key,di)=>{const day=prg[key],card=document.createElement('div'),isR=day.rest;card.className=`day-card${isR?' rest':''}${tv?' travel':''}`;let h=`<h3>${dl[di]} <span class="date-label">${fmtDate(dates[di])}</span></h3>`;if(tv){h+=`<p style="font-size:13px;color:#888;font-style:italic">Travel week — rest or do what you can!</p>`}else if(isR){h+=`<p style="font-size:13px;color:#888;font-style:italic">Rest & recovery.</p>`;if(di===5)h+=`<div style="margin-top:8px;padding:8px 12px;background:#f0fdf4;border-radius:6px;border-left:3px solid #2d6a4f;font-size:12px">Optional easy distance run if he wants it — his call. XC already covers the weekly mileage.</div>`;if(di===5&&isTW)h+=`<div style="margin-top:8px;padding:8px 12px;background:#eff6ff;border-radius:6px;border-left:3px solid #1e40af;font-size:12px"><strong>📋 Test Week!</strong> Run fitness tests this week.</div>`}else{h+=`<div class="day-theme">${dt[di]}</div>`;h+=`<div class="day-cue">${dayCue(dates[di])}</div>`;if(di===0&&isTW)h+=`<div style="margin-bottom:10px;padding:8px 12px;background:#eff6ff;border-radius:6px;border-left:3px solid #1e40af;font-size:12px"><strong>📋 Test Week ${TEST_WEEKS.indexOf(currentWeek)+1}/6</strong> — Go to <strong>Fitness Tests</strong> tab.</div>`;h+=`<div class="warmup-block"><h4>WARMUP</h4><p>${day.warmup}</p></div>`;day.blocks.forEach(bl=>{const ws=getWS(currentWeek,bl.id),cat=CATEGORIES[bl.cat],io=expandedBlocks[`${currentWeek}_${bl.id}`],dv=ws.diff||0;h+=`<div class="workout-block"><div class="workout-header" onclick="toggleExpand(${currentWeek},'${bl.id}',this)"><input type="checkbox" ${ws.done?'checked':''} onclick="event.stopPropagation();toggleDone(${currentWeek},'${bl.id}',this.checked)"><span class="workout-title ${ws.done?'done':''}"><span class="category-tag ${cat.tagClass}">${cat.label}</span>${bl.title}`;if(dv)h+=` <span class="diff-indicator ${DIFF_IND[dv]}"></span>`;h+=`</span><span class="expand-icon ${io?'open':''}">▶</span></div><div class="workout-detail ${io?'open':''}"><ul class="exercise-list">`;bl.exercises.forEach(ex=>{const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.name+' exercise form');const vl=ex.name!=='Follow your program'?` <a href="${yt}" target="_blank" rel="noopener" class="vid-link" title="Watch how on YouTube">▶</a>`:'';h+=`<li><span class="ex-name">${ex.name}${vl}</span><span class="ex-prescription">${ex.rx}${ex.note?`<span class="ex-note">${ex.note}</span>`:''}</span></li>`});h+=`</ul></div><div class="workout-footer"><div class="difficulty-row"><span class="difficulty-label">How was it?</span>`;[1,2,3].forEach(d=>{h+=`<button class="diff-btn ${dv===d?DIFF_CSS[d]:''}" onclick="setDiff(${currentWeek},'${bl.id}',${d})">${DIFF_LABELS[d]}</button>`});h+=`</div><textarea class="notes-input" rows="1" placeholder="Notes..." onchange="saveNotes(${currentWeek},'${bl.id}',this.value)" onfocus="this.rows=2" onblur="if(!this.value)this.rows=1">${ws.notes||''}</textarea></div></div>`});const tot=day.blocks.length;let dn=0;day.blocks.forEach(bl=>{if(getWS(currentWeek,bl.id).done)dn++});h+=`<div style="font-size:11px;color:#888;margin-top:8px">${dn}/${tot} complete</div>`}card.innerHTML=h;c.appendChild(card)})}
function toggleExpand(w,bid,el){const k=`${w}_${bid}`;expandedBlocks[k]=!expandedBlocks[k];el.nextElementSibling.classList.toggle('open');el.querySelector('.expand-icon').classList.toggle('open')}
function toggleDone(w,bid,ch){const ws=getWS(w,bid);ws.done=ch;setWS(w,bid,ws);renderSchedule()}
function saveNotes(w,bid,n){const ws=getWS(w,bid);ws.notes=n;setWS(w,bid,ws)}
function setDiff(w,bid,d){const ws=getWS(w,bid);ws.diff=ws.diff===d?0:d;setWS(w,bid,ws);renderSchedule()}
function toggleTravel(){setTravelState(currentWeek,document.getElementById('travel-toggle').checked);renderSchedule()}
function changeWeek(dir){currentWeek=Math.max(0,Math.min(TOTAL_WEEKS-1,currentWeek+dir));renderSchedule()}
function renderTests(){const prGrid=document.getElementById('test-pr-grid');let prH='';TESTS.forEach(t=>{const r=getTestResults(t.id);if(!r.length){prH+=`<div class="pr-card"><div class="pr-value" style="color:#ccc">—</div><div class="pr-label">${t.name}</div><div class="pr-change" style="color:#888">No data</div></div>`;return}const best=t.lowerIsBetter?Math.min(...r.map(x=>x.value)):Math.max(...r.map(x=>x.value));let ch='';if(r.length>=2){const f=r[0].value,l=r[r.length-1].value,p=((l-f)/f*100).toFixed(1),imp=t.lowerIsBetter?(l<f):(l>f);ch=`<div class="pr-change" style="color:${imp?'#059669':'#dc2626'}">${imp?'▲':'▼'} ${Math.abs(p)}%</div>`}const u=t.unit==='seconds'?'s':t.unit==='inches'?'"':'';prH+=`<div class="pr-card"><div class="pr-value" style="color:${t.color}">${best}${u}</div><div class="pr-label">${t.icon} ${t.name} PR</div>${ch}</div>`});prGrid.innerHTML=prH;
document.getElementById('test-selector').innerHTML=TESTS.map(t=>`<button class="${t.id===activeTestId?'active-test':''}" onclick="selectTest('${t.id}')">${t.icon} ${t.name}</button>`).join('');
const test=TESTS.find(t=>t.id===activeTestId),results=getTestResults(test.id),cont=document.getElementById('test-content');
let html=`<div class="test-card" style="border-top-color:${test.color}"><h3>${test.icon} ${test.name}</h3><div class="test-cat" style="color:${test.color}">${test.cat} • ${test.lowerIsBetter?'Lower':'Higher'} is better • ${test.unit}</div><div class="test-protocol">${test.protocol}</div><div class="test-input-row"><div class="test-input-group"><label>Test Week</label><select id="test-week-select">`;TEST_WEEKS.forEach(w=>{const d=getWeekDates(w),has=results.some(r=>r.week===w);html+=`<option value="${w}">Wk ${w+1} (${fmtDate(d[0])})${has?' ✓':''}</option>`});html+=`</select></div><div class="test-input-group"><label>Result (${test.unit})</label><input type="number" step="any" id="test-value-input" placeholder="Enter result" inputmode="decimal"></div><button class="save-test-btn" onclick="saveTest('${test.id}')">Save</button><span class="save-msg" id="save-msg">Saved!</span></div></div>`;
if(results.length>0){const pv=test.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));html+=`<div class="chart-container"><h3>History</h3><table class="results-table"><thead><tr><th>Week</th><th>Date</th><th>Result</th><th>Δ</th><th></th></tr></thead><tbody>`;results.forEach((r,i)=>{const d=getWeekDates(r.week),isPR=r.value===pv;let ch='';if(i>0){const prev=results[i-1].value,diff=r.value-prev,pct=((diff/prev)*100).toFixed(1),imp=test.lowerIsBetter?(diff<0):(diff>0);ch=`<span class="improve-badge ${imp?'improve-up':'improve-down'}">${imp?'▲':'▼'} ${Math.abs(pct)}%</span>`}else ch='<span style="color:#888;font-size:11px">Base</span>';html+=`<tr><td>Wk ${r.week+1}</td><td>${fmtDate(d[0])}</td><td><strong>${r.value}</strong> ${test.unit}${isPR?' <span class="pr-badge">PR!</span>':''}</td><td>${ch}</td><td><button class="delete-btn" onclick="deleteTest('${test.id}',${r.week})">✕</button></td></tr>`});html+=`</tbody></table></div><div class="chart-container"><h3>Progress</h3><div class="chart-wrap-test"><canvas id="testProgressChart"></canvas></div></div>`}else html+=`<div class="no-data-msg">No results yet. Run your first test!</div>`;cont.innerHTML=html;
if(results.length>0){const pv=test.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));new Chart(document.getElementById('testProgressChart').getContext('2d'),{type:'line',data:{labels:results.map(r=>'Wk '+(r.week+1)),datasets:[{label:test.name,data:results.map(r=>r.value),borderColor:test.color,backgroundColor:test.color+'22',fill:true,tension:.3,pointRadius:6,pointBackgroundColor:results.map(r=>r.value===pv?'#d97706':test.color),pointBorderWidth:results.map(r=>r.value===pv?3:1)}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{title:{display:true,text:test.unit},reverse:test.lowerIsBetter}},plugins:{legend:{display:false}}}})}}
function selectTest(id){activeTestId=id;renderTests()}
function saveTest(tid){const wk=parseInt(document.getElementById('test-week-select').value),val=document.getElementById('test-value-input').value;if(!val||isNaN(parseFloat(val)))return;saveTestResult(tid,wk,val);document.getElementById('test-value-input').value='';const m=document.getElementById('save-msg');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2000);renderTests()}
function deleteTest(tid,wk){deleteTestResult(tid,wk);renderTests()}
let completionChart=null,categoryChart=null,difficultyChart=null;
function getAllBlocks(phase){const p=getPrograms(phase),b=[];['monday','tuesday','wednesday','thursday','friday'].forEach(d=>{if(p[d].blocks)p[d].blocks.forEach(bl=>b.push({...bl}))});return b}
function getCatDiffHistory(cat){const h=[];for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w)){h.push(null);continue}const bl=getAllBlocks(getPhase(w)).filter(b=>b.cat===cat);let s=0,c=0;bl.forEach(b=>{const ws=getWS(w,b.id);if(ws.diff>0){s+=ws.diff;c++}});h.push(c>0?s/c:null)}return h}
function getRecentTrend(cat){const h=getCatDiffHistory(cat).filter(v=>v!==null);if(h.length<2)return{trend:'unknown',avg:h.length?h[h.length-1]:0};const r=h.slice(-3),f=r[0],l=r[r.length-1],a=r.reduce((s,v)=>s+v,0)/r.length;return{trend:l-f>=.4?'getting_harder':f-l>=.4?'getting_easier':'flat',avg:a}}
function renderProgress(){let tB=0,cB=0;const cs={};Object.keys(CATEGORIES).forEach(c=>{cs[c]={total:0,done:0}});const wr=[];for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w)){wr.push(null);continue}const bl=getAllBlocks(getPhase(w));let wT=0,wD=0;bl.forEach(b=>{tB++;wT++;cs[b.cat].total++;if(getWS(w,b.id).done){cB++;wD++;cs[b.cat].done++}});wr.push(wT>0?Math.round(wD/wT*100):0)}const pct=tB>0?Math.round(cB/tB*100):0;let streak=0;for(let w=getCurrentWeekIdx();w>=0;w--){if(isTravel(w))continue;const bl=getAllBlocks(getPhase(w));if(bl.every(b=>getWS(w,b.id).done)&&bl.length>0)streak++;else if(w<getCurrentWeekIdx())break}let tR=0;for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{if(getWS(w,b.id).diff>0)tR++})}
document.getElementById('stat-cards').innerHTML=`<div class="stat-card"><div class="stat-value" style="color:#2d6a4f">${pct}%</div><div class="stat-label">Completion</div></div><div class="stat-card"><div class="stat-value" style="color:#2563eb">${cB}</div><div class="stat-label">Blocks Done</div></div><div class="stat-card"><div class="stat-value" style="color:#d97706">${tR}</div><div class="stat-label">Ratings</div></div><div class="stat-card"><div class="stat-value" style="color:#7c3aed">${streak}</div><div class="stat-label">Week Streak</div></div>`;
const x1=document.getElementById('completionChart').getContext('2d');if(completionChart)completionChart.destroy();completionChart=new Chart(x1,{type:'bar',data:{labels:wr.map((_,i)=>`Wk ${i+1}`),datasets:[{data:wr.map(v=>v===null?0:v),backgroundColor:wr.map((v,i)=>v===null?'#ffc107':i>getCurrentWeekIdx()?'#e5e7eb':v>=80?'#2d6a4f':v>=50?'#a7c4b5':'#f87171'),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}}});
const x2=document.getElementById('categoryChart').getContext('2d');if(categoryChart)categoryChart.destroy();const ck=Object.keys(CATEGORIES);categoryChart=new Chart(x2,{type:'radar',data:{labels:ck.map(k=>CATEGORIES[k].label),datasets:[{data:ck.map(k=>cs[k].total>0?Math.round(cs[k].done/cs[k].total*100):0),backgroundColor:'rgba(45,106,79,0.2)',borderColor:'#2d6a4f',pointBackgroundColor:ck.map(k=>CATEGORIES[k].color),pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{display:false}}},plugins:{legend:{display:false}}}});
const x3=document.getElementById('difficultyChart').getContext('2d');if(difficultyChart)difficultyChart.destroy();difficultyChart=new Chart(x3,{type:'line',data:{labels:Array.from({length:TOTAL_WEEKS},(_,i)=>`Wk ${i+1}`),datasets:ck.map(k=>({label:CATEGORIES[k].label,data:getCatDiffHistory(k).map(v=>v===null?null:Math.round(v*100)/100),borderColor:CATEGORIES[k].color,backgroundColor:CATEGORIES[k].color+'33',tension:.3,spanGaps:true,pointRadius:4}))},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:.5,max:3.5,ticks:{callback:v=>{if(v===1)return'Easy';if(v===2)return'Right';if(v===3)return'Hard';return''}}}},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}})}
function renderInsights(){const c=document.getElementById('insights-section');const cs={};Object.keys(CATEGORIES).forEach(k=>{cs[k]={total:0,done:0,notes:[],diffs:[]}});const wc=Math.min(getCurrentWeekIdx()+1,TOTAL_WEEKS);for(let w=0;w<wc;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{cs[b.cat].total++;const ws=getWS(w,b.id);if(ws.done)cs[b.cat].done++;if(ws.notes)cs[b.cat].notes.push(ws.notes);if(ws.diff>0)cs[b.cat].diffs.push(ws.diff)})}
let html='<h3 style="font-size:16px;font-weight:600;margin-bottom:12px">Training Insights</h3>';const cr=Object.keys(CATEGORIES).map(k=>({key:k,label:CATEGORIES[k].label,rate:cs[k].total>0?cs[k].done/cs[k].total:0,total:cs[k].total,done:cs[k].done,diffs:cs[k].diffs})).filter(x=>x.total>0).sort((a,b)=>b.rate-a.rate);const td=cr.reduce((s,x)=>s+x.diffs.length,0);const ti=getTestInsights();if(ti)html+=ti;
if(cr.length===0){html+=`<div class="insight-card"><h4>No data yet</h4><p>Start checking off workouts.</p></div>`;c.innerHTML=html;return}
if(td>=2){html+='<h3 style="font-size:15px;font-weight:600;margin:16px 0 10px">Adaptive Recommendations</h3>';Object.keys(CATEGORIES).forEach(cat=>{const t=getRecentTrend(cat),st=cs[cat];if(st.diffs.length<2)return;const rd=st.diffs.slice(-4),ra=rd.reduce((s,v)=>s+v,0)/rd.length,ec=rd.filter(d=>d===1).length,rc=rd.filter(d=>d===2).length,hc=rd.filter(d=>d===3).length;let rt='',rT='',rB='',tI='',tc='';if(ra<=1.4||(ec>=3&&hc===0)){rt='progress-up';tI='↑';tc='trend-down';rT=`${CATEGORIES[cat].label}: Ready to Progress`;rB=getProgRec(cat)}else if(ra>=2.7||(hc>=3&&ec===0)){rt='caution';tI='↓';tc='trend-up';rT=`${CATEGORIES[cat].label}: Scale Back`;rB=getDeloadRec(cat)}else if(t.trend==='getting_harder'&&ra>=2.3){rt='warning';tI='⚠';tc='trend-up';rT=`${CATEGORIES[cat].label}: Getting Harder`;rB=`<span class="rec-tag rec-adjust">WATCH</span> Monitor one more week.`}else if(t.trend==='getting_easier'){rt='progress-up';tI='✓';tc='trend-down';rT=`${CATEGORIES[cat].label}: Adapting`;rB=`<span class="rec-tag rec-maintain">ADAPTING</span> Stay the course until consistently "Too Easy."`}else if(rc>=2){rt='';tI='→';tc='trend-flat';rT=`${CATEGORIES[cat].label}: On Track`;rB='Difficulty feels right.'}else if(ec>=1&&hc>=1){rt='warning';tI='~';tc='trend-flat';rT=`${CATEGORIES[cat].label}: Mixed`;rB=`<span class="rec-tag rec-adjust">MIXED</span> Check sleep, prior day, time of day.`}if(rT)html+=`<div class="insight-card ${rt}"><h4><span class="trend-arrow ${tc}">${tI}</span> ${rT}</h4><p>${rB}</p></div>`})}else if(td>0)html+=`<div class="insight-card"><h4>Keep Rating!</h4><p>Need more data for adaptive recs.</p></div>`;else html+=`<div class="insight-card warning"><h4>Rate Your Workouts</h4><p>Use the difficulty buttons!</p></div>`;
html+='<h3 style="font-size:15px;font-weight:600;margin:20px 0 10px">Completion</h3>';const best=cr[0],worst=cr[cr.length-1];if(best.rate>0)html+=`<div class="insight-card strength-insight"><h4>Strongest: ${best.label}</h4><p>${Math.round(best.rate*100)}%</p></div>`;if(worst.rate<best.rate){const adv={sprint:'Earlier in day or pair with soccer.',cardio:'Even 15 min counts.',soccer:'10 min wall passes adds up.',strength:'Just show up.',mobility:'Tack 5 min onto other sessions.',corrective:'5 min a day makes a big difference.'};html+=`<div class="insight-card warning"><h4>Needs Work: ${worst.label}</h4><p>${Math.round(worst.rate*100)}%. ${adv[worst.key]||''}</p></div>`}
const ov=cr.reduce((s,x)=>s+x.done,0)/Math.max(cr.reduce((s,x)=>s+x.total,0),1);if(ov>=.8)html+=`<div class="insight-card"><h4>Excellent!</h4><p>Over 80%. Check adaptive recs to level up.</p></div>`;else if(ov>=.5)html+=`<div class="insight-card"><h4>Solid</h4><p>${Math.round(ov*100)}%. Make easy sessions non-negotiable.</p></div>`;else if(ov>0)html+=`<div class="insight-card warning"><h4>Building</h4><p>Under 50%. Focus on 3 blocks/day.</p></div>`;
const wn=getCurrentWeekIdx()+1;if(wn>=4&&wn<8)html+=`<div class="insight-card strength-insight"><h4>Phase 2</h4><p>Should feel harder — by design.</p></div>`;if(wn>=8)html+=`<div class="insight-card strength-insight"><h4>Preseason</h4><p>${TOTAL_WEEKS-wn+1} weeks left. Sharpen, don't add.</p></div>`;c.innerHTML=html}
function getTestInsights(){let html='',any=false;TESTS.forEach(t=>{const r=getTestResults(t.id);if(r.length<2)return;any=true;const f=r[0].value,l=r[r.length-1].value,p=((l-f)/f*100).toFixed(1),imp=t.lowerIsBetter?(l<f):(l>f),stag=Math.abs(p)<1;if(imp&&Math.abs(p)>=5)html+=`<div class="insight-card progress-up"><h4>${t.icon} ${t.name}: ${Math.abs(p)}% Better!</h4><p>${getTPT(t.id)}</p></div>`;else if(!imp&&Math.abs(p)>=3)html+=`<div class="insight-card caution"><h4>${t.icon} ${t.name}: Wrong Direction</h4><p>${getTRT(t.id)}</p></div>`;else if(stag&&r.length>=3)html+=`<div class="insight-card warning"><h4>${t.icon} ${t.name}: Plateau</h4><p>${getTPP(t.id)}</p></div>`});return any?'<h3 style="font-size:15px;font-weight:600;margin:0 0 10px">Test Insights</h3>'+html:''}
function getTPT(id){return{sprint_30m:'Acceleration improving. Keep building mechanics.',broad_jump:'Explosive power developing from plyos.',six_min_run:'Aerobic base growing. Big for XC season.',juggling:'Ball control improving. Try weak-foot-only sessions.',squat_hold:'Ankle, hip, and thoracic mobility all improving. Fewer injuries ahead.',shuttle_5_10_5:'Direction changes getting faster. Great for soccer.'}[id]||''}
function getTRT(id){return{sprint_30m:'Possible fatigue. Ensure speed days follow rest. Consider lighter week.',broad_jump:'Leg power dipping. Check recovery — maybe too much running + lifting.',six_min_run:'Aerobic capacity down. Skipping easy runs? Check sleep/hydration.',juggling:'Technical work on fresh legs only.',squat_hold:'Losing squat depth = tightening up. Are you skipping mobility? Early warning for injury.',shuttle_5_10_5:'Agility dropping. Check mobility and recovery.'}[id]||''}
function getTPP(id){return{sprint_30m:'Try contrast training or focus on arm mechanics.',broad_jump:'Add reactive plyos (depth jumps, bounds).',six_min_run:'Add a 20 min tempo run once per week.',juggling:'Add constraints: weak foot, thigh-foot alternating, headers.',squat_hold:'Try holding a light weight as counterbalance. Shift side to side in the squat. Add banded ankle work — ankles are usually the limiter.',shuttle_5_10_5:'Work deceleration: full speed to 2-step stop at a cone.'}[id]||''}
function getProgRec(cat){return{sprint:'<span class="rec-tag rec-progress">PROGRESS</span> Add 1–2 reps, longer distance, or 15s less rest.',cardio:'<span class="rec-tag rec-progress">PROGRESS</span> +5 min runs, +1 interval rep, or -15s rest.',soccer:'<span class="rec-tag rec-progress">PROGRESS</span> Speed up drills, add defender, 50% weak foot.',strength:'<span class="rec-tag rec-progress">PROGRESS</span> Add weight, reps, or a set.',mobility:'<span class="rec-tag rec-progress">PROGRESS</span> +15s holds, deeper variations, add bands.',corrective:'<span class="rec-tag rec-progress">PROGRESS</span> Harder variations — eyes closed, longer holds, single-leg.'}[cat]||''}
function getDeloadRec(cat){return{sprint:'<span class="rec-tag rec-deload">SCALE BACK</span> -2 reps, +30s rest, 85% effort.',cardio:'<span class="rec-tag rec-deload">SCALE BACK</span> -5 min runs, -1-2 reps, +30s rest.',soccer:'<span class="rec-tag rec-deload">SCALE BACK</span> -30% drills, 2-3 per session, more fun stuff.',strength:'<span class="rec-tag rec-deload">SCALE BACK</span> -20% weight or drop a set.',mobility:'<span class="rec-tag rec-deload">SCALE BACK</span> Shorter holds, 6/10 intensity.',corrective:'<span class="rec-tag rec-deload">SCALE BACK</span> Basic versions, fewer reps, shorter holds.'}[cat]||''}
function showSection(section,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(`${section}-section`).classList.add('active');btn.classList.add('active');if(section==='progress')renderProgress();if(section==='insights')renderInsights();if(section==='tests')renderTests()}
