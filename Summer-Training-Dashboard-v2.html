<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<meta name="application-name" content="Summer Training">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMmQ2YTRmIi8+PHRleHQgeD0iOTAiIHk9IjEyNSIgZm9udC1zaXplPSIxMTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIj7wn4+LPC90ZXh0Pjwvc3ZnPg==">
<title>Summer Training Dashboard V2</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2430; --border:#2b3442;
  --green:#2d6a4f; --green-bright:#40c057; --green-glow:#52e07c;
  --red:#e5484d; --amber:#f5a524; --blue:#4dabf7;
  --text:#e6edf3; --dim:#8b949e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --cond:'Avenir Next Condensed','Arial Narrow','Helvetica Neue',var(--sans);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(45,106,79,.28),transparent),
    radial-gradient(ellipse 60% 40% at 95% 110%,rgba(45,106,79,.10),transparent);
  padding:12px 12px 92px;
  padding-top:max(12px,env(safe-area-inset-top));
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto;
}
.num{font-family:var(--cond);font-weight:800;letter-spacing:.5px}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.dim{color:var(--dim)}
/* ===== header ===== */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--green),#1b4332);box-shadow:0 0 18px rgba(45,106,79,.55)}
.logo h1{font-size:18px;letter-spacing:1px;text-transform:uppercase;font-weight:800;line-height:1.15}
.logo h1 span{color:var(--green-bright)}
.logo .sub{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.pill{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;color:var(--dim);font-weight:700}
.pill.p1{color:var(--blue);border-color:rgba(77,171,247,.4)}
.pill.p2{color:var(--amber);border-color:rgba(245,165,36,.4)}
.pill.p3{color:#f783ac;border-color:rgba(247,131,172,.4)}
/* ===== tabs ===== */
.tab{display:none}.tab.active{display:block}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:4px;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom-nav button{flex:1;max-width:150px;background:none;border:none;border-radius:10px;padding:6px 4px;cursor:pointer;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav button .ic{font-size:19px;line-height:1;filter:grayscale(60%);opacity:.75}
.bottom-nav button.active{color:var(--green-glow);background:rgba(64,192,87,.10)}
.bottom-nav button.active .ic{filter:none;opacity:1}
/* ===== week strip ===== */
.strip-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.week-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;flex:1;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.wk{position:relative;flex:0 0 auto;width:46px;height:52px;background:none;border:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:center}
.wk svg{display:block}
.wk .wk-label{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim)}
.wk.sel .wk-label{color:#fff}
.wk.is-today .wk-label{color:var(--green-glow)}
.wk.sel{background:rgba(64,192,87,.10);border-radius:10px}
.wk .wk-test{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue)}
.today-btn{flex:0 0 auto;font-family:var(--cond);font-weight:800;letter-spacing:1px;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--green-bright),var(--green));border:none;border-radius:10px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 14px rgba(64,192,87,.35)}
.today-btn:active{transform:scale(.95)}
/* ===== day chips ===== */
.day-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.dc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px 0 4px;cursor:pointer;text-align:center;color:var(--dim)}
.dc .dc-d{display:block;font-size:10px;font-weight:700;letter-spacing:1px}
.dc .dc-n{display:block;font-size:16px;color:var(--text)}
.dc.rest{opacity:.55}
.dc.sel{border-color:var(--green-bright);background:rgba(64,192,87,.12);color:var(--green-glow)}
.dc.sel .dc-n{color:var(--green-glow)}
.dc.alldone .dc-d::after{content:' ✓';color:var(--green-bright)}
/* ===== banners ===== */
.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:10px;border:1px solid var(--border);background:var(--bg2)}
.banner.test{border-color:rgba(77,171,247,.5);background:rgba(77,171,247,.08)}
.banner.test b{color:var(--blue)}
.banner.status{border-color:rgba(245,165,36,.5);background:rgba(245,165,36,.07)}
.banner .jump-pr{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px}
/* ===== travel toggle ===== */
.travel-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.travel-row label.txt{font-size:12px;color:var(--dim)}
.toggle-switch{position:relative;width:44px;height:24px;flex:0 0 auto}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg3);border:1px solid var(--border);border-radius:24px;transition:.3s}
.toggle-slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:var(--dim);border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:rgba(245,165,36,.3);border-color:var(--amber)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px);background:var(--amber)}
/* ===== day view ===== */
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:2px}
.day-name{font-size:34px;line-height:1;text-transform:uppercase}
.day-sub{font-size:12px;color:var(--dim);margin-top:3px}
.day-sub .phase-txt{font-weight:700}
.phase-txt.p1{color:var(--blue)}.phase-txt.p2{color:var(--amber)}.phase-txt.p3{color:#f783ac}
.day-count{font-size:26px;color:var(--green-bright);white-space:nowrap}
.day-count small{font-size:12px;color:var(--dim);font-family:var(--sans);font-weight:600}
.day-cue{font-size:12.5px;color:var(--dim);font-style:italic;margin:6px 0 10px}
.day-theme{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green-bright);margin-bottom:10px}
.warmup{background:rgba(45,106,79,.10);border:1px dashed rgba(64,192,87,.35);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.warmup .wu-tag{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--green-bright)}
.warmup p{font-size:12px;color:var(--dim);margin-top:2px}
.rest-card{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 16px;margin-bottom:10px}
.rest-card .rc-icon{font-size:30px}
.rest-card b{font-size:15px}
.rest-card p{font-size:12.5px;color:var(--dim)}
.mini-note{font-size:12px;color:var(--dim);background:var(--bg2);border-left:3px solid var(--green);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.test-banner{font-size:13px;background:rgba(77,171,247,.08);border:1px solid rgba(77,171,247,.5);border-radius:10px;padding:9px 12px;margin-bottom:10px}
/* ===== workout blocks ===== */
.blk{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--cat,var(--border));border-radius:12px;margin-bottom:8px;overflow:hidden}
.blk.done{border-color:rgba(64,192,87,.45);border-left-color:var(--green-bright);background:linear-gradient(90deg,rgba(64,192,87,.07),var(--bg2) 40%)}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.chk{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:2px solid var(--border);background:var(--bg3);color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk.on{background:linear-gradient(135deg,var(--green-bright),var(--green));border-color:var(--green-bright);box-shadow:0 0 10px rgba(64,192,87,.5)}
.chk:active{transform:scale(.88)}
.blk-main{flex:1;cursor:pointer;min-width:0}
.cat-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;vertical-align:middle;margin-right:6px}
.blk-title{font-size:13.5px;font-weight:700;margin-top:2px}
.blk.done .blk-title{color:var(--dim);text-decoration:line-through}
.diff-ind{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.ind-easy{background:var(--green-bright)}.ind-right{background:var(--blue)}.ind-hard{background:var(--red)}
.chev{color:var(--dim);font-size:12px;cursor:pointer;padding:6px;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.blk-body{display:none;padding:0 12px 12px;border-top:1px solid var(--border)}
.blk-body.open{display:block}
.ex-list{list-style:none;margin:8px 0 4px}
.ex-list li{padding:7px 0;border-bottom:1px solid rgba(43,52,66,.6);font-size:12.5px}
.ex-list li:last-child{border-bottom:none}
.ex-name{font-weight:600;color:var(--text)}
.ex-rx{color:var(--green-glow);font-family:var(--mono);font-size:11.5px;margin-left:6px}
.ex-note{display:block;font-size:11px;color:var(--dim);font-style:italic;margin-top:1px}
.vid-link{color:var(--dim);font-size:9px;text-decoration:none;margin-left:5px;padding:2px 5px;border:1px solid var(--border);border-radius:5px;display:inline-block;line-height:1.2;vertical-align:middle}
.vid-link:active{color:var(--red);border-color:var(--red)}
.diff-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.diff-lab{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.diff-btn{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border);font-size:11.5px;font-weight:700;cursor:pointer;background:var(--bg3);color:var(--dim);transition:all .15s}
.diff-btn:active{transform:scale(.94)}
.diff-btn.selected-easy{background:rgba(64,192,87,.15);border-color:var(--green-bright);color:var(--green-glow)}
.diff-btn.selected-right{background:rgba(77,171,247,.15);border-color:var(--blue);color:var(--blue)}
.diff-btn.selected-hard{background:rgba(229,72,77,.15);border-color:var(--red);color:var(--red)}
.notes{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;resize:none;-webkit-appearance:none}
.notes:focus{outline:none;border-color:var(--green-bright)}
/* ===== weekly focus (mindset video) ===== */
.week-focus{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--green-bright);border-radius:12px;padding:12px 14px;margin:14px 0}
.week-focus .wf-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.week-focus .wf-label{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--green-bright);text-transform:uppercase}
.week-focus .wf-theme{font-size:9px;font-weight:800;letter-spacing:1px;background:var(--green);color:#fff;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.week-focus .wf-title{font-size:15px;font-weight:800}
.week-focus .wf-text{font-size:12.5px;color:var(--dim);margin:2px 0 10px}
.week-focus .wf-video{position:relative;width:100%;padding-bottom:56.25%;border-radius:10px;overflow:hidden;background:#000}
.week-focus .wf-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
/* ===== PR wall ===== */
.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.pr-card{position:relative;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--tc,var(--border));border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:block}
.pr-card.sel{border-color:var(--tc);box-shadow:0 0 14px color-mix(in srgb,var(--tc) 30%,transparent);background:var(--bg3)}
.pr-name{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pr-best{font-size:34px;line-height:1.05}
.pr-best.dim{color:var(--border)}
.pr-sub{font-size:12px;margin:4px 0 6px}
.pr-delta.good,.pr-base.good{color:var(--green-glow);font-weight:700}
.pr-delta.bad,.pr-base.bad{color:var(--red);font-weight:700}
.pr-baseline{font-size:10.5px;margin-top:5px}
.spark{width:100%;height:34px;display:block;opacity:.9}
.section-title{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:4px 0 10px}
/* ===== panels / progress ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h3{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.statBox{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.statBox .v{font-family:var(--cond);font-size:30px;font-weight:800;line-height:1.1}
.statBox .l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.honest-note{grid-column:1/-1;font-size:11px;color:var(--dim);text-align:center;padding:2px 0 0}
.wbars{display:flex;align-items:flex-end;gap:6px;height:130px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.wb-v{font-size:10px;color:var(--dim)}
.wb-bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:10px}
.wb-bar.hi{background:linear-gradient(180deg,var(--green-glow),var(--green))}
.wb-bar.mid{background:linear-gradient(180deg,#7dbb96,#3f6b54)}
.wb-bar.lo{background:linear-gradient(180deg,var(--red),#8a2b2e)}
.wb-bar.travel{background:repeating-linear-gradient(45deg,rgba(245,165,36,.25),rgba(245,165,36,.25) 4px,transparent 4px,transparent 8px);border:1px dashed rgba(245,165,36,.5);color:var(--amber)}
.wb-l{font-size:10px;color:var(--dim);font-weight:700}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cat-row .cl{width:74px;font-size:11px;font-weight:700;flex:0 0 auto}
.cat-row .ctrack{flex:1;height:12px;background:var(--bg3);border-radius:999px;overflow:hidden}
.cat-row .cfill{height:100%;border-radius:999px}
.cat-row .cv{width:66px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:0 0 auto}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--dim);font-size:9px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend span{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
/* ===== insights (classes used by ported logic) ===== */
.insight-card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--green-bright);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.insight-card.warning{border-left-color:var(--amber)}
.insight-card.caution{border-left-color:var(--red)}
.insight-card.strength-insight{border-left-color:var(--blue)}
.insight-card.progress-up{border-left-color:var(--green-glow)}
.insight-card h4{font-size:13.5px;font-weight:700;margin-bottom:3px}
.insight-card p{font-size:12.5px;color:var(--dim)}
.insight-card ul{margin:6px 0 0 16px;font-size:12.5px;color:var(--dim)}
.rec-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:9px;font-weight:800;margin-right:4px;letter-spacing:.5px}
.rec-progress{background:rgba(64,192,87,.18);color:var(--green-glow)}
.rec-maintain{background:rgba(77,171,247,.18);color:var(--blue)}
.rec-deload{background:rgba(229,72,77,.18);color:var(--red)}
.rec-adjust{background:rgba(245,165,36,.18);color:var(--amber)}
.trend-arrow{font-size:14px;margin-right:4px}
.trend-up{color:var(--red)}.trend-down{color:var(--green-bright)}.trend-flat{color:var(--blue)}
/* ===== PR detail / tests ===== */
.pr-panel{border-top:3px solid var(--tc,var(--border))}
.pr-panel h3.tname{font-size:16px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--text);margin-bottom:0}
.pr-meta{font-size:11px;font-weight:700;color:var(--dim);margin:2px 0 12px;letter-spacing:.5px}
.entry-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.inp-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
.inp-group label{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.inp-group select,.inp-group input{padding:10px 12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;font-size:16px;font-family:inherit;width:100%;-webkit-appearance:none}
.inp-group input:focus,.inp-group select:focus{outline:none;border-color:var(--green-bright)}
.save-btn{padding:11px 20px;background:linear-gradient(135deg,var(--green-bright),var(--green));color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 2px 12px rgba(64,192,87,.35)}
.save-btn:active{transform:scale(.96)}
.save-msg{font-size:12px;color:var(--green-glow);font-weight:700;opacity:0;transition:opacity .3s;align-self:center}
.save-msg.show{opacity:1}
.results-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px}
.results-table th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--border);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.results-table td{padding:8px;border-bottom:1px solid rgba(43,52,66,.6)}
.pr-badge{display:inline-block;background:rgba(245,165,36,.18);color:var(--amber);font-size:9px;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:4px}
.improve-badge{font-size:11px;font-weight:700;margin-left:4px}
.improve-up{color:var(--green-glow)}.improve-down{color:var(--red)}
.delete-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:4px 8px}
.delete-btn:active{color:var(--red)}
.proto{margin-top:8px}
.proto summary{font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;padding:6px 0;list-style:none}
.proto summary::before{content:'▸ '}
.proto[open] summary::before{content:'▾ '}
.proto-body{font-size:12.5px;color:var(--dim);line-height:1.6;padding:8px 0 4px}
.proto-body strong{color:var(--text)}

function getAllBlocks(phase){const p=getPrograms(phase),b=[];['monday','tuesday','wednesday','thursday','friday'].forEach(d=>{if(p[d].blocks)p[d].blocks.forEach(bl=>b.push({...bl}))});return b}
function getCatDiffHistory(cat){const h=[];for(let w=0;w<TOTAL_WEEKS;w++){if(isTravel(w)){h.push(null);continue}const bl=getAllBlocks(getPhase(w)).filter(b=>b.cat===cat);let s=0,c=0;bl.forEach(b=>{const ws=getWS(w,b.id);if(ws.diff>0){s+=ws.diff;c++}});h.push(c>0?s/c:null)}return h}
function getRecentTrend(cat){const h=getCatDiffHistory(cat).filter(v=>v!==null);if(h.length<2)return{trend:'unknown',avg:h.length?h[h.length-1]:0};const r=h.slice(-3),f=r[0],l=r[r.length-1],a=r.reduce((s,v)=>s+v,0)/r.length;return{trend:l-f>=.4?'getting_harder':f-l>=.4?'getting_easier':'flat',avg:a}}
function renderInsights(){const c=document.getElementById('insights-section');const cs={};Object.keys(CATEGORIES).forEach(k=>{cs[k]={total:0,done:0,notes:[],diffs:[]}});const wc=Math.min(getCurrentWeekIdx()+1,TOTAL_WEEKS);for(let w=0;w<wc;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{cs[b.cat].total++;const ws=getWS(w,b.id);if(ws.done)cs[b.cat].done++;if(ws.notes)cs[b.cat].notes.push(ws.notes);if(ws.diff>0)cs[b.cat].diffs.push(ws.diff)})}
let html='<h3 style="font-size:16px;font-weight:600;margin-bottom:12px">Training Insights</h3>';const cr=Object.keys(CATEGORIES).map(k=>({key:k,label:CATEGORIES[k].label,rate:cs[k].total>0?cs[k].done/cs[k].total:0,total:cs[k].total,done:cs[k].done,diffs:cs[k].diffs})).filter(x=>x.total>0).sort((a,b)=>b.rate-a.rate);const td=cr.reduce((s,x)=>s+x.diffs.length,0);const ti=getTestInsights();if(ti)html+=ti;
if(cr.length===0){html+=`<div class="insight-card"><h4>No data yet</h4><p>Start checking off workouts.</p></div>`;c.innerHTML=html;return}
if(td>=2){html+='<h3 style="font-size:15px;font-weight:600;margin:16px 0 10px">Adaptive Recommendations</h3>';Object.keys(CATEGORIES).forEach(cat=>{const t=getRecentTrend(cat),st=cs[cat];if(st.diffs.length<2)return;const rd=st.diffs.slice(-4),ra=rd.reduce((s,v)=>s+v,0)/rd.length,ec=rd.filter(d=>d===1).length,rc=rd.filter(d=>d===2).length,hc=rd.filter(d=>d===3).length;let rt='',rT='',rB='',tI='',tc='';if(ra<=1.4||(ec>=3&&hc===0)){rt='progress-up';tI='↑';tc='trend-down';rT=`${CATEGORIES[cat].label}: Ready to Progress`;rB=getProgRec(cat)}else if(ra>=2.7||(hc>=3&&ec===0)){rt='caution';tI='↓';tc='trend-up';rT=`${CATEGORIES[cat].label}: Scale Back`;rB=getDeloadRec(cat)}else if(t.trend==='getting_harder'&&ra>=2.3){rt='warning';tI='⚠';tc='trend-up';rT=`${CATEGORIES[cat].label}: Getting Harder`;rB=`<span class="rec-tag rec-adjust">WATCH</span> Monitor one more week.`}else if(t.trend==='getting_easier'){rt='progress-up';tI='✓';tc='trend-down';rT=`${CATEGORIES[cat].label}: Adapting`;rB=`<span class="rec-tag rec-maintain">ADAPTING</span> Stay the course until consistently "Too Easy."`}else if(rc>=2){rt='';tI='→';tc='trend-flat';rT=`${CATEGORIES[cat].label}: On Track`;rB='Difficulty feels right.'}else if(ec>=1&&hc>=1){rt='warning';tI='~';tc='trend-flat';rT=`${CATEGORIES[cat].label}: Mixed`;rB=`<span class="rec-tag rec-adjust">MIXED</span> Check sleep, prior day, time of day.`}if(rT)html+=`<div class="insight-card ${rt}"><h4><span class="trend-arrow ${tc}">${tI}</span> ${rT}</h4><p>${rB}</p></div>`})}else if(td>0)html+=`<div class="insight-card"><h4>Keep Rating!</h4><p>Need more data for adaptive recs.</p></div>`;else html+=`<div class="insight-card warning"><h4>Rate Your Workouts</h4><p>Use the difficulty buttons!</p></div>`;
html+='<h3 style="font-size:15px;font-weight:600;margin:20px 0 10px">Completion</h3>';const best=cr[0],worst=cr[cr.length-1];if(best.rate>0)html+=`<div class="insight-card strength-insight"><h4>Strongest: ${best.label}</h4><p>${Math.round(best.rate*100)}%</p></div>`;if(worst.rate<best.rate){const adv={sprint:'Earlier in day or pair with soccer.',cardio:'Even 15 min counts.',soccer:'10 min wall passes adds up.',strength:'Just show up.',mobility:'Tack 5 min onto other sessions.',corrective:'5 min a day makes a big difference.'};html+=`<div class="insight-card warning"><h4>Needs Work: ${worst.label}</h4><p>${Math.round(worst.rate*100)}%. ${adv[worst.key]||''}</p></div>`}
const ov=cr.reduce((s,x)=>s+x.done,0)/Math.max(cr.reduce((s,x)=>s+x.total,0),1);if(ov>=.8)html+=`<div class="insight-card"><h4>Excellent!</h4><p>Over 80%. Check adaptive recs to level up.</p></div>`;else if(ov>=.5)html+=`<div class="insight-card"><h4>Solid</h4><p>${Math.round(ov*100)}%. Make easy sessions non-negotiable.</p></div>`;else if(ov>0)html+=`<div class="insight-card warning"><h4>Building</h4><p>Under 50%. Focus on 3 blocks/day.</p></div>`;
const wn=getCurrentWeekIdx()+1;if(wn>=4&&wn<8)html+=`<div class="insight-card strength-insight"><h4>Phase 2</h4><p>Should feel harder — by design.</p></div>`;if(wn>=8)html+=`<div class="insight-card strength-insight"><h4>Preseason</h4><p>${TOTAL_WEEKS-wn+1} weeks left. Sharpen, don't add.</p></div>`;c.innerHTML=html}
function getTestInsights(){let html='',any=false;TESTS.forEach(t=>{const r=getTestResults(t.id);if(r.length<2)return;any=true;const f=r[0].value,l=r[r.length-1].value,p=((l-f)/f*100).toFixed(1),imp=t.lowerIsBetter?(l<f):(l>f),stag=Math.abs(p)<1;if(imp&&Math.abs(p)>=5)html+=`<div class="insight-card progress-up"><h4>${t.icon} ${t.name}: ${Math.abs(p)}% Better!</h4><p>${getTPT(t.id)}</p></div>`;else if(!imp&&Math.abs(p)>=3)html+=`<div class="insight-card caution"><h4>${t.icon} ${t.name}: Wrong Direction</h4><p>${getTRT(t.id)}</p></div>`;else if(stag&&r.length>=3)html+=`<div class="insight-card warning"><h4>${t.icon} ${t.name}: Plateau</h4><p>${getTPP(t.id)}</p></div>`});return any?'<h3 style="font-size:15px;font-weight:600;margin:0 0 10px">Test Insights</h3>'+html:''}

function renderHome(){
  const pi=getPhaseLabel(currentWeek),pp=document.getElementById('phase-pill');
  pp.textContent=pi.label;pp.className='pill p'+getPhase(currentWeek);
  const tOff=todayOffset(),todayW=(tOff>=0&&tOff<=TOTAL_WEEKS*7-1)?Math.floor(tOff/7):-1,todayD=todayW>=0?tOff%7:-1;
  /* week strip */
  let sh='';
  for(let w=0;w<TOTAL_WEEKS;w++){
    const wc=weekCompletion(w),pct=wc.total?wc.done/wc.total:0,tv=isTravel(w);
    sh+=`<button class="wk${w===currentWeek?' sel':''}${w===todayW?' is-today':''}" onclick="jumpWeek(${w})">${ringSVG(tv?0:pct,44,4,tv?'var(--amber)':pct>=1?'var(--green-glow)':'var(--green-bright)')}<span class="wk-label num">${tv?'✈':'W'+(w+1)}</span>${TEST_WEEKS.includes(w)?'<span class="wk-test"></span>':''}</button>`}
  document.getElementById('week-strip').innerHTML=sh;
  const selEl=document.querySelector('.wk.sel');
  if(selEl&&selEl.scrollIntoView){try{selEl.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}}
  /* day chips */
  const dates=getWeekDates(currentWeek),prg=getPrograms(getPhase(currentWeek));
  let dh='';
  for(let i=0;i<7;i++){
    const rest=i>4;let allDone=false;
    if(!rest){const bl=prg[DAY_KEYS[i]].blocks;allDone=bl.length>0&&bl.every(b=>getWS(currentWeek,b.id).done)}
    dh+=`<button class="dc${i===currentDay?' sel':''}${rest?' rest':''}${allDone?' alldone':''}" onclick="jumpDay(${i})"><span class="dc-d">${DAY_SHORT[i]}</span><span class="dc-n num">${dates[i].getDate()}</span></button>`}
  document.getElementById('day-chips').innerHTML=dh;
  /* banners */
  const isTW=TEST_WEEKS.includes(currentWeek);let bh='';
  if(programStatus==='pre')bh+=`<div class="banner status">⏳ Program starts <b>May 25</b>. Showing Week 1.</div>`;
  if(programStatus==='post')bh+=`<div class="banner status">🎉 <b>Program complete!</b> All 11 weeks are in the books — check the PR Wall.</div>`;
  if(isTW)bh+=`<div class="banner test">📋 <b>Test Week ${TEST_WEEKS.indexOf(currentWeek)+1}/6</b> — time to set some PRs. <button class="jump-pr" onclick="showTab('pr')">PR Wall →</button></div>`;
  document.getElementById('home-banners').innerHTML=bh;
  /* travel toggle */
  document.getElementById('travel-toggle').checked=isTravel(currentWeek);
  /* day view */
  const tv=isTravel(currentWeek),phase=getPhase(currentWeek),day=prg[DAY_KEYS[currentDay]];
  const isToday=(currentWeek===todayW&&currentDay===todayD);
  let dn=0,tot=0;
  if(!day.rest&&!tv){day.blocks.forEach(b=>{tot++;if(getWS(currentWeek,b.id).done)dn++})}
  let h=`<div class="day-head"><div><div class="day-name num">${isToday?'TODAY · ':''}${DAY_LABELS[currentDay].toUpperCase()}</div><div class="day-sub">${fmtDate(dates[currentDay])} • Week ${currentWeek+1} • <span class="phase-txt p${phase}">Phase ${phase}</span></div></div>${tot?`<div class="day-count num">${dn}<small>/${tot} done</small></div>`:''}</div>`;
  h+=`<div class="day-cue">“${dayCue(dates[currentDay])}”</div>`;
  if(tv){
    h+=`<div class="rest-card"><div class="rc-icon">✈️</div><div><b>Travel week</b><p>Rest or do what you can!</p></div></div>`;
  }else if(day.rest){
    h+=`<div class="rest-card"><div class="rc-icon">😴</div><div><b>Rest &amp; recovery</b><p>Recovery is where the gains get locked in.</p></div></div>`;
    if(currentDay===5)h+=`<div class="mini-note">Optional easy distance run if he wants it — his call. XC already covers the weekly mileage.</div>`;
    if(currentDay===5&&isTW)h+=`<div class="test-banner">📋 <b>Test Week!</b> Run fitness tests this week.</div>`;
  }else{
    h+=`<div class="day-theme">${DAY_THEMES[currentDay]}</div>`;
    h+=`<div class="warmup"><span class="wu-tag">WARMUP</span><p>${day.warmup}</p></div>`;
    day.blocks.forEach(bl=>{
      const ws=getWS(currentWeek,bl.id),cat=CATEGORIES[bl.cat],ui=CAT_UI[bl.cat],io=expandedBlocks[`${currentWeek}_${bl.id}`],dv=ws.diff||0;
      h+=`<div class="blk${ws.done?' done':''}" style="--cat:${ui}"><div class="blk-head">`;
      h+=`<button class="chk${ws.done?' on':''}" aria-label="mark done" onclick="toggleDoneV2(${currentWeek},'${bl.id}')">${ws.done?'✓':''}</button>`;
      h+=`<div class="blk-main" onclick="toggleExpandV2(${currentWeek},'${bl.id}')"><span class="cat-tag" style="color:${ui};background:${ui}1f;border:1px solid ${ui}44">${cat.label}</span>${dv?`<span class="diff-ind ${DIFF_IND[dv]}"></span>`:''}<div class="blk-title">${bl.title}</div></div>`;
      h+=`<span class="chev${io?' open':''}" onclick="toggleExpandV2(${currentWeek},'${bl.id}')">▾</span></div>`;
      h+=`<div class="blk-body${io?' open':''}"><ul class="ex-list">`;
      bl.exercises.forEach(ex=>{
        const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.name+' exercise form');
        const vl=ex.name!=='Follow your program'?` <a href="${yt}" target="_blank" rel="noopener" class="vid-link" title="Watch how on YouTube">▶</a>`:'';
        h+=`<li><span class="ex-name">${ex.name}</span>${vl}<span class="ex-rx">${ex.rx}</span>${ex.note?`<span class="ex-note">${ex.note}</span>`:''}</li>`});
      h+=`</ul><div class="diff-row"><span class="diff-lab">How was it?</span>`;
      [1,2,3].forEach(d=>{h+=`<button class="diff-btn ${dv===d?DIFF_CSS[d]:''}" onclick="setDiffV2(${currentWeek},'${bl.id}',${d})">${DIFF_LABELS[d]}</button>`});
      h+=`</div><textarea class="notes" rows="1" placeholder="Notes…" onchange="saveNotesV2(${currentWeek},'${bl.id}',this.value)" onfocus="this.rows=2" onblur="if(!this.value)this.rows=1">${ws.notes||''}</textarea></div></div>`});
  }
  document.getElementById('day-view').innerHTML=h;
  /* weekly mindset video — only rebuild when the week changes (avoid iframe reloads) */
  if(lastFocusWeek!==currentWeek){document.getElementById('focus-wrap').innerHTML=weekFocusHTML(currentWeek);lastFocusWeek=currentWeek}
}
function jumpWeek(w){currentWeek=w;renderHome()}
function jumpDay(d){currentDay=d;renderHome()}
function toggleDoneV2(w,bid){const ws=getWS(w,bid);ws.done=!ws.done;setWS(w,bid,ws);renderHome()}
function toggleExpandV2(w,bid){const k=`${w}_${bid}`;expandedBlocks[k]=!expandedBlocks[k];renderHome()}
function saveNotesV2(w,bid,n){const ws=getWS(w,bid);ws.notes=n;setWS(w,bid,ws)}
function setDiffV2(w,bid,d){const ws=getWS(w,bid);ws.diff=ws.diff===d?0:d;setWS(w,bid,ws);renderHome()}
function toggleTravelV2(){setTravelState(currentWeek,document.getElementById('travel-toggle').checked);renderHome()}

/* ---------- PR WALL ---------- */
function fmtVal(v,unit){const u=unit==='seconds'?'s':unit==='inches'?'"':unit==='meters'?'m':'';return v+u}
function sparkSVG(vals,color){
  if(vals.length<2)return'';
  const w=120,h=34,pad=5,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1),h-pad-(v-mn)/rg*(h-2*pad)]);
  const d=pts.map(p=>(Math.round(p[0]*10)/10)+','+(Math.round(p[1]*10)/10)).join(' ');
  const lp=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3" fill="${color}"/></svg>`}
function renderPR(){
  let gh='';
  TESTS.forEach(t=>{
    const r=getTestResults(t.id);let inner='';
    if(!r.length){inner=`<div class="pr-best num dim">—</div><div class="pr-sub"><span class="dim">No data yet</span></div>`}
    else{
      const best=t.lowerIsBetter?Math.min(...r.map(x=>x.value)):Math.max(...r.map(x=>x.value));
      let delta='<span class="dim">Baseline set</span>',base='';
      if(r.length>=2){
        const prev=r[r.length-2].value,l=r[r.length-1].value,dp=(l-prev)/prev*100,imp=t.lowerIsBetter?l<prev:l>prev;
        delta=`<span class="pr-delta ${imp?'good':'bad'}">${imp?'▲':'▼'} ${Math.abs(dp).toFixed(1)}% last test</span>`;
        const f=r[0].value,bp=(r[r.length-1].value-f)/f*100,bimp=t.lowerIsBetter?r[r.length-1].value<f:r[r.length-1].value>f;
        base=`<div class="pr-baseline"><span class="pr-base ${bimp?'good':'bad'}">${bimp?'▲':'▼'} ${Math.abs(bp).toFixed(1)}% since baseline</span></div>`}
      inner=`<div class="pr-best num" style="color:${t.color}">${fmtVal(best,t.unit)}</div><div class="pr-sub">${delta}</div>${sparkSVG(r.map(x=>x.value),t.color)}${base}`}
    gh+=`<button class="pr-card${t.id===activeTestId?' sel':''}" style="--tc:${t.color}" onclick="selectTestV2('${t.id}')"><div class="pr-name">${t.icon} ${t.name}</div>${inner}</button>`});
  document.getElementById('pr-grid').innerHTML=gh;
  renderPRDetail()}
function renderPRDetail(){
  const test=TESTS.find(t=>t.id===activeTestId),results=getTestResults(test.id);
  let html=`<div class="panel pr-panel" style="--tc:${test.color}"><h3 class="tname">${test.icon} ${test.name}</h3><div class="pr-meta" style="color:${test.color}">${test.cat} • ${test.lowerIsBetter?'Lower':'Higher'} is better • ${test.unit}</div>`;
  html+=`<div class="entry-row"><div class="inp-group"><label>Test Week</label><select id="test-week-select">`;
  TEST_WEEKS.forEach(w=>{const d=getWeekDates(w),has=results.some(r=>r.week===w);html+=`<option value="${w}">Wk ${w+1} (${fmtDate(d[0])})${has?' ✓':''}</option>`});
  html+=`</select></div><div class="inp-group"><label>Result (${test.unit})</label><input type="number" step="any" id="test-value-input" placeholder="Enter result" inputmode="decimal"></div><button class="save-btn" onclick="saveTestV2()">SAVE</button><span class="save-msg" id="save-msg">Saved!</span></div>`;
  if(results.length>0){
    const pv=test.lowerIsBetter?Math.min(...results.map(r=>r.value)):Math.max(...results.map(r=>r.value));
    html+=`<table class="results-table"><thead><tr><th>Week</th><th>Date</th><th>Result</th><th>Δ</th><th></th></tr></thead><tbody>`;
    results.forEach((r,i)=>{
      const d=getWeekDates(r.week),isPR=r.value===pv;let ch='';
      if(i>0){const prev=results[i-1].value,diff=r.value-prev,pct=((diff/prev)*100).toFixed(1),imp=test.lowerIsBetter?(diff<0):(diff>0);
        ch=`<span class="improve-badge ${imp?'improve-up':'improve-down'}">${imp?'▲':'▼'} ${Math.abs(pct)}%</span>`}
      else ch='<span class="dim" style="font-size:11px">Base</span>';
      html+=`<tr><td>Wk ${r.week+1}</td><td>${fmtDate(d[0])}</td><td><strong class="num" style="font-size:15px">${r.value}</strong> <span class="dim" style="font-size:11px">${test.unit}</span>${isPR?' <span class="pr-badge">PR!</span>':''}</td><td>${ch}</td><td><button class="delete-btn" onclick="deleteTestV2(${r.week})">✕</button></td></tr>`});
    html+=`</tbody></table>`;
  }else html+=`<div class="no-data-msg">No results yet. Run your first test and put a number on the board!</div>`;
  html+=`<details class="proto"><summary>Test protocol &amp; tips</summary><div class="proto-body">${test.protocol}</div></details></div>`;
  document.getElementById('pr-detail').innerHTML=html}
function selectTestV2(id){activeTestId=id;renderPR()}
function saveTestV2(){
  const wk=parseInt(document.getElementById('test-week-select').value),val=document.getElementById('test-value-input').value;
  if(!val||isNaN(parseFloat(val)))return;
  saveTestResult(activeTestId,wk,val);
  document.getElementById('test-value-input').value='';
  const m=document.getElementById('save-msg');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2000);
  renderPR()}
function deleteTestV2(wk){if(confirm('Delete this test result?')){deleteTestResult(activeTestId,wk);renderPR()}}

/* ---------- PROGRESS (honest stats: only weeks that have happened) ---------- */
function computeHonestStats(){
  const cap=Math.min(getCurrentWeekIdx(),TOTAL_WEEKS-1);
  let tB=0,cB=0;const cs={};Object.keys(CATEGORIES).forEach(c=>{cs[c]={total:0,done:0}});const wr=[];
  for(let w=0;w<=cap;w++){
    if(isTravel(w)){wr.push(null);continue}
    const bl=getAllBlocks(getPhase(w));let wT=0,wD=0;
    bl.forEach(b=>{tB++;wT++;cs[b.cat].total++;if(getWS(w,b.id).done){cB++;wD++;cs[b.cat].done++}});
    wr.push(wT>0?Math.round(wD/wT*100):0)}
  let streak=0;
  for(let w=getCurrentWeekIdx();w>=0;w--){
    if(isTravel(w))continue;
    const bl=getAllBlocks(getPhase(w));
    if(bl.every(b=>getWS(w,b.id).done)&&bl.length>0)streak++;else if(w<getCurrentWeekIdx())break}
  let tR=0;
  for(let w=0;w<=cap;w++){if(isTravel(w))continue;getAllBlocks(getPhase(w)).forEach(b=>{if(getWS(w,b.id).diff>0)tR++})}
  return{cap,totalBlocks:tB,doneBlocks:cB,pct:tB>0?Math.round(cB/tB*100):0,weekRates:wr,catStats:cs,streak,ratings:tR}}
function diffChartSVG(cap){
  const W=340,H=150,padL=44,padR=10,padT=10,padB=22,n=cap+1;
  const x=i=>padL+(n===1?(W-padL-padR)/2:i*(W-padL-padR)/(n-1));
  const y=v=>padT+(3-v)*(H-padT-padB)/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  [[3,'HARD'],[2,'RIGHT'],[1,'EASY']].forEach(g=>{s+=`<line x1="${padL}" y1="${y(g[0])}" x2="${W-padR}" y2="${y(g[0])}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${padL-6}" y="${y(g[0])+3}" text-anchor="end" class="ax">${g[1]}</text>`});
  for(let i=0;i<n;i++)if(n<=7||i%2===0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">W${i+1}</text>`;
  let anyLine=false;
  Object.keys(CATEGORIES).forEach(k=>{
    const hist=getCatDiffHistory(k).slice(0,n);let d='',started=false;
    hist.forEach((v,i)=>{if(v===null)return;d+=(started?' L ':'M ')+x(i)+' '+y(v);started=true});
    if(!d)return;anyLine=true;
    s+=`<path d="${d}" fill="none" stroke="${CAT_UI[k]}" stroke-width="2" stroke-linejoin="round"/>`;
    hist.forEach((v,i)=>{if(v!==null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${CAT_UI[k]}"/>`})});
  s+='</svg>';
  return anyLine?s:'<div class="no-data-msg">Rate workouts (Too Easy / Just Right / Too Hard) to see the trend.</div>'}
function renderProgressV2(){
  const st=computeHonestStats();
  document.getElementById('stat-cards').innerHTML=
    `<div class="statBox"><div class="v" style="color:var(--green-glow)">${st.pct}%</div><div class="l">Completion</div></div>`+
    `<div class="statBox"><div class="v" style="color:var(--blue)">${st.doneBlocks}</div><div class="l">Blocks Done</div></div>`+
    `<div class="statBox"><div class="v" style="color:var(--amber)">${st.ratings}</div><div class="l">Ratings</div></div>`+
    `<div class="statBox"><div class="v" style="color:#a78bfa">${st.streak}</div><div class="l">Week Streak</div></div>`+
    `<div class="honest-note">Honest stats — counted through Week ${st.cap+1} only. The future doesn't count yet.</div>`;
  let bh='';
  st.weekRates.forEach((v,i)=>{
    const tvw=v===null,cls=tvw?'travel':v>=80?'hi':v>=50?'mid':'lo';
    bh+=`<div class="wb"><span class="wb-v num">${tvw?'✈':v+'%'}</span><div class="wb-bar ${cls}" style="height:${tvw?60:Math.max(v,3)}%"></div><span class="wb-l">W${i+1}</span></div>`});
  document.getElementById('weekly-bars').innerHTML=bh;
  let ch='';
  Object.keys(CATEGORIES).forEach(k=>{
    const c=st.catStats[k];if(!c.total)return;
    const p=Math.round(c.done/c.total*100);
    ch+=`<div class="cat-row"><span class="cl" style="color:${CAT_UI[k]}">${CATEGORIES[k].label}</span><div class="ctrack"><div class="cfill" style="width:${p}%;background:${CAT_UI[k]}"></div></div><span class="cv">${c.done}/${c.total} · ${p}%</span></div>`});
  document.getElementById('cat-bars').innerHTML=ch||'<div class="no-data-msg">No training weeks yet.</div>';
  document.getElementById('diff-chart').innerHTML=diffChartSVG(st.cap);
  document.getElementById('diff-legend').innerHTML=Object.keys(CATEGORIES).map(k=>`<span><i style="background:${CAT_UI[k]}"></i>${CATEGORIES[k].label}</span>`).join('')}

/* ---------- TABS ---------- */
function showTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(t+'-tab').classList.add('active');
  document.getElementById('nav-'+t).classList.add('active');
  if(t==='home')renderHome();
  if(t==='pr')renderPR();
  if(t==='progress')renderProgressV2();
  if(t==='insights')renderInsights();
  if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0)}

/* ---------- BACKUP / RESTORE ---------- */
function buildExportJSON(){return JSON.stringify({app:'Summer Training Dashboard',key:'trainingV5',exportedAt:new Date().toISOString(),data:getState()},null,2)}
function applyImport(text){
  let p;try{p=JSON.parse(text)}catch(e){return{ok:false,msg:'That is not valid JSON.'}}
  let data=null;
  if(p&&typeof p==='object'&&!Array.isArray(p)){
    if(p.key==='trainingV5'&&p.data&&typeof p.data==='object'&&!Array.isArray(p.data))data=p.data;
    else if(!p.key&&!p.data)data=p}
  if(!data)return{ok:false,msg:'Not a valid training backup.'};
  const n=Object.keys(data).length;
  if(typeof confirm==='function'&&!confirm(`Import backup with ${n} entries? This REPLACES all current data on this device.`))return{ok:false,msg:'Import cancelled.'};
  saveState(data);
  return{ok:true,msg:`Imported ${n} entries ✓`}}
function exportData(){
  const json=buildExportJSON(),blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='training-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  setBackupMsg('Backup downloaded ✓')}
function importFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const r=applyImport(rd.result);setBackupMsg(r.msg);if(r.ok)refreshAll()};
  rd.readAsText(f);inp.value=''}
function importPasted(){
  const t=document.getElementById('import-text').value.trim();
  if(!t){setBackupMsg('Paste backup JSON first.');return}
  const r=applyImport(t);setBackupMsg(r.msg);
  if(r.ok){document.getElementById('import-text').value='';refreshAll()}}
function refreshAll(){lastFocusWeek=-1;renderHome();if(activeTab==='pr')renderPR();if(activeTab==='progress')renderProgressV2();if(activeTab==='insights')renderInsights()}
function setBackupMsg(m){const el=document.getElementById('backup-msg');el.textContent=m;setTimeout(()=>{if(el.textContent===m)el.textContent=''},5000)}

/* ---------- INIT ---------- */
function initV2(){goToday(false);showTab('home')}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('home-tab')){initV2()}
</script>
